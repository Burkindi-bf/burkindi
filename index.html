  if(sansC) pb.push(sansC+" élève(s) sans sexe renseigné : ils ne seront comptés ni "
    +"chez les garçons ni chez les filles dans les statistiques.");
  if(pb.length) h+='<div class="'+(coefsPrets(c)?'prudence':'avert')+'">'
    +pb.map(esc).join("<br>")
    +(sans&&vueAutorisee("notes")?'<div class="barre-actions" style="margin:10px 0 0"><button class="btn" onclick="voirManquantes()">'
      +(sans===1?'Compléter la note manquante':'Voir et compléter les '+sans+' notes manquantes')+'</button></div>':'')+'</div>';
  if(trimActif===3) h+=controleRedoublementHTML(c,els);
  else h+='<div class="info">Tout est en place pour ce trimestre.</div>';

  if(coefsPrets(c)){
    const st=statsDe(c.id,trimActif);
    if(st.evalues){
      h+='<h2>Aperçu de la classe</h2><div class="defile court"><table class="tsaisie">'
       +'<tr><th></th><th>Garçons</th><th>Filles</th><th>Total</th></tr>'
       +apLg("Évalués",st.nG,st.nF,st.evalues)
       +apLg("Moyenne",n2(st.moyG),n2(st.moyF),n2(st.moyT))
       +apLg("Ont la moyenne",st.reuG,st.reuF,st.reuT)
       +apLg("Taux de réussite",st.nG?pct(100*st.reuG/st.nG):"—",
             st.nF?pct(100*st.reuF/st.nF):"—",pct(100*st.reuT/st.evalues))
       +'</table></div>';
    }
  }
  h+='<h2>Documents à imprimer</h2>'
   +'<p class="sous">Toute la classe en une seule fois. Le format deux par page sort une feuille '
   +'A4 en paysage portant deux bulletins à couper au milieu.</p>'
   +'<div class="barre-actions">'
   +'<button class="btn plein" onclick="imprimer(\'bulletins2\')">Bulletins — 2 par page (A4 paysage)</button>'
   +'<button class="btn sec" onclick="imprimer(\'bulletins1\')">Bulletins — 1 par page</button></div>'
   +'<div class="barre-actions">'
   +'<button class="btn sec" onclick="imprimer(\'statclasse\')">Fiche statistique de la classe</button>'
   +'<button class="btn sec" onclick="imprimer(\'merite\')">Liste par ordre de mérite</button>'
   +'<button class="btn sec" onclick="imprimer(\'fichenotes\')">Fiche de notes vierge</button></div>'
   +'<h2>V\u00e9rification avant impression</h2>'
   +'<p class="sous">Une ligne par \u00e9l\u00e8ve, une colonne par discipline, avec le total '
   +'pond\u00e9r\u00e9 et la moyenne. \u00c0 relire avec les \u00e9l\u00e8ves avant d\'imprimer les bulletins.</p>'
   +'<div class="barre-actions">'
   +'<button class="btn plein" onclick="imprimer(\'verif\')">Fiche du professeur principal — '
   +libTrim(trimActif)+'</button></div>'
   +'<h2>Synthèse de tout l\'établissement</h2>'
   +'<p class="sous">Toutes les classes réunies pour '+libTrim(trimActif)+' : une ligne par classe, '
   +'l\'écart filles-garçons et les repères de l\'établissement. Ce document ne dépend pas de la '
   +'classe choisie ci-dessus.</p>'
   +'<div class="barre-actions">'
   +'<button class="btn plein" onclick="imprimer(\'synthetab\')">Synthèse de l\'établissement — '
   +libTrim(trimActif)+'</button></div>';
  h+=choixSignataireHTML();
  h+='<h2>Bilans de fin d\'année</h2>'
   +'<p class="sous">Calculés sur la moyenne annuelle, quand les trois trimestres sont saisis. '
   +'</p>'
   +'<div class="barre-actions">'
   +'<button class="btn sec" onclick="imprimer(\'bilanclasse\')">Bilan annuel de la classe</button>'
   +'<button class="btn sec" onclick="imprimer(\'bilanetab\')">Bilan annuel de l\'établissement</button></div>';
  if(els.length){
    h+='<h2>Réimprimer le bulletin d\'un seul élève</h2><div class="champ">'
     +'<select id="unEleve"><option value="">— choisir —</option>'
     + els.map(e=>'<option value="'+e.id+'">'+esc(e.nom)+'</option>').join("")
     +'</select></div><div class="barre-actions">'
     +'<button class="btn sec" onclick="imprimerUn()">Imprimer ce bulletin</button></div>';
  }
  return h;
};
function apLg(l,a,b,t){ return '<tr><td style="text-align:left">'+l+'</td><td>'+a+'</td><td>'
  +b+'</td><td><strong>'+t+'</strong></td></tr>'; }

function lieuDoc(){
  const e=S.etab||{};
  return String(e.lieuSign||"").trim() || String(e.village||"").trim()
      || String(e.commune||"").trim();
}
let signataireBul="chef";   /* "chef" ou "po", choisi au moment d'imprimer les bulletins */
function poActif(){ const p=(S.etab||{}).po; return !!(p&&p.nom); }
function piedPP(cid){
  const p=ppDe(cid);
  const d=new Date().toLocaleDateString("fr-FR"), E=S.etab||{};
  return '<div class="bpied"><div class="bl"><div class="dt">&nbsp;</div><div class="lb">Le Professeur principal</div><div class="sp"></div>'
   +(p?'<div class="nm">'+esc(p.nom)+'</div>'+(p.diplome?'<div class="ql">'+esc(p.diplome)+'</div>':''):'')+'</div>'
   +'<div class="bl"><div class="dt">'+esc(lieuDoc())+', le '+d+'</div>'
   +'<div class="lb">Vu, '+esc(String(E.titreChef||"Le Chef d\'établissement"))+'</div><div class="sp"></div>'+nomChefHTML()+'</div></div>';
}
function piedSignature(gauche,pourBulletin){
  const d=new Date().toLocaleDateString("fr-FR"), E=S.etab||{};
  let droite='<div class="lb">Le Chef d\'établissement</div><div class="sp"></div>'+nomChefHTML();
  if(pourBulletin&&signataireBul==="po"&&poActif()){
    const t=String(E.titreChef||"Le Directeur").replace(/^Le /,"le ");
    droite='<div class="lb">Pour '+esc(t)+' et par ordre,</div>'+(E.po.fonction?'<div class="lb">'+esc(E.po.fonction)+'</div>':'')
     +'<div class="sp"></div><div class="nm">'+esc(E.po.nom)+'</div>'+(E.po.qualif?'<div class="ql">'+esc(E.po.qualif)+'</div>':'');
  }
  return '<div class="bpied">'+(gauche?'<div class="bl"><div class="dt">&nbsp;</div>'
   +'<div class="lb">'+esc(gauche)+'</div><div class="sp"></div></div>':'<div class="bl"></div>')
   +'<div class="bl"><div class="dt">'+esc(lieuDoc())+', le '+d+'</div>'+droite+'</div></div>';
}
function choixSignataireHTML(){
  if(!poActif()) return '';
  const p=S.etab.po;
  return '<div class="champ"><label>Signataire des bulletins</label><select onchange="signataireBul=this.value">'
   +'<option value="chef"'+(signataireBul==="chef"?' selected':'')+'>'+esc(S.etab.titreChef||"Le chef d\'établissement")+' — '+esc(S.etab.chef||"")+'</option>'
   +'<option value="po"'+(signataireBul==="po"?' selected':'')+'>Par ordre (P.O.) — '+esc(p.nom)+(p.fonction?', '+esc(p.fonction):'')+'</option>'
   +'</select></div>';
}

/* Nom du chef en gras souligné, qualification en italique, sous l'espace du cachet. */
function nomChefHTML(){
  const e=S.etab||{};
  return (e.chef?'<div class="nm">'+esc(e.chef)+'</div>':'')
   +(e.qualifChef?'<div class="ql">'+esc(e.qualifChef)+'</div>':'');
}
/* ------------------------------ BULLETIN ------------------------------- */
function bulletinHTML(el,t){
  const c=classe(el.classeId), b=bulletinDe(el,t), st=statsDe(c.id,t);
  const rang=rangDe(c.id,t,el.id), pret=coefsPrets(c);
  const nm=matieresActives(classe(el.classeId)).length;
  let h='<div class="bul'+(nm>=11?' m11':(nm>=10?' m10':''))+'">'+enteteAdmin()
   +'<div class="btit">BULLETIN DE NOTES<span>'+libTrimMaj(t)+'</span></div>'
   +'<div class="bcad bid"><span>Nom et prénoms : <b>'+esc(el.nom)+'</b></span>'
   +'<span>Sexe : <b>'+esc(el.sexe||"—")+'</b></span>'
   +'<span>Né(e) le '+esc(el.naiss||"—")+' à '+esc(el.lieu||"—")+'</span>'
   +'<span>Classe : <b>'+esc(c.code)+'</b></span>'
   +'<span>Effectif : '+elevesDe(c.id,t).length+'</span>'
   +'<span>Classe(s) redoublée(s) : '+esc(el.redouble||"Néant")+'</span></div>';

  h+='<table class="bt"><colgroup><col style="width:33%"><col style="width:7%"><col style="width:8%">'
   +'<col style="width:7.5%"><col style="width:5.5%"><col style="width:8%">'
   +'<col style="width:16%"><col style="width:15%"></colgroup><tr>'
   +'<th>Disciplines</th><th>Devoirs</th><th>Compo-<br>sition</th><th>Moyenne</th><th>Coef.</th>'
   +'<th>Moyenne<br>pondérée</th><th>Appréciations des professeurs</th><th>Signature</th></tr>';
  b.lignes.forEach(function(l){
    h+='<tr><td class="ga">'+esc(l.lib)+'</td><td class="ce">'+n2(l.md)+'</td>'
     +'<td class="ce">'+n2(l.compo)+'</td><td class="ce"><b>'+n2(l.moy)+'</b></td>'
     +'<td class="ce">'+l.coef+'</td><td class="ce">'+n2(l.pd)+'</td>'
     +'<td class="ga">'+esc(l.app)+'</td><td></td></tr>';
  });
  h+='</table>';

  const ind=pret?"":"indisponible";
  h+='<div class="bbas"><div class="bc bcad"><div class="cp">Calcul de la moyenne</div>'
   +lgB("Total des moyennes pondérées",n2(b.totalPond))
   +lgB("Retrait de points (absences, conduite)","− "+n2(b.retrait||0))
   +lgB("Total après retrait",n2(b.apres))
   +lgB("Total des coefficients",b.totalCoef)
   +'<div class="lg ft"><span>Moyenne du trimestre</span><span class="v">'
   +(pret&&b.gen!==null?n2(b.gen)+" / 20":ind)+'</span></div></div>'
   +'<div class="bc bcad"><div class="cp">Vie scolaire</div>'
   +lgB("Absences justifiées",(b.vie.absJ||0)+" h")
   +lgB("Absences non justifiées",(b.vie.absN||0)+" h")
   +lgB("Retards",b.vie.ret||0)
   +'<div class="lg"><span>Sanction / distinction</span><span class="v"><b>'
   +esc(pret?b.sanction:"")+'</b></span></div>'
   +lgB("Conduite",b.vie.conduite||"—")+'</div></div>';

  h+='<div class="bres">'
   +cadB("Moyenne",pret&&b.gen!==null?n2(b.gen):"—")
   +cadB("Rang",pret&&rang?ordi(rang):"—","sur "+st.evalues)
   +cadB("Mention",pret?b.mention||"—":"—",null,true)
   +cadB("Moyenne de la classe",pret?n2(st.moyT):"—")
   +cadB("Plus forte / plus faible",
      pret&&st.exT?n2(st.exT.prem.moy)+" / "+n2(st.exT.dern.moy):"—",null,true)
   +'</div>';

  const ma=moyAnnuelle(el);
  /* Seuls les trimestres déjà atteints ont une colonne ; la moyenne annuelle
     et son rang n'apparaissent qu'au bulletin du 3e trimestre. */
  const cols=[1,2,3].filter(k=>k<=t), annuel=(t===3);
  const nc=cols.length+(annuel?1:0), lcol=(72/nc).toFixed(2);
  h+='<div class="bant"><table class="bt"><colgroup><col style="width:28%">'
   +('<col style="width:'+lcol+'%">').repeat(nc)+'</colgroup><tr><th></th>'
   +cols.map(k=>'<th>'+(k===1?'1<sup>er</sup>':k+'<sup>e</sup>')+' trimestre</th>').join("")
   +(annuel?'<th>Moyenne annuelle</th>':'')+'</tr><tr><td class="ga">Moyenne</td>';
  cols.forEach(function(k){
    const bk=bulletinDe(el,k);
    h+='<td class="ce">'+((pret&&bk&&bk.gen!==null)?(k===t?'<b>'+n2(bk.gen)+'</b>':n2(bk.gen)):'')+'</td>';
  });
  if(annuel) h+='<td class="ce">'+(pret&&ma!==null?'<b>'+n2(ma)+'</b>':'')+'</td>';
  h+='</tr><tr><td class="ga">Rang</td>';
  cols.forEach(function(k){
    const r=pret?rangDe(c.id,k,el.id):null;
    h+='<td class="ce">'+(r?(k===t?'<b>'+ordi(r)+'</b>':ordi(r)):'')+'</td>';
  });
  if(annuel){
    const ra=(pret&&ma!==null)?rangAnnuelDe(c.id,el.id):null;
    h+='<td class="ce">'+(ra?'<b>'+ordi(ra)+'</b>':'')+'</td>';
  }
  h+='</tr></table></div>';

  let dec;
  const rcy=redoublementCycle(el,c), exa=estClasseExamen(c);
  if(t===3 && ma!==null){
    const motif=(rcy.oui&&ma>=7&&ma<10&&!exa)?' Motif : second redoublement dans le cycle (classe déjà redoublée : '+esc(rcy.liste.join(", "))+').'
      :((rcy.oui&&ma>=7&&exa)?' Classe déjà redoublée dans le cycle : '+esc(rcy.liste.join(", "))+'.':'');
    dec='<b>Décision du conseil de classe :</b> '+esc(decisionAnnuelle(ma,el,c))
      +'<div class="nt">Décision prise sur la moyenne annuelle de '+n2(ma)+'.'+motif
      +(exa?' Classe d\'examen : décision subordonnée au résultat de l\'examen.':'')+'</div>';
  }else{
    const p=(b.gen===null)?"—":(b.gen>=10?"potentiellement admis(e) en classe supérieure"
      :(b.gen>=7?(rcy.oui&&!exa?"potentiellement exclu(e) (classe déjà redoublée dans le cycle)":"potentiellement redoublant(e)")
      :"potentiellement exclu(e)"));
    dec='<b>Situation au vu de ce trimestre :</b> '+(pret?p:"indisponible")
      +'<div class="nt">Projection indicative. La décision de fin d\'année est prise sur la '
      +'moyenne annuelle, au conseil du 3<sup>e</sup> trimestre.</div>';
  }
  h+='<div class="bdec bcad"><div class="lg"><span><b>Appréciation du conseil de classe :</b> '
   +esc(pret?b.mention:"indisponible")+'</span></div><div class="lg"><span>'+dec+'</span></div></div>';

  if(b.manque) h+='<div class="nt">Bulletin incomplet : '+b.manque+' matière(s) sans note.</div>';
  h+='<div class="esp"></div>'+piedSignature("",true);
  return h+'</div>';
}
function lgB(l,v){ return '<div class="lg"><span>'+esc(l)+'</span><span class="v">'+esc(v)+'</span></div>'; }
function cadB(et,vl,sous,petit){
  return '<div><div class="et">'+esc(et)+'</div><div class="vl'+(petit?' pt':'')+'">'+esc(vl)+'</div>'
   +(sous?'<div class="et">'+esc(sous)+'</div>':'')+'</div>';
}

/* --------------------- FICHE STATISTIQUE DE CLASSE --------------------- */
function statClasseHTML(cid,t){
  const c=classe(cid), s=statsDe(cid,t);
  const p=(n,d)=>d?pct(100*n/d):"—";
  let h='<div class="bfic">'+enteteAdmin()
   +'<div class="btit">FICHE STATISTIQUE DE CLASSE<span>'+libTrimMaj(t)+'</span></div>'
   +'<div class="bcad bid"><span>Classe : <b>'+esc(c.code)+'</b></span>'
   +'<span>Effectif inscrit : <b>'+s.inscrits+'</b></span>'
   +'<span>Effectif évalué : <b>'+s.evalues+'</b></span>'
   +'<span>Date d\'édition : '+new Date().toLocaleDateString("fr-FR")+'</span></div>';
  if(!s.evalues) return h+'<div class="nt">Aucune moyenne calculable pour ce trimestre.</div>'
   +piedPP(cid)+'</div>';

  h+='<div class="sc">1. EFFECTIFS ET RÉSULTATS PAR GENRE</div>'
   +'<table class="bt"><colgroup><col style="width:46%"><col style="width:18%">'
   +'<col style="width:18%"><col style="width:18%"></colgroup>'
   +'<tr><th></th><th>Garçons</th><th>Filles</th><th>Total</th></tr>'
   +lgS("Effectif inscrit",s.inscritsG,s.inscritsF,s.inscrits)
   +lgS("Effectif évalué",s.nG,s.nF,s.evalues)
   +lgS("Part de l'effectif évalué",p(s.nG,s.evalues),p(s.nF,s.evalues),pct(100))
   +lgS("Moyenne",n2(s.moyG),n2(s.moyF),n2(s.moyT),true)
   +lgS("Élèves ayant la moyenne (≥ 10)",s.reuG,s.reuF,s.reuT)
   +lgS("Taux de réussite",p(s.reuG,s.nG),p(s.reuF,s.nF),p(s.reuT,s.evalues),true)
   +lgS("Redoublement prévisible (7 à moins de 10)",s.redG,s.redF,s.redT)
   +lgS("Taux",p(s.redG,s.nG),p(s.redF,s.nF),p(s.redT,s.evalues))
   +lgS("Exclusion prévisible (moins de 7)",s.excG,s.excF,s.excT)
   +lgS("Taux",p(s.excG,s.nG),p(s.excF,s.nF),p(s.excT,s.evalues))
   +'</table>';

  if(s.nG&&s.nF){
    const e=100*s.reuF/s.nF-100*s.reuG/s.nG, em=s.moyF-s.moyG;
    const pt=x=>(Math.round(Math.abs(x)*10)/10).toString().replace(".",",");
    const t1=(Math.abs(e)<0.05)
      ? 'filles et garçons réussissent au même taux'
      : 'les filles réussissent '+(e>0?"mieux":"moins bien")+' de <b>'+pt(e)+' point'
        +(Math.abs(e)>=2?'s':'')+'</b> de pourcentage';
    const t2=(Math.abs(em)<0.005)
      ? 'et leur moyenne est identique à celle des garçons'
      : 'et leur moyenne est '+(em>0?"supérieure":"inférieure")+' de <b>'+n2(Math.abs(em))
        +' point'+(Math.abs(em)>=2?'s':'')+'</b> à celle des garçons';
    h+='<div class="ec"><b>ÉCART FILLES – GARÇONS :</b> '+t1+', '+t2+'. '
     +'Indicateur à suivre d\'un trimestre à l\'autre.</div>';
  }

  h+='<div class="sc">2. RÉPARTITION PAR MENTION</div>'
   +'<table class="bt"><colgroup><col style="width:34%"><col style="width:14%"><col style="width:14%">'
   +'<col style="width:14%"><col style="width:24%"></colgroup>'
   +'<tr><th>Mention</th><th>Garçons</th><th>Filles</th><th>Total</th><th>Part de la classe</th></tr>';
  MENTIONS.forEach(function(mn){
    const g=s.g.filter(x=>mention(x.moy)===mn.l).length,
          f=s.f.filter(x=>mention(x.moy)===mn.l).length;
    h+='<tr><td class="ga">'+mn.l+'</td><td class="ce">'+g+'</td><td class="ce">'+f+'</td>'
     +'<td class="ce">'+(g+f)+'</td><td class="ce">'+p(g+f,s.evalues)+'</td></tr>';
  });
  h+='<tr class="to"><td class="ga">Total</td><td class="ce">'+s.nG+'</td><td class="ce">'+s.nF
   +'</td><td class="ce">'+s.evalues+'</td><td class="ce">'+pct(100)+'</td></tr></table>';

  h+='<div class="sc">3. FIGURES MARQUANTES DE LA CLASSE</div>'
   +'<table class="bt"><colgroup><col style="width:34%"><col style="width:12%">'
   +'<col style="width:36%"><col style="width:18%"></colgroup>'
   +'<tr><th></th><th>Rang</th><th>Nom et prénoms</th><th>Moyenne</th></tr>';
  [["Premier(ère) de la classe",s.exT&&s.exT.prem],["Dernier(ère) de la classe",s.exT&&s.exT.dern],
   ["Premier des garçons",s.exG&&s.exG.prem],["Dernier des garçons",s.exG&&s.exG.dern],
   ["Première des filles",s.exF&&s.exF.prem],["Dernière des filles",s.exF&&s.exF.dern]]
  .forEach(function(x){
    h+='<tr><td class="ga">'+x[0]+'</td>'+(x[1]
      ?'<td class="ce">'+ordi(x[1].rang)+'</td><td class="ga">'+esc(x[1].el.nom)+'</td>'
       +'<td class="ce"><b>'+n2(x[1].moy)+'</b></td>'
      :'<td class="ce">—</td><td class="ga">—</td><td class="ce">—</td>')+'</tr>';
  });
  h+='</table>';
  const mq=manquesDe(c);
  if(mq.length) h+='<div class="ec">MATIÈRE(S) OBLIGATOIRE(S) NON ASSURÉE(S) : '
   +mq.map(m=>esc(m.lib)+(m.motif?" — "+esc(m.motif):"")).join(" ; ")+'.</div>';
  h+='<div class="nt">La liste des élèves par ordre de mérite fait l\'objet d\'un document séparé.</div>';
  return h+piedPP(cid)+'</div>';
}
function lgS(l,a,b,t,gras){
  return '<tr'+(gras?' class="to"':'')+'><td class="ga">'+l+'</td><td class="ce">'+a
   +'</td><td class="ce">'+b+'</td><td class="ce">'+t+'</td></tr>';
}

/* --------------- SYNTHÈSE DE L'ÉTABLISSEMENT (toutes classes) ---------- */
function syntheseEtabHTML(t){
  const E=statsEtab(t);
  const p=(a,b)=>b?pct(100*a/b):"\u2014";
  let h='<div class="bfic flot">'+enteteAdmin()
   +'<div class="btit">SYNTH\u00c8SE DE L\'\u00c9TABLISSEMENT<span>'+libTrimMaj(t)+'</span></div>'
   +'<div class="bcad bid"><span>\u00c9tablissement : <b>'+esc(S.etab.nom||"\u2014")+'</b></span>'
   +'<span>Classes : <b>'+E.classes+'</b></span>'
   +'<span>Effectif inscrit : <b>'+E.inscrits+'</b></span>'
   +'<span>Effectif \u00e9valu\u00e9 : <b>'+E.evalues+'</b></span>'
   +'<span>Date d\'\u00e9dition : '+new Date().toLocaleDateString("fr-FR")+'</span></div>';

  if(!E.evalues) return h+'<div class="nt">Aucune moyenne g\u00e9n\u00e9rale n\'est calculable pour ce '
   +'trimestre. V\u00e9rifiez que les grilles de coefficients sont confirm\u00e9es et que les notes sont '
   +'saisies.</div>'+piedSignature("Vu, le Directeur Provincial")+'</div>';

  h+='<div class="bres"><div><div class="et">Moyenne de l\'\u00e9tablissement</div>'
   +'<div class="vl">'+n2(E.moyT)+'</div></div>'
   +'<div><div class="et">Taux de r\u00e9ussite</div><div class="vl">'+p(E.reuT,E.evalues)+'</div></div>'
   +'<div><div class="et">\u00c9l\u00e8ves ayant la moyenne</div><div class="vl">'+E.reuT
   +'<span style="font-size:.5em"> / '+E.evalues+'</span></div></div></div>';

  /* 1. une ligne par classe */
  h+='<div class="sc">1. R\u00c9SULTATS PAR CLASSE</div>'
   +'<table class="bt"><colgroup><col style="width:14%"><col style="width:10%"><col style="width:10%">'
   +'<col style="width:12%"><col style="width:13%"><col style="width:13%"><col style="width:13%">'
   +'<col style="width:15%"></colgroup>'
   +'<tr><th>Classe</th><th>Inscrits</th><th>\u00c9valu\u00e9s</th><th>Moyenne</th>'
   +'<th>R\u00e9ussite<br>gar\u00e7ons</th><th>R\u00e9ussite<br>filles</th><th>R\u00e9ussite<br>ensemble</th>'
   +'<th>\u00c9cart F \u2013 G<br>(points de %)</th></tr>';
  E.lignes.forEach(function(l){
    const st=l.s;
    if(!l.pret){
      h+='<tr><td class="ga">'+esc(l.c.code)+'</td><td class="ce">'+st.inscrits+'</td>'
       +'<td class="ce" colspan="6">Grille de coefficients non confirm\u00e9e</td></tr>';
      return;
    }
    if(!st.evalues){
      h+='<tr><td class="ga">'+esc(l.c.code)+'</td><td class="ce">'+st.inscrits+'</td>'
       +'<td class="ce" colspan="6">Aucune moyenne calculable</td></tr>';
      return;
    }
    const ec=(st.nG&&st.nF)?(100*st.reuF/st.nF-100*st.reuG/st.nG):null;
    h+='<tr><td class="ga">'+esc(l.c.code)+'</td><td class="ce">'+st.inscrits+'</td>'
     +'<td class="ce">'+st.evalues+'</td><td class="ce"><b>'+n2(st.moyT)+'</b></td>'
     +'<td class="ce">'+p(st.reuG,st.nG)+'</td><td class="ce">'+p(st.reuF,st.nF)+'</td>'
     +'<td class="ce">'+p(st.reuT,st.evalues)+'</td>'
     +'<td class="ce">'+(ec===null?"\u2014":(ec>0?"+":"")+pct(ec))+'</td></tr>';
  });
  const ecG=(E.nG&&E.nF)?(100*E.reuF/E.nF-100*E.reuG/E.nG):null;
  h+='<tr class="to"><td class="ga">Ensemble de l\'\u00e9tablissement</td><td class="ce">'+E.inscrits+'</td>'
   +'<td class="ce">'+E.evalues+'</td><td class="ce">'+n2(E.moyT)+'</td>'
   +'<td class="ce">'+p(E.reuG,E.nG)+'</td><td class="ce">'+p(E.reuF,E.nF)+'</td>'
   +'<td class="ce">'+p(E.reuT,E.evalues)+'</td>'
   +'<td class="ce">'+(ecG===null?"\u2014":(ecG>0?"+":"")+pct(ecG))+'</td></tr></table>';

  /* 2. effectifs et resultats par genre */
  h+='<div class="sc">2. EFFECTIFS ET R\u00c9SULTATS PAR GENRE</div>'
   +'<table class="bt"><colgroup><col style="width:46%"><col style="width:18%">'
   +'<col style="width:18%"><col style="width:18%"></colgroup>'
   +'<tr><th></th><th>Gar\u00e7ons</th><th>Filles</th><th>Total</th></tr>'
   +lgS("Effectif inscrit",E.inscritsG,E.inscritsF,E.inscrits)
   +lgS("Effectif \u00e9valu\u00e9",E.nG,E.nF,E.evalues)
   +lgS("Moyenne",n2(E.moyG),n2(E.moyF),n2(E.moyT),true)
   +lgS("\u00c9l\u00e8ves ayant la moyenne (\u2265 10)",E.reuG,E.reuF,E.reuT)
   +lgS("Taux de r\u00e9ussite",p(E.reuG,E.nG),p(E.reuF,E.nF),p(E.reuT,E.evalues),true)
   +lgS("Redoublement pr\u00e9visible (7 \u00e0 moins de 10)",E.redG,E.redF,E.redT)
   +lgS("Exclusion pr\u00e9visible (moins de 7)",E.excG,E.excF,E.excT)
   +'</table>';

  if(E.nG&&E.nF){

/* Le modèle sépare le nom de famille des prénoms : par convention locale,
   le nom est écrit en premier et en majuscules. */
function nomFamille(nom){
  const p=String(nom||"").trim().split(/\s+/);
  const maj=p.filter(x=>x===x.toUpperCase()&&/[A-Z\u00c0-\u00dc]/.test(x));
  return maj.length?maj.join(" "):(p[0]||"");
}
function prenoms(nom){
  const p=String(nom||"").trim().split(/\s+/);
  const maj=p.filter(x=>x===x.toUpperCase()&&/[A-Z\u00c0-\u00dc]/.test(x));
  return maj.length?p.filter(x=>maj.indexOf(x)<0).join(" "):p.slice(1).join(" ");
}
function libSexe(v){ return v==="M"?"Masculin":(v==="F"?"F\u00e9minin":""); }

function cartesHTML(cid){
  const els=cid?elevesDe(cid):ordreEleves(S.eleves);
  if(!els.length) return "";
  let h="", i=0;
  while(i<els.length){
    h+='<div class="cfeuille">';
    for(let k=0;k<10;k++) h+=els[i+k]?carteHTML(els[i+k]):'<div class="carte vide"></div>';
    h+='</div>';
    i+=10;
  }
  return h;
}

/* ======================= BILANS DE FIN D'ANNÉE ========================= */
/* Tout repose sur la moyenne annuelle (moyenne des trois trimestres). Un
   élève à qui il manque un trimestre n'a pas de moyenne annuelle : il n'est
   ni classé ni compté dans les taux, mais il reste listé à part.
   Modèle confirmé par la DPESFPT de la Sissili (septembre 2026). */

const NIV_ORDRE=["6e","5e","4e","3e","2nde","1re","Tle"];
const MENTION_BILAN="";

function classementAnnuelDe(cid){
  const l=elevesDe(cid,3).map(function(e){
    const m=moyAnnuelle(e); return m===null?null:{el:e,moy:m};
  }).filter(Boolean);
  l.sort((a,b)=>b.moy-a.moy||a.el.nom.localeCompare(b.el.nom,"fr"));
  l.forEach((x,i)=>x.rang=i+1);
  return l;
}
function rangAnnuelDe(cid,eid){
  const x=classementAnnuelDe(cid).find(y=>y.el.id===eid); return x?x.rang:null;
}
/* Agrège une liste d'élèves classés {el,moy} et la liste des inscrits. */
function agregerAnnuel(cl,inscrits){
  const g=cl.filter(x=>x.el.sexe==="M"), f=cl.filter(x=>x.el.sexe==="F");
  const moy=a=>{ if(!a.length) return null; let s=0; a.forEach(x=>s+=x.moy); return a2(s/a.length); };
  const cnt=(a,fn)=>a.filter(fn).length;
  const cat=x=>categorieAnnuelle(x.moy,x.el,classe(x.el.classeId));
  const pas=x=>cat(x)==="passe", red=x=>cat(x)==="redouble", exc=x=>cat(x)==="exclu";
  return {cl:cl,g:g,f:f,
    inscrits:inscrits.length,
    inscritsG:inscrits.filter(e=>e.sexe==="M").length,
    inscritsF:inscrits.filter(e=>e.sexe==="F").length,
    classes:cl.length, nG:g.length, nF:f.length,
    moyG:moy(g), moyF:moy(f), moyT:moy(cl),
    pasG:cnt(g,pas), pasF:cnt(f,pas), pasT:cnt(cl,pas),
    redG:cnt(g,red), redF:cnt(f,red), redT:cnt(cl,red),
    excG:cnt(g,exc), excF:cnt(f,exc), excT:cnt(cl,exc)};
}
function decisionCourte(m,el,c){
  if(estClasseExamen(c)&&m>=7) return redoublementCycle(el,c).oui?"Exclu(e) si échec":"Redouble si échec";
  const k=categorieAnnuelle(m,el,c);
  return k==="passe"?"Passe":(k==="redouble"?"Redouble":"Exclu(e)");
}

function ecartTexte(a,titre){
  if(!(a.nG&&a.nF)) return "";
  const e=100*a.pasF/a.nF-100*a.pasG/a.nG, em=a.moyF-a.moyG;
  const pt=x=>(Math.round(Math.abs(x)*10)/10).toString().replace(".",",");
  const t1=(Math.abs(e)<0.05)
    ? 'filles et garçons passent au même taux'
    : 'les filles passent en classe supérieure '+(e>0?"plus":"moins")+' souvent que les garçons, avec <b>'+pt(e)
      +' point'+(Math.abs(e)>=2?'s':'')+'</b> de pourcentage d\'écart';
  const t2=(Math.abs(em)<0.005)
    ? 'et leur moyenne annuelle est identique'
    : 'et leur moyenne annuelle est '+(em>0?"supérieure":"inférieure")+' de <b>'+n2(Math.abs(em))
      +' point'+(Math.abs(em)>=2?'s':'')+'</b>';
  return '<div class="ec"><b>'+titre+' :</b> '+t1+', '+t2+'.</div>';
}
function tableGenreAnnuel(a,cmp){
  const p=(n,d)=>d?pct(100*n/d):"\u2014";
  return '<table class="bt'+(cmp?' cmp':'')+'"><colgroup><col style="width:46%"><col style="width:18%">'
   +'<col style="width:18%"><col style="width:18%"></colgroup>'
   +'<tr><th></th><th>Garçons</th><th>Filles</th><th>Total</th></tr>'
   +lgS("Effectif inscrit",a.inscritsG,a.inscritsF,a.inscrits)
   +lgS("Effectif classé (trois trimestres)",a.nG,a.nF,a.classes)
   +lgS("Moyenne annuelle",n2(a.moyG),n2(a.moyF),n2(a.moyT),true)
   +lgS("Passent en classe supérieure (≥ 10)",a.pasG,a.pasF,a.pasT)
   +lgS("Taux de passage",p(a.pasG,a.nG),p(a.pasF,a.nF),p(a.pasT,a.classes),true)

/* L'application fabrique et lit elle-même de vrais fichiers Excel, sans
   internet et sans bibliothèque extérieure : un fichier .xlsx est un dossier
   compressé de quelques fichiers XML. */

const CRC_T=(function(){
  const t=new Uint32Array(256);
  for(let n=0;n<256;n++){ let c=n; for(let k=0;k<8;k++) c=(c&1)?(0xEDB88320^(c>>>1)):(c>>>1); t[n]=c>>>0; }
  return t;
})();
function crc32(u8){ let c=0xFFFFFFFF; for(let i=0;i<u8.length;i++) c=CRC_T[(c^u8[i])&0xFF]^(c>>>8); return (c^0xFFFFFFFF)>>>0; }
/* Dossier compressé sans compression (méthode « stockée ») : lisible partout. */
function zipStocke(fichiers,type){
  const enc=new TextEncoder(), parts=[], central=[]; let off=0;
  fichiers.forEach(function(f){
    const nom=enc.encode(f.nom), d=(typeof f.data==="string")?enc.encode(f.data):f.data, crc=crc32(d);
    const h=new Uint8Array(30+nom.length), v=new DataView(h.buffer);
    v.setUint32(0,0x04034b50,true); v.setUint16(4,20,true); v.setUint16(6,0x0800,true); v.setUint16(8,0,true);
    v.setUint16(10,0,true); v.setUint16(12,0x21,true); v.setUint32(14,crc,true);
    v.setUint32(18,d.length,true); v.setUint32(22,d.length,true); v.setUint16(26,nom.length,true); v.setUint16(28,0,true);
    h.set(nom,30); parts.push(h,d);
    const c=new Uint8Array(46+nom.length), w=new DataView(c.buffer);
    w.setUint32(0,0x02014b50,true); w.setUint16(4,20,true); w.setUint16(6,20,true); w.setUint16(8,0x0800,true);
    w.setUint16(10,0,true); w.setUint16(12,0,true); w.setUint16(14,0x21,true); w.setUint32(16,crc,true);
    w.setUint32(20,d.length,true); w.setUint32(24,d.length,true); w.setUint16(28,nom.length,true);
    w.setUint32(42,off,true); c.set(nom,46); central.push(c);
    off+=h.length+d.length;
  });
  const tc=central.reduce((a,x)=>a+x.length,0), e=new Uint8Array(22), ev=new DataView(e.buffer);
  ev.setUint32(0,0x06054b50,true); ev.setUint16(8,fichiers.length,true); ev.setUint16(10,fichiers.length,true);
  ev.setUint32(12,tc,true); ev.setUint32(16,off,true);
  return new Blob(parts.concat(central,[e]),{type:type||"application/zip"});
}
function colL(n){ let s=""; n++; while(n>0){ const m=(n-1)%26; s=String.fromCharCode(65+m)+s; n=Math.floor((n-1)/26); } return s; }
function xe(s){ return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }
/* Empreinte du mot de passe de protection de feuille (algorithme historique d'Excel). */
function hashMdp(p){
  let h=0;
  for(let i=p.length-1;i>=0;i--){ h=((h>>14)&1)|((h<<1)&0x7fff); h^=p.charCodeAt(i); }
  h=((h>>14)&1)|((h<<1)&0x7fff); h^=p.length; h^=0xCE4B;
  return h.toString(16).toUpperCase();
}

/* ---------------- Lecture d'un fichier Excel rendu -------------------- */
function lireZip(buf){
  const u8=new Uint8Array(buf), dv=new DataView(buf); let e=-1;
  for(let i=u8.length-22;i>=Math.max(0,u8.length-65557);i--){ if(dv.getUint32(i,true)===0x06054b50){ e=i; break; } }
  if(e<0) throw new Error("zip");
  const n=dv.getUint16(e+10,true); let p=dv.getUint32(e+16,true); const res={};
  for(let k=0;k<n;k++){
    if(dv.getUint32(p,true)!==0x02014b50) throw new Error("zip");
    const meth=dv.getUint16(p+10,true), csz=dv.getUint32(p+20,true), nl=dv.getUint16(p+28,true),
          xl=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true), lo=dv.getUint32(p+42,true);
    const nom=new TextDecoder().decode(u8.subarray(p+46,p+46+nl));
    const d0=lo+30+dv.getUint16(lo+26,true)+dv.getUint16(lo+28,true);
    res[nom.replace(/^\//,"")]={meth:meth,data:u8.subarray(d0,d0+csz)};
    p+=46+nl+xl+cl;
  }
  return res;
}
async function texteZip(ent){
  if(!ent) return null;
  if(ent.meth===0) return new TextDecoder().decode(ent.data);
  if(ent.meth===8){
    if(typeof DecompressionStream==="undefined") throw new Error("navigateur");
    const flux=new Blob([ent.data]).stream().pipeThrough(new DecompressionStream("deflate-raw"));
    return await new Response(flux).text();
  }
  throw new Error("methode");
}
function refCell(r){ const m=/^([A-Z]+)(\d+)$/.exec(r||""); if(!m) return null;
  let c=0; for(const ch of m[1]) c=c*26+(ch.charCodeAt(0)-64); return {c:c-1,r:+m[2]-1}; }
/* Rend {nomOnglet: grille[ligne][colonne]} avec des valeurs lues (nombre ou texte). */
async function lireClasseur(buf){
  const z=lireZip(buf), P=new DOMParser();
  const xml=async n=>{ const t=await texteZip(z[n]); return t?P.parseFromString(t,"application/xml"):null; };
  const wb=await xml("xl/workbook.xml"); if(!wb) throw new Error("classeur");
  const rels=await xml("xl/_rels/workbook.xml.rels"), cible={};
  [...rels.getElementsByTagName("Relationship")].forEach(r=>{ cible[r.getAttribute("Id")]=r.getAttribute("Target"); });
  const ss=await xml("xl/sharedStrings.xml"), partages=[];
  if(ss) [...ss.getElementsByTagName("si")].forEach(si=>{ partages.push([...si.getElementsByTagName("t")].map(t=>t.textContent).join("")); });
  const res={};
  for(const sh of [...wb.getElementsByTagName("sheet")]){
    const rid=sh.getAttribute("r:id")||sh.getAttributeNS("http://schemas.openxmlformats.org/officeDocument/2006/relationships","id");
    let t=cible[rid]||""; t=t.replace(/^\/?xl\//,"").replace(/^\//,"");
    const doc=await xml("xl/"+t); if(!doc) continue;
    const g=[];
    let rgPrec=-1, colPrec=-1;
    [...doc.getElementsByTagName("c")].forEach(function(c){
      let rc=refCell(c.getAttribute("r"));
      if(!rc){ /* certains logiciels n'écrivent pas la référence : on la déduit */
        const row=c.parentNode, rr=(row&&row.getAttribute("r"))?Number(row.getAttribute("r"))-1:NaN;
        const r0=isNaN(rr)?rgPrec+(c===row.firstElementChild?1:0):rr;
        rc={r:r0,c:(r0===rgPrec?colPrec+1:0)};
      }
      rgPrec=rc.r; colPrec=rc.c;
      const ty=c.getAttribute("t"), v=c.getElementsByTagName("v")[0];
      let val=null;
      if(ty==="s") val=v?partages[+v.textContent]:null;
      else if(ty==="inlineStr"){ val=[...c.getElementsByTagName("t")].map(x=>x.textContent).join(""); }
      else if(ty==="str"||ty==="e") val=v?v.textContent:null;
      else if(ty==="b") val=v?(v.textContent==="1"):null;
      else if(v){ const x=parseFloat(v.textContent); val=isNaN(x)?v.textContent:x; }
      (g[rc.r]=g[rc.r]||[])[rc.c]=val;
    });
    res[sh.getAttribute("name")]=g;
  }
  return res;
}

function ongletFiche(c,lib,t){

async function lireFiches(){

  let a=0, rp=0, prot=0;
  r.items.forEach(function(x){
    if((x.etat==="nouvelle"||(x.etat==="conflit"&&remplacer))&&rachatProtege(x.eid,x.t,x.lib,x.ch)){ prot++; return; }
    if(x.etat==="nouvelle"||(x.etat==="conflit"&&remplacer)){
      const k=cleN(x.eid,x.t,x.lib), n=S.notes[k]||{d1:"",d2:"",md:"",compo:""};
      n[x.ch]=String(a2(x.val)).replace(".",","); S.notes[k]=n;
      if(x.etat==="nouvelle") a++; else rp++;
    }
  });
  S.journalFiches=(S.journalFiches||[]).concat([{date:new Date().toISOString(),fichiers:r.fichiers,
    onglets:r.onglets.filter(o=>!o.erreur).length,ajoutees:a,remplacees:rp}]).slice(-60);
  importEnCours=null; modifie(); fermer(); rendre();
  alert(a+" note(s) ajoutée(s)"+(rp?", "+rp+" remplacée(s)":"")+"."
    +(prot?"\n"+prot+" composition(s) régularisée(s) par le conseil de classe n'ont pas été modifiées.":""));
}

}

/* ======================== SAISIE RAPIDE ================================ */
/* Entrée ou flèche bas : la note est vérifiée, enregistrée, et le curseur
   descend à l'élève suivant, dans la même colonne. Une note impossible
   reste en rouge et le curseur ne bouge pas. */
function champNote(i,eid,ch,v,dis){
  return '<td><input class="sn" data-i="'+i+'" data-ch="'+ch+'" data-e="'+eid+'" value="'+esc(v||"")+'"'
   +(dis?' disabled':'')+' onkeydown="toucheNote(event,this)" onchange="validerNote(this)" onpaste="collerNotes(event,this)"'
   +' onfocus="this.select()" style="width:'+(ch==="md"?72:64)+'px" inputmode="decimal" enterkeyhint="next" autocomplete="off"></td>';
}
function msgNote(t,err){
  const m=document.getElementById("msgNotes"); if(!m) return;
  m.textContent=t||""; m.className="msgnote"+(err?" err":"");
}
function validerNote(inp){
  const v=String(inp.value).trim(), x=nbr(v);
  if(v!==""&&(x===null||x<0||x>20||!/^\d{1,2}([.,]\d{1,2})?$/.test(v))){
    inp.classList.add("err");
    msgNote("Note impossible : « "+v+" ». Une note va de 0 à 20, avec au plus deux décimales, par exemple 12,5.",true);
    return false;
  }
  inp.classList.remove("err");
  const eid=inp.dataset.e, ch=inp.dataset.ch, avant=String(noteDe(eid,trimActif,matiereNotes)[ch]||"");
  const val=v.replace(".",",");
  if(val!==avant){ poserNote(eid,trimActif,matiereNotes,ch,val); inp.value=val; majLigneNote(eid); }
  msgNote("");
  return true;
}
function majLigneNote(eid){
  const n=noteDe(eid,trimActif,matiereNotes), auto=(nbr(n.d1)!==null&&nbr(n.d2)!==null), mm=moyMatiere(n);
  const md=document.querySelector('input.sn[data-e="'+eid+'"][data-ch="md"]');
  if(md){ md.disabled=auto; md.value=auto?n2(moyDevoirs(n)):(n.md||""); }
  const cm=document.getElementById("m_"+eid), ca=document.getElementById("a_"+eid);
  if(cm) cm.innerHTML='<strong>'+n2(mm)+'</strong>';
  if(ca) ca.textContent=(mm===null?"":mention(mm));
  const c=classe(classeNotes), cp=document.getElementById("cptNotes");
  if(c&&cp){
    const els=elevesDe(c.id,trimActif,true), faits=els.filter(e=>moyMatiere(noteDe(e.id,trimActif,matiereNotes))!==null).length;
    cp.innerHTML=faits+" note(s) sur "+els.length+" pour cette matière — "+esc(libTrim(trimActif))
      +(faits<els.length?' <button class="btn sec" style="margin-left:8px;padding:4px 10px;font-size:13.5px" onclick="prochaineManquante()">Aller à la prochaine note manquante</button>':'');
    cp.className=(faits===els.length?"info":"prudence");
  }
}
function allerNote(inp,d){
  let i=+inp.dataset.i+d;
  while(true){
    const s=document.querySelector('input.sn[data-ch="'+inp.dataset.ch+'"][data-i="'+i+'"]');
    if(!s) return;
    if(!s.disabled){ s.focus(); s.select(); return; }
    i+=d;
  }
}
function toucheNote(ev,inp){
  if(ev.key==="Enter"||ev.key==="ArrowDown"){ ev.preventDefault(); if(validerNote(inp)) allerNote(inp,1); }
  else if(ev.key==="ArrowUp"){ ev.preventDefault(); if(validerNote(inp)) allerNote(inp,-1); }
}

/* --------------- Collage d'une colonne copiée dans Excel --------------- */
let collageEnCours=null;
function normNom(s){ return String(s||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
  .replace(/[^a-z0-9]+/g," ").trim(); }
function collerNotes(ev,inp){
  const txt=(ev.clipboardData||window.clipboardData).getData("text")||"";
  if(!/[\n\t]/.test(txt.replace(/\s+$/,""))) return;          // une seule valeur : collage normal
  ev.preventDefault();
  const c=classe(classeNotes), els=elevesDe(c.id,trimActif,true), ch=inp.dataset.ch, dep=+inp.dataset.i;
  const lignes=txt.replace(/\r/g,"").split("\n").filter(l=>l.trim()!=="").map(l=>l.split("\t").map(x=>x.trim()));
  const avecNom=lignes.some(l=>l.some(x=>x!==""&&nbr(x)===null&&/[a-zA-Z\u00C0-\u017F]{2,}/.test(x)));
  const items=[];
  if(avecNom){
    const idx={}, doub={};
    els.forEach(e=>{ const k=normNom(e.nom); if(idx[k]) doub[k]=1; idx[k]=e;
      const k2=k.split(" ").sort().join(" "); if(!idx[k2]) idx[k2]=e; });
    lignes.forEach(function(l){
      const iNom=l.findIndex(x=>x!==""&&nbr(x)===null&&/[a-zA-Z\u00C0-\u017F]{2,}/.test(x));
      if(iNom<0) return;
      const nom=l[iNom], note=l.slice(iNom+1).find(x=>x!=="");
      const k=normNom(nom), e=(!doub[k]&&idx[k])||idx[k.split(" ").sort().join(" ")]||null;
      items.push({nom:nom,e:e,brut:note===undefined?"":note});
    });
  } else {
    if(dep+lignes.length>els.length){
      alert("Vous collez "+lignes.length+" notes à partir du "+(dep+1)+"e élève, mais il n'en reste que "
        +(els.length-dep)+" dans la liste. Rien n'a été collé : vérifiez la colonne copiée.");
      return;
    }
    lignes.forEach((l,k)=>items.push({nom:els[dep+k].nom,e:els[dep+k],brut:l[0]||""}));
  }
  items.forEach(function(it){
    const v=String(it.brut).trim(), x=nbr(v);
    it.val=v.replace(".",",");
    if(!it.e) it.etat="introuvable";
    else if(v==="") it.etat="vide";
    else if(x===null||x<0||x>20) it.etat="invalide";
    else { const a=noteDe(it.e.id,trimActif,matiereNotes)[ch]; it.ancien=a||"";
      it.etat=(a===""||a===undefined)?"nouvelle":(nbr(a)===x?"identique":"remplace"); }
  });
  collageEnCours={ch:ch,items:items};
  const lib={nouvelle:"Nouvelle",remplace:"Remplace",identique:"Identique",invalide:"Impossible",introuvable:"Nom introuvable",vide:"Vide"};
  let h='<p class="aide">'+(avecNom?'Chaque note est rangée d\'après le nom de l\'élève.'
    :'Les notes sont rangées dans l\'ordre de la liste, à partir de '+esc(els[dep].nom)+'.')
    +' Colonne : <b>'+({d1:"Devoir 1",d2:"Devoir 2",md:"Moyenne des devoirs",compo:"Composition"}[ch])+'</b>.</p>'
    +'<div class="defile"><table class="tsaisie"><tr><th class="nomcol">Élève</th><th>Actuelle</th><th>Collée</th><th>État</th></tr>';
  items.forEach(it=>{ h+='<tr><td class="nomcol">'+esc(it.e?it.e.nom:it.nom)+'</td><td>'+esc(it.ancien||"")+'</td><td><b>'+esc(it.val)
    +'</b></td><td style="color:'+(["invalide","introuvable"].indexOf(it.etat)>=0?"var(--rouge)":"inherit")+'">'+lib[it.etat]+'</td></tr>'; });
  h+='</table></div>';
  const ok=items.filter(x=>x.etat==="nouvelle"||x.etat==="remplace").length;
  ouvrir("Vérifier avant de coller",h,ok?[{texte:"Enregistrer "+ok+" note(s)",action:"appliquerCollage()"},
    {texte:"Annuler",action:"collageEnCours=null;fermer()",style:"sec"}]:[{texte:"Fermer",action:"collageEnCours=null;fermer()",style:"sec"}]);
}
function appliquerCollage(){
  const c=collageEnCours; if(!c) return;
  c.items.forEach(function(it){
    if(it.etat!=="nouvelle"&&it.etat!=="remplace") return;
    const k=cleN(it.e.id,trimActif,matiereNotes), n=S.notes[k]||{d1:"",d2:"",md:"",compo:""};
    n[c.ch]=it.val; S.notes[k]=n;
  });
  collageEnCours=null; modifie(); fermer(); rendre();
}

/* --------------- Import d'une liste d'élèves copiée dans Excel -------- */
function sexeDe(s){
  const x=normNom(s);
  if(/^(m|g|masculin|garcon|homme)$/.test(x)) return "M";
  if(/^(f|feminin|fille|femme)$/.test(x)) return "F";
  return "";
}
function collerListe(){
  const zt=document.getElementById("listeColl");
  if(zt&&zt.value.indexOf(";")>=0&&zt.value.indexOf("\t")<0) zt.value=zt.value.split("\n").map(l=>l.split(";").map(x=>x.trim()).join("\t")).join("\n");
  const brut=document.getElementById("listeColl").value.replace(/\r/g,"");
  const lignes=brut.split("\n").filter(l=>l.trim()!=="").map(l=>l.split("\t").map(x=>x.trim()));
  if(lignes.length>1&&lignes[0].some(x=>/^nom\b/i.test(x))) lignes.shift();   // ligne de titres
  const deja={}; elevesTousDe(classeNotes).forEach(e=>{ deja[normNom(e.nom)]=1; });
  let ajout=0, doublon=0;
  lignes.forEach(function(l){
    let cols=l.slice(); if(cols.length>1&&/^\d+$/.test(cols[0])) cols.shift();      // colonne « N° »
    const nom=(cols[0]||"").replace(/\s+/g," ").trim(); if(!nom) return;
    if(deja[normNom(nom)]){ doublon++; return; }
    deja[normNom(nom)]=1;
    S.eleves.push({id:uid(),classeId:classeNotes,nom:nom,sexe:sexeDe(cols[1]||""),naiss:cols[2]||"",lieu:cols[3]||"",
      redouble:cols[4]||"Néant",matricule:"",anEntree:"",photo:"",prevNom:"",prevTel:""});
    ajout++;

/* ================ IMPORT DES ÉLÈVES DEPUIS UN FICHIER EXCEL (v21) ========== */

let IMP=null;
const CHAMPS_IMP=[
  {k:"nomComplet",l:"Nom et prénoms (une seule colonne)"},{k:"nom",l:"Nom"},{k:"prenoms",l:"Prénom(s)"},
  {k:"sexe",l:"Sexe"},{k:"naiss",l:"Date de naissance"},{k:"lieu",l:"Lieu de naissance"},
  {k:"matricule",l:"Matricule"},{k:"redouble",l:"Redoublant / classe redoublée"},{k:"classe",l:"Classe"}];
function titreVersChamp(t){
  const x=normNom(t); if(!x) return "";
  if(/^(n|no|num|numero|n o|ordre|n d ordre|rang)$/.test(x)) return "";
  if(/nom.*prenom|noms? et prenom|nom prenom|identite/.test(x)) return "nomComplet";
  if(/prenom/.test(x)) return "prenoms";
  if(/date.*lieu.*naiss|ne e? le et a/.test(x)) return "naiss";
  if(/lieu|ne e? a$|^a$/.test(x)) return "lieu";
  if(/date|naiss|ne e? le|^ne e?$/.test(x)) return "naiss";
  if(/^(nom|noms|nom de famille|patronyme)$/.test(x)) return "nom";
  if(/sexe|genre|^s$|^g f$|^m f$/.test(x)) return "sexe";
  if(/matricule|^mle|^mat$|identifiant|^ine$/.test(x)) return "matricule";
  if(/redoubl|^red$|^r nr$|statut/.test(x)) return "redouble";

function lireCSV(t){
  t=t.replace(/^\uFEFF/,"");
  const pl=t.split(/\r?\n/)[0]||"", sep=(pl.split(";").length>=pl.split(",").length)?(pl.indexOf(";")>=0?";":(pl.indexOf("\t")>=0?"\t":",")):",";
  const res=[]; let l=[], v="", q=false;
  for(let i=0;i<t.length;i++){ const ch=t[i];
    if(q){ if(ch==='"'){ if(t[i+1]==='"'){ v+='"'; i++; } else q=false; } else v+=ch; }
    else if(ch==='"') q=true;
    else if(ch===sep){ l.push(v); v=""; }
    else if(ch==="\n"){ l.push(v.replace(/\r$/,"")); res.push(l); l=[]; v=""; }
    else v+=ch; }

}
function valTexte(v){ if(v===null||v===undefined) return ""; if(typeof v==="number") return Number.isInteger(v)?String(v):String(v); return String(v).replace(/\s+/g," ").trim(); }
function dateImport(v){

  }
  let s=valTexte(v); let m;
  if((m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/))) return m[3].padStart(2,"0")+"/"+m[2].padStart(2,"0")+"/"+m[1];
  if((m=s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})$/))){ let a=m[3]; if(a.length===2) a=(Number(a)>40?"19":"20")+a; return m[1].padStart(2,"0")+"/"+m[2].padStart(2,"0")+"/"+a; }
  return s;
}
function cleClasse(s){
  return normNom(s).replace(/\b(\d)\s*(eme|ieme|e|em|nde|nd|ere|re|er)\b/g,"$1").replace(/\bseconde\b/g,"2").replace(/\bpremiere\b/g,"1")

function majMapImp(k,v){ if(v==="") delete IMP.map[k]; else IMP.map[k]=Number(v); if(k==="classe"&&v===""&&IMP.dest==="col") IMP.dest=(S.classes[0]||{}).id; if(k==="classe") etapeColonnes(); }

   sa liste de présence, et, au 3e trimestre, les rachats décidés par le
   conseil. Les constats chiffrés sont calculés ; l'analyse, les propositions
   et le compte rendu restent écrits par les personnes concernées. */

  "Suivi individuel des élèves à suivre par le professeur principal",
  "Travaux dirigés supplémentaires",
  "Rencontre avec les parents des élèves en difficulté ou souvent absents",
  "Groupes d'entraide entre élèves, encadrés par les délégués",
  "Renforcement du contrôle des absences et des retards"];

const ODJ_DEFAUT_T3="Analyse et commentaire des résultats du trimestre, par le professeur principal\nSynthèse du chef d'établissement\nExamen des cas particuliers et des rachats\nDivers";
let conseilClasse="";

function conseilDe(cid,t){

  if(!S.conseils[k]) S.conseils[k]={pp:"",date:"",heure:"",heureFin:"",lieu:"",secretaire:"",analyse:"",pistes:[],autre:"",

    parents:[{nom:"",qualite:"Président de l'Association des parents d'élèves"},{nom:"",qualite:"Présidente de l'Association des mères éducatrices"}],
    admin:[],decisions:{}};

}
function majConseil(cid,t,ch,v){ conseilDe(cid,t)[ch]=v; modifie(); }
function majConseilListe(cid,t,ch,i,v){ const c=conseilDe(cid,t); c[ch]=(c[ch]||[]).slice(); c[ch][i]=v; modifie(); }
function majParent(cid,t,i,ch,v){ const c=conseilDe(cid,t); c.parents=(c.parents||[]).map(x=>Object.assign({},x)); while(c.parents.length<=i) c.parents.push({nom:"",qualite:""}); c.parents[i][ch]=v; modifie(); }
function basculePiste(cid,t,i,on){ const c=conseilDe(cid,t); const l=(c.pistes||[]).filter(x=>x!==i); if(on) l.push(i); c.pistes=l.sort(); modifie(); }

/* --- nombres, dates et heures en toutes lettres, pour le procès-verbal --- */
const UNITES=["zéro","un","deux","trois","quatre","cinq","six","sept","huit","neuf","dix","onze","douze","treize","quatorze","quinze","seize"];
const DIZAINES={20:"vingt",30:"trente",40:"quarante",50:"cinquante",60:"soixante"};
function enLettres(n){
  n=Math.floor(n);
  if(n<17) return UNITES[n];
  if(n<20) return "dix-"+UNITES[n-10];
  if(n<70){ const d=Math.floor(n/10)*10, u=n%10; return DIZAINES[d]+(u===0?"":(u===1?" et un":"-"+UNITES[u])); }
  if(n<80) return "soixante"+(n===71?" et onze":"-"+enLettres(n-60));
  if(n<100) return n===80?"quatre-vingts":"quatre-vingt-"+enLettres(n-80);
  if(n<1000){ const c=Math.floor(n/100), r=n%100; return (c===1?"cent":UNITES[c]+" cent"+(r===0?"s":""))+(r?" "+enLettres(r):""); }
  const m=Math.floor(n/1000), r=n%1000; return (m===1?"mille":enLettres(m)+" mille")+(r?" "+enLettres(r):"");
}
const MOIS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function dateEnLettres(d){
  const m=String(d||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!m) return "";
  const j=Number(m[1]), mo=Number(m[2]), a=Number(m[3]);
  return "L'an "+enLettres(a)+" et le "+(j===1?"premier":enLettres(j))+" "+MOIS[mo-1];
}
function heureEnLettres(h){
  const m=String(h||"").match(/^(\d{1,2})\s*[h:]\s*(\d{0,2})$/i); if(!m) return "";
  const hh=Number(m[1]), mm=Number(m[2]||0);
  return (hh===0?"zéro heure":(hh===1?"une heure":enLettres(hh)+" heures"))+(mm?" "+(mm===30?"trente":enLettres(mm)):"");
}

/* --- les rachats (3e trimestre) ---------------------------------------- */
function seuilRachat(){ const v=nbr(S.etab.seuilRachat); return (v!==null&&v>0&&v<10)?v:9.98; }
function rachatsDe(cid){ return (S.rachats||[]).filter(r=>r.cid===cid); }
function estRachete(eid){ return (S.rachats||[]).some(r=>r.eid===eid); }
function rachatProtege(eid,t,lib,ch){ return Number(t)===3&&ch==="compo"&&(S.rachats||[]).some(r=>r.eid===eid&&r.lib===lib); }
/* Points ajoutés sur la composition du 3e trimestre, au quart de point :
   d'abord les matières sous la moyenne, par petit coefficient, sans dépasser
   10 dans la matière ni 3 points par composition ; puis, si besoin, les
   autres matières. Rien n'est appliqué : c'est une proposition. */
function propositionRachat(el){
  const c=classe(el.classeId), avant=moyAnnuelle(el), seuil=seuilRachat();
  if(!c||!coefsPrets(c)||avant===null||avant>=10||avant<seuil||estRachete(el.id)) return null;
  const cand=matieresActives(c).map(m=>({m:m,moy:moyMatiere(noteDe(el.id,3,m.lib))})).filter(x=>x.moy!==null)
    .sort((a,b)=>((a.moy>=10)-(b.moy>=10))||(Number(a.m.coef)-Number(b.m.coef))||(a.moy-b.moy));
  const sauve={}, orig={};
  cand.forEach(x=>{ const k=cleN(el.id,3,x.m.lib); sauve[k]=S.notes[k]?Object.assign({},S.notes[k]):undefined;
    S.notes[k]=Object.assign({d1:"",d2:"",md:"",compo:""},S.notes[k]); orig[x.m.lib]=nbr(S.notes[k].compo)||0; });
  const passe=function(liste,plafond,jusqua10){
    for(const x of liste){
      const n=S.notes[cleN(el.id,3,x.m.lib)];
      while(moyAnnuelle(el)<10){
        const cc=nbr(n.compo)||0;
        if(cc>=20||cc-orig[x.m.lib]>=plafond) break;
        if(jusqua10&&moyMatiere(n)>=10) break;
        n.compo=String(Math.min(20,cc+0.25)).replace(".",",");
      }
      if(moyAnnuelle(el)>=10) return;
    }
  };
  passe(cand.filter(x=>x.moy<10),3,true);
  if(moyAnnuelle(el)<10) passe(cand,3,false);
  if(moyAnnuelle(el)<10) passe(cand,5,false);
  const modifs=cand.map(x=>{ const n=S.notes[cleN(el.id,3,x.m.lib)], ap=nbr(n.compo)||0;
    return ap>orig[x.m.lib]?{lib:x.m.lib,coef:x.m.coef,avant:orig[x.m.lib],apres:ap,moyAvant:x.moy,moyApres:moyMatiere(n)}:null; }).filter(Boolean);
  const apres=moyAnnuelle(el);
  Object.keys(sauve).forEach(k=>{ if(sauve[k]===undefined) delete S.notes[k]; else S.notes[k]=sauve[k]; });
  return {el:el,avant:avant,apres:apres,modifs:modifs,atteint:apres!==null&&apres>=10};
}
function rachetables(cid){
  return elevesDe(cid,3).map(propositionRachat).filter(Boolean).sort((a,b)=>b.avant-a.avant);
}
function appliquerRachats(cid){
  const cs=conseilDe(cid,3), props=rachetables(cid).filter(p=>(cs.decisions[p.el.id]||{}).accepte&&p.atteint);
  if(!props.length){ alert("Aucun rachat coché à appliquer."); return; }
  if(!confirm(props.length+" rachat(s) vont être appliqués : les compositions du 3e trimestre seront régularisées. "
    +"Les notes d'origine restent enregistrées dans le relevé des rachats.\n\nContinuer ?")) return;
  S.rachats=S.rachats||[];
  const d=new Date().toISOString();
  props.forEach(function(p){
    p.modifs.forEach(function(m){
      const k=cleN(p.el.id,3,m.lib), n=Object.assign({d1:"",d2:"",md:"",compo:""},S.notes[k]);
      n.compo=String(m.apres).replace(".",","); S.notes[k]=n;
      S.rachats.push({eid:p.el.id,cid:cid,lib:m.lib,coef:m.coef,avant:m.avant,apres:m.apres,moyAvant:m.moyAvant,moyApres:m.moyApres,
        annAvant:p.avant,annApres:p.apres,date:d});
    });
  });
  modifie(); rendre();
  alert(props.length+" rachat(s) appliqué(s). Les rangs et les bulletins tiennent compte des notes régularisées.");
}
function annulerRachat(eid){
  const l=(S.rachats||[]).filter(r=>r.eid===eid); if(!l.length) return;
  const e=eleve(eid);
  if(!confirm("Annuler le rachat de "+(e?e.nom:"cet élève")+" ? Ses compositions reprendront leurs notes d'origine.")) return;
  l.forEach(function(r){ const k=cleN(eid,3,r.lib); if(S.notes[k]) S.notes[k].compo=String(r.avant).replace(".",","); });
  S.rachats=S.rachats.filter(r=>r.eid!==eid);
  modifie(); rendre();
}

          return '<tr><td class="nomcol">'+esc(p.el.nom)+'</td><td>'+n2(p.avant)+'</td><td style="text-align:left">'
           +(p.atteint?p.modifs.map(m=>esc(m.lib)+' : '+n2(m.avant)+' → <b>'+n2(m.apres)+'</b>').join("<br>"):'<span class="tag r">impossible d\'atteindre 10</span>')
           +'</td><td><input type="checkbox"'+(d.accepte?' checked':'')+(p.atteint?'':' disabled')+' onchange="majDecision('+q+',\''+p.el.id+'\',\'accepte\',this.checked)"></td>'
           +'<td><input value="'+esc(d.motif||"")+'" placeholder="Comportement, absences…" onchange="majDecision('+q+',\''+p.el.id+'\',\'motif\',this.value)"></td></tr>'; }).join("")
       +'</table></div><div class="barre-actions"><button class="btn" onclick="appliquerRachats(\''+c.id+'\')">Appliquer les rachats cochés</button></div>';
    }
    if(faits.length){
      const parEl={}; faits.forEach(r=>{ (parEl[r.eid]=parEl[r.eid]||[]).push(r); });
      h+='<p class="sous">Rachats appliqués :</p><div class="defile"><table class="tsaisie"><tr><th class="nomcol">Élève</th><th>Moyenne annuelle</th><th>Compositions régularisées</th><th></th></tr>'
       +Object.keys(parEl).map(eid=>{ const l=parEl[eid], e=eleve(eid);
          return '<tr><td class="nomcol">'+esc(e?e.nom:"?")+'</td><td>'+n2(l[0].annAvant)+' → <b>'+n2(l[0].annApres)+'</b></td><td style="text-align:left">'
           +l.map(r=>esc(r.lib)+' : '+n2(r.avant)+' → '+n2(r.apres)).join("<br>")+'</td><td><button class="btn mini sec" onclick="annulerRachat(\''+eid+'\')">Annuler</button></td></tr>'; }).join("")
       +'</table></div>';
    }
  }
  /* 4. procès-verbal */
  h+='<h2>'+(t===3?'4':'3')+'. Le procès-verbal</h2>'
   +'<div class="champ"><label>Ordre du jour (un point par ligne)</label>'+zone("odj",4)+'</div>'
   +'<div class="champ"><label>Point 1 — ce qu\'a dit le professeur principal (les chiffres s\'ajoutent seuls)</label>'+zone("compteRendu",3)+'</div>'
   +'<div class="champ"><label>Point 2 — synthèse du chef d\'établissement</label>'+zone("synthese",3)+'</div>'
   +'<div class="champ"><label>Point 3 — cas particuliers'+(t===3?' (les rachats s\'ajoutent seuls)':'')+'</label>'+zone("cas",3)+'</div>'
   +'<div class="champ"><label>Point 4 — divers</label>'+zone("divers",3)+'</div>'
   +'<div class="barre-actions"><button class="btn" onclick="imprimer(\'pvconseil\')">Imprimer le procès-verbal et ses annexes</button></div>';
  return h;
};
function majDecision(cid,t,eid,ch,v){ const cs=conseilDe(cid,t); cs.decisions[eid]=Object.assign({},cs.decisions[eid],{[ch]:v}); modifie(); }

function pcnt(n,d){ return d?String((Math.round(1000*n/d)/10).toFixed(1)).replace(".",",")+" %":"—"; }
function signeEcart(x){ return (x>0?"+ ":x<0?"− ":"")+n2(Math.abs(x)); }
function blocSigDoc(titre1,titre2,nom,qualif){
  return '<div class="bl"><div class="dt">&nbsp;</div><div class="lb">'+titre1+'</div>'+(titre2?'<div class="lb">'+titre2+'</div>':'')
   +'<div class="sp"></div>'+(nom?'<div class="nm">'+esc(nom)+'</div>':'')+(qualif?'<div class="ql">'+esc(qualif)+'</div>':'')+'</div>';
}
function lignesVides(n){ return '<div style="margin:1mm 0 2mm">'+Array(n).fill('<div style="border-bottom:.4pt dotted #777;height:6.5mm"></div>').join("")+'</div>'; }
function texteOuLignes(t,n){ return t&&t.trim()?'<div class="ec" style="text-align:justify;white-space:pre-line">'+esc(t.trim())+'</div>':lignesVides(n); }
function titreChefMin(){ return String(S.etab.titreChef||"Le Directeur").replace(/^Le /,"le "); }

function rapportPPHTML(cid,t){

   +'<tr><th></th><th>Garçons</th><th>Filles</th><th>Ensemble</th></tr>'
   +lgS("Effectif classé",st.nG,st.nF,st.evalues)+lgS("Moyenne de la classe",n2(st.moyG),n2(st.moyF),n2(st.moyT),true)
   +lgS("Élèves ayant la moyenne (≥ 10)",st.reuG,st.reuF,st.reuT)+lgS("Taux de réussite",pcnt(st.reuG,st.nG),pcnt(st.reuF,st.nF),pcnt(st.reuT,st.evalues),true)

  const parMat=ms.map(function(m){ const v=els.map(e=>moyMatiere(noteDe(e.id,t,m.lib))).filter(x=>x!==null); let so=0; v.forEach(x=>so+=x);
    const e=ensDe(c,m.lib); return {lib:m.lib,coef:m.coef,moy:v.length?a2(so/v.length):null,reu:v.filter(x=>x>=10).length,n:v.length,prof:e?e.nom:""}; });
  const faibles=parMat.filter(x=>x.moy!==null&&x.moy<10).sort((a,b)=>a.moy-b.moy);
  let cst='';

      +'• Le taux de réussite '+(dt>=0?'gagne':'perd')+' <b>'+String(Math.abs(Math.round(dt*10)/10)).replace(".",",")+' points</b> ('+pcnt(p.reuT,p.evalues)+' → '+pcnt(st.reuT,st.evalues)+').<br>'; }
  if(st.nF&&st.nG){ const e=100*(st.reuF/st.nF-st.reuG/st.nG);
    cst+='• '+(Math.abs(e)<0.05?'Filles et garçons réussissent au même taux.':'Les filles réussissent '+(e>0?'mieux':'moins bien')+' que les garçons : écart de <b>'+String(Math.abs(Math.round(e*10)/10)).replace(".",",")+' points</b> de pourcentage.')+'<br>'; }
  cst+='• '+(faibles.length?(faibles.length===1?'Une matière reste':faibles.length+' matières restent')+' sous 10 de moyenne : '+faibles.map(x=>esc(x.lib)+' ('+n2(x.moy)+')').join(", ")+'.':'Toutes les matières ont une moyenne de classe d\'au moins 10.');
  h+='<div class="ec"><b>Constats établis par l\'application :</b><br>'+cst+'</div>';
  if(t>1) h+='<div class="sc">2. ÉVOLUTION AU COURS DE L\'ANNÉE</div><table class="bt"><tr><th></th>'+s.map((x,i)=>'<th>'+esc(libTrim(i+1))+'</th>').join("")+'</tr>'
    +'<tr><td class="ga">Moyenne de la classe</td>'+s.map(x=>'<td class="ce">'+n2(x.moyT)+'</td>').join("")+'</tr>'
    +'<tr><td class="ga">Taux de réussite</td>'+s.map(x=>'<td class="ce">'+pcnt(x.reuT,x.evalues)+'</td>').join("")+'</tr>'
    +'<tr><td class="ga">Filles</td>'+s.map(x=>'<td class="ce">'+pcnt(x.reuF,x.nF)+'</td>').join("")+'</tr>'
    +'<tr><td class="ga">Garçons</td>'+s.map(x=>'<td class="ce">'+pcnt(x.reuG,x.nG)+'</td>').join("")+'</tr></table>';
  const MEN=["Excellent","Très bien","Bien","Assez bien","Passable","Insuffisant","Faible","Très faible"], cpt={};

  h+='<div class="sc">4. RÉSULTATS PAR MATIÈRE</div><table class="bt"><colgroup><col style="width:34%"><col style="width:7%"><col style="width:12%"><col style="width:12%"><col style="width:11%"><col style="width:24%"></colgroup>'

   +'</table><p class="nt">Les moyennes en gras sont inférieures à 10.</p>';
  let aJ=0,aN=0,rt=0; const dis={}, cond={};

    const b=bulletinDe(e,t); if(b&&b.sanction&&b.sanction!=="Néant") dis[b.sanction]=(dis[b.sanction]||0)+1; });
  const abs10=els.filter(e=>(nbr(vieDe(e.id,t).absN)||0)>=10);
  h+='<div class="sc">5. ASSIDUITÉ ET DISCIPLINE</div><table class="bt"><colgroup><col style="width:46%"><col></colgroup>'
   +'<tr><td class="ga">Absences justifiées</td><td class="ce">'+aJ+' h</td></tr><tr><td class="ga">Absences non justifiées</td><td class="ce">'+aN+' h</td></tr>'
   +'<tr><td class="ga">Retards</td><td class="ce">'+rt+'</td></tr><tr><td class="ga">Conduite</td><td class="ga">'+(Object.keys(cond).map(k=>k+' : '+cond[k]).join(" ; ")||"—")+'</td></tr>'
   +'<tr><td class="ga">Distinctions et avertissements</td><td class="ga">'+(Object.keys(dis).map(k=>k+' : '+dis[k]).join(" ; ")||"Aucun")+'</td></tr></table>'
   +(abs10.length?'<p class="nt">Élève(s) totalisant 10 heures ou plus d\'absences non justifiées : '+abs10.map(e=>esc(e.nom)).join(", ")+'.</p>':'');
  const suivre=cl.filter(x=>{ if(x.moy<10) return true; if(t===1) return false; const b=bulletinDe(x.el,t-1); return b&&b.gen!==null&&x.moy-b.gen<=-1.5; });
  h+='<div class="sc">6. ÉLÈVES À SUIVRE</div>'+(suivre.length?'<table class="bt"><colgroup><col style="width:40%"><col><col><col><col style="width:30%"></colgroup>'
   +'<tr><th>Nom et prénoms</th><th>'+(t>1?esc(libTrim(t-1)):'—')+'</th><th>'+esc(libTrim(t))+'</th><th>Écart</th><th>Motif</th></tr>'

      return '<tr><td class="ga">'+esc(x.el.nom)+'</td><td class="ce">'+n2(gp)+'</td><td class="ce">'+n2(x.moy)+'</td><td class="ce">'+(d!==null?signeEcart(d):'—')+'</td><td class="ga">'

   +'<div class="sc">8. PROPOSITIONS ET PISTES DE SOLUTION</div><div class="ec">'+PISTES.map((p,i)=>((cs.pistes||[]).includes(i)?'☑':'☐')+' '+esc(p)).join("<br>")

/* ===================== IMAGES : FOND ET CADRAGE (v15) ================== */
/* Le cachet, la signature et le logo sont détourés : les points clairs
   deviennent transparents, l'image est recadrée au plus juste. Rien n'est
   perdu : l'image d'origine est conservée et le réglage peut être repris. */

function detourerImage(src,seuil,cb){
  const img=new Image();
  img.onload=function(){
    const cv=document.createElement("canvas"); cv.width=img.width; cv.height=img.height;
    const cx=cv.getContext("2d"); cx.drawImage(img,0,0);
    let d;
    try{ d=cx.getImageData(0,0,cv.width,cv.height); }catch(e){ cb(src); return; }
    const p=d.data; let x0=cv.width,y0=cv.height,x1=-1,y1=-1;
    for(let y=0;y<cv.height;y++) for(let x=0;x<cv.width;x++){
      const i=(y*cv.width+x)*4, l=0.299*p[i]+0.587*p[i+1]+0.114*p[i+2];
      let a;
      if(l>=seuil) a=0;
      else if(l>seuil-45) a=Math.round(255*(seuil-l)/45);
      else a=255;
      p[i+3]=Math.min(p[i+3],a);
      if(a>50){ if(x<x0)x0=x; if(x>x1)x1=x; if(y<y0)y0=y; if(y>y1)y1=y; }
    }
    cx.putImageData(d,0,0);
    if(x1<0){ cb(src); return; }
    const m=Math.round(Math.max(cv.width,cv.height)*0.012);
    x0=Math.max(0,x0-m); y0=Math.max(0,y0-m); x1=Math.min(cv.width-1,x1+m); y1=Math.min(cv.height-1,y1+m);
    const w=x1-x0+1, h=y1-y0+1;
    const c2=document.createElement("canvas"); c2.width=w; c2.height=h;
    c2.getContext("2d").drawImage(cv,x0,y0,w,h,0,0,w,h);
    cb(c2.toDataURL("image/png"));
  };
  img.onerror=function(){ cb(src); };
  img.src=src;
}
const LIB_IMG={logo:"logo de l'établissement",cachet:"cachet",signature:"signature du chef d'établissement"};
let detType="", detOrig="", detSeuil=205, detRes="";
function imageOrigine(t){
  if(t==="logo") return S.etab.logoOrig||S.etab.logo||"";
  if(t==="cachet") return cachetOrig||cachet||"";
  return sigOrig||signature||"";
}
function ouvrirDetourage(t,src){
  detType=t; detOrig=src||imageOrigine(t); detSeuil=detSeuil||205; detRes="";
  if(!detOrig){ alert("Déposez d'abord une image."); return; }
  ouvrir("Détourer "+(t==="logo"?"le ":"le ")+LIB_IMG[t],

   +'<div class="detbox"><div><div class="etq">Image déposée</div><img class="det" src="'+detOrig+'" alt=""></div>'
   +'<div><div class="etq">Résultat</div><div class="damier"><img class="det" id="detApercu" src="'+detOrig+'" alt=""></div></div></div>'

   [{texte:"Appliquer",action:"appliquerDetour(false)"},{texte:"Garder l'image telle quelle",action:"appliquerDetour(true)",style:"sec"}]);

}
function apercuDetour(){

function appliquerDetour(original){
  const d=original?detOrig:(detRes||detOrig);
  if(detType==="logo"){ S.etab.logo=d; S.etab.logoOrig=detOrig; }

  modifie(); fermer(); rendre();
}

let cad={src:"",zoom:1,x:0,y:0,img:null,eid:""};
function ouvrirCadrage(src,eid){
  cad={src:src,zoom:1,x:0,y:0,img:null,eid:eid};
  const e=eleve(eid);
  ouvrir("Cadrer la photo"+(e?" — "+e.nom:""),
   '<p class="aide">Placez le visage dans l\'ovale. Faites glisser l\'image avec le doigt ou la souris, '
   +'et servez-vous du curseur pour agrandir. Seul ce qui est dans le cadre sera enregistré.</p>'
   +'<div class="cadzone"><canvas id="cadCv" width="198" height="264"></canvas><div class="cadovale"></div></div>'
   +'<div class="champ"><label>Agrandir</label><input type="range" id="cadZoom" min="100" max="300" value="100" oninput="cad.zoom=this.value/100;dessinerCadrage()"></div>',
   [{texte:"Enregistrer la photo",action:"validerCadrage()"},{texte:"Annuler",action:"fermerCam()",style:"sec"}]);
  const img=new Image();
  img.onload=function(){ cad.img=img; dessinerCadrage(); brancherCadrage(); };
  img.src=src;
}
function dessinerCadrage(){
  const cv=document.getElementById("cadCv"); if(!cv||!cad.img) return;
  const cx=cv.getContext("2d");
  cx.fillStyle="#EEE"; cx.fillRect(0,0,cv.width,cv.height);
  const base=Math.max(cv.width/cad.img.width,cv.height/cad.img.height), s=base*cad.zoom;
  const w=cad.img.width*s, h=cad.img.height*s;
  const maxX=Math.max(0,(w-cv.width)/2), maxY=Math.max(0,(h-cv.height)/2);
  cad.x=Math.max(-maxX,Math.min(maxX,cad.x)); cad.y=Math.max(-maxY,Math.min(maxY,cad.y));
  cx.drawImage(cad.img,(cv.width-w)/2+cad.x,(cv.height-h)/2+cad.y,w,h);
}
function brancherCadrage(){
  const cv=document.getElementById("cadCv"); if(!cv) return;
  let px=0,py=0,on=false;
  const deb=e=>{ on=true; const p=e.touches?e.touches[0]:e; px=p.clientX; py=p.clientY; };
  const bou=e=>{ if(!on) return; const p=e.touches?e.touches[0]:e;
    cad.x+=p.clientX-px; cad.y+=p.clientY-py; px=p.clientX; py=p.clientY; dessinerCadrage(); e.preventDefault(); };
  const fin=()=>{ on=false; };
  cv.addEventListener("mousedown",deb); cv.addEventListener("mousemove",bou); window.addEventListener("mouseup",fin);
  cv.addEventListener("touchstart",deb,{passive:true}); cv.addEventListener("touchmove",bou,{passive:false}); cv.addEventListener("touchend",fin);
}
function validerCadrage(){
  const cv=document.getElementById("cadCv"), e=eleve(cad.eid);
  if(!cv||!cad.img||!e){ fermerCam(); return; }
  const out=document.createElement("canvas"); out.width=132; out.height=176;
  const k=out.width/cv.width, cx=out.getContext("2d");
  const base=Math.max(cv.width/cad.img.width,cv.height/cad.img.height), s=base*cad.zoom;
  const w=cad.img.width*s*k, h=cad.img.height*s*k;
  cx.fillStyle="#FFF"; cx.fillRect(0,0,out.width,out.height);
  cx.drawImage(cad.img,(out.width-w)/2+cad.x*k,(out.height-h)/2+cad.y*k,w,h);
  e.photo=out.toDataURL("image/jpeg",0.72);
  modifie(); fermerCam(); rendre();
}

/* =================== VIE SCOLAIRE ET COURRIER (v14) ==================== */
/* Calendrier scolaire, carnets de billets à souches et leur registre,
   lettres aux parents, documents administratifs du personnel et registre du
   courrier départ. Chaque courrier reçoit un numéro d'ordre qui se suit. */

/* --- dates ------------------------------------------------------------- */
const JOURS_SEM=["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function versDate(s){ const m=String(s||"").match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/); if(!m) return null;
  const d=new Date(Number(m[3]),Number(m[2])-1,Number(m[1])); return d.getMonth()===Number(m[2])-1?d:null; }
function versTexte(d){ return String(d.getDate()).padStart(2,"0")+"/"+String(d.getMonth()+1).padStart(2,"0")+"/"+d.getFullYear(); }
function aujourdhui(){ return versTexte(new Date()); }
function dateLongue(s){ const d=versDate(s); return d?(d.getDate()===1?"1er":d.getDate())+" "+MOIS[d.getMonth()]+" "+d.getFullYear():esc(s||"…"); }
function dateJour(s){ const d=versDate(s); return d?JOURS_SEM[d.getDay()]+" "+dateLongue(s):dateLongue(s); }
function joursEntre(a,b){ const x=versDate(a), y=versDate(b); return x&&y?Math.round((y-x)/86400000)+1:null; }
function lendemainOuvrable(s){ const d=versDate(s); if(!d) return ""; d.setDate(d.getDate()+1); if(d.getDay()===0) d.setDate(d.getDate()+1); return versTexte(d); }

/* --- calendrier scolaire ------------------------------------------------ */
/* Calendrier 2026-2027 (arrêté conjoint, tel que rapporté par la presse) ;
   chaque établissement peut l'ajuster. */
const CALENDRIER_OFFICIEL={annee:"2026-2027",periodes:[
  {lib:"1er trimestre",t:1,deb:"01/10/2026",fin:"18/12/2026"},
  {lib:"Congés",t:0,deb:"19/12/2026",fin:"03/01/2027"},
  {lib:"2e trimestre",t:2,deb:"04/01/2027",fin:"20/03/2027"},
  {lib:"Congés",t:0,deb:"21/03/2027",fin:"30/03/2027"},
  {lib:"3e trimestre",t:3,deb:"31/03/2027",fin:"31/05/2027"},
  {lib:"Examens",t:0,deb:"01/06/2027",fin:"15/07/2027"}]};
function calendrier(){ if(!S.calendrier||!Array.isArray(S.calendrier.periodes)) S.calendrier=JSON.parse(JSON.stringify(CALENDRIER_OFFICIEL)); return S.calendrier; }
function periodeDe(s){ const d=versDate(s); if(!d) return null;
  return calendrier().periodes.find(p=>{ const a=versDate(p.deb), b=versDate(p.fin); return a&&b&&d>=a&&d<=b; })||null; }
function trimestreDe(s){ const p=periodeDe(s); return p?Number(p.t)||0:0; }
VUES.calendrier=function(){
  const c=calendrier();

  if(l.length===1) return l[0];

function verifEleveBillet(){
  const z=document.getElementById("rg_qui"), inp=document.getElementById("rg_el"); if(!z||!inp) return;
  const v=inp.value.trim(); if(!v){ z.innerHTML=""; return; }
  const e=eleveDepuisSaisie(v);

    z.innerHTML='<div class="info" style="margin:0">Élève reconnu : <b>'+esc(e.nom)+'</b> — '+esc(c.code||"")+(e.matricule?' · matricule '+esc(e.matricule):'')
      +(e.sexe?' · '+(e.sexe==="F"?"fille":"garçon"):'')+'. Vérifiez que c\'est bien le nom écrit sur la souche.</div>'; return; }
  const n=normNom(v.replace(/\s+—\s+.*$/,"")), act=S.eleves.filter(x=>!x.depart);
  const memes=act.filter(x=>normNom(x.nom)===n), proches=act.filter(x=>n.length>=2&&normNom(x.nom).indexOf(n)>=0);
  z.innerHTML=memes.length>1?'<div class="prudence" style="margin:0">'+memes.length+' élèves portent ce nom ('+memes.map(x=>esc((classe(x.classeId)||{}).code||"")).join(", ")

}
function majTypeBillet(depuisListe){
  const g=id=>document.getElementById(id);
  if(!depuisListe){ const m=g("rg_no").value.trim().toUpperCase().match(/^([ERSJ])-/); if(m) g("rg_type").value=m[1]; }
  const t=g("rg_type").value;
  g("rg_hB").style.display=t==="E"?"":"none"; g("rg_arB").style.display=(t==="R"||t==="S")?"":"none"; g("rg_matB").style.display=t==="J"?"":"none";

function enregistrerBillet(){
  const g=id=>document.getElementById(id), b=billets();
  const t=g("rg_type").value; let no=g("rg_no").value.trim().toUpperCase();
  if(/^\d+$/.test(no)) no=noBillet(t,Number(no));
  if(!no){ alert("Indiquez le numéro du billet, tel qu'il figure sur la souche."); return; }
  if(b.liste.some(x=>x.no===no)){ alert("Le billet "+no+" est déjà enregistré."); return; }
  const e=eleveDepuisSaisie(g("rg_el").value);
  if(!e){ const n=normNom(g("rg_el").value), k=S.eleves.filter(x=>!x.depart&&normNom(x.nom)===n).length;
    alert(k>1?"Plusieurs élèves portent ce nom. Choisissez dans la liste celui de la bonne classe, ou tapez le matricule."
      :"Élève introuvable. Choisissez-le dans la liste proposée pendant la frappe, ou tapez son matricule."); return; }
  if(!versDate(regDate)){ alert("Date des billets attendue au format jj/mm/aaaa."); return; }
  const p=periodeDe(regDate);
  if(!p||!p.t){ if(!confirm("Le "+regDate+" n'appartient à aucun trimestre du calendrier scolaire. Enregistrer quand même ?")) return; }
  const x={no:no,type:t,date:regDate,t:trimestreDe(regDate)||trimActif,eid:e.id,justifie:g("rg_j").value==="oui",motif:g("rg_mo").value.trim()};
  if(t==="E"){ const hh=nbr(g("rg_h").value); if(hh===null||hh<=0){ alert("Indiquez le nombre d'heures d'absence."); return; } x.heures=hh; }
  if(t==="R"||t==="S") x.heure=g("rg_ar").value.trim();

  b.liste.push(x); modifie(); rendre();
  const n=document.getElementById("rg_no"); if(n) n.focus();
}
function supprBillet(no){ const b=billets(); if(!confirm("Retirer le billet "+no+" du registre ?")) return; b.liste=b.liste.filter(x=>x.no!==no); modifie(); rendre(); }
/* totaux d'un élève sur un trimestre, tirés du registre */
function totauxBillets(eid,t){
  const l=(S.billets&&S.billets.liste||[]).filter(x=>x.eid===eid&&Number(x.t)===Number(t));
  if(!l.length) return null;
  let aj=0,an=0,r=0; l.forEach(x=>{ if(x.type==="E"){ if(x.justifie) aj+=x.heures||0; else an+=x.heures||0; } if(x.type==="R") r++; });
  return {absJ:String(aj).replace(".",","),absN:String(an).replace(".",","),ret:String(r),n:l.length};
}

  "Kuilsé":"KLS","Liptako":"LPT","Nakambé":"NKB","Nazinon":"NZN","Oubri":"OBR","Sirba":"SRB","Soum":"SUM",

/* --- accords selon le sexe ---------------------------------------------- */
/* Au Burkina Faso, « Camarade » remplace « Monsieur » ou « Madame » dans les
   courriers de service. Réglable dans la fiche Établissement. */
function formuleAdresse(){ return (S.etab.adresse||"Camarade"); }
function civilite(f){ return formuleAdresse()==="Camarade"?"Camarade":(f?"Madame":"Monsieur"); }
function accordAgent(p){ const f=p&&p.genre==="Féminin";
  return {civ:civilite(f),e:f?"e":"",il:f?"elle":"il",inte:f?"l'intéressée":"l'intéressé",Inte:f?"L'intéressée":"L'intéressé",le:f?"la":"le"}; }
function accordEleve(e){ const f=e&&e.sexe==="F"; return {e:f?"e":"",il:f?"elle":"il",Il:f?"Elle":"Il",enfant:"votre enfant"}; }
function soussigne(){ return 'Je soussigné'+(S.etab.chef?', '+civilite(S.etab.genreChef==="Féminin")+' <b>'+esc(S.etab.chef)+'</b>, ':' ')+esc((S.etab.titreChef||"Le Directeur").replace(/^Le /,""))+' du '+esc(S.etab.nom||"")+','; }
function agentCourt(p,a){ return a.civ+' '+esc(p.nom); }
function agentDesigne(p,a){ return a.civ+' <b>'+esc(p.nom)+'</b>'+(p.matricule?', matricule <b>'+esc(p.matricule)+'</b>':'')+(p.emploi?', '+esc(p.emploi):'')+(p.option?', option : <b>'+esc(p.option)+'</b>':''); }

function genererDocPerso(){
  const p=ens(docPersoAgent); if(!p) return;
  const g=id=>{ const x=document.getElementById("dp_"+id); return x?(x.type==="checkbox"?x.checked:x.value.trim()):""; };
  const t=docPersoType, d={agent:p.id,date:g("date")||aujourdhui()};
  ["note","dnote","dps","regul","loge","eco","dcs","dpc","motif","dest","du","au","lieu","objet","transp","frais","concl","faits","dfaits","reference"].forEach(k=>{ const v=g(k); if(v!==""&&v!==undefined) d[k]=v; });
  if(t==="admin") d.ind=INDEMNITES.filter((x,i)=>g("ind"+i));
  if(t==="absence"||t==="mission"||t==="stage"){ if(!versDate(d.du)||!versDate(d.au)){ alert("Indiquez les dates au format jj/mm/aaaa."); return; }
    if(joursEntre(d.du,d.au)<1){ alert("La date de fin précède la date de début."); return; } }
  if(t==="absence"&&joursEntre(d.du,d.au)>3){ alert("Une autorisation d'absence ne peut pas dépasser 72 heures, soit trois jours. Au-delà, la demande relève de la hiérarchie."); return; }
  if((t==="prise"||t==="admin")&&!versDate(d.dps)){ alert("Indiquez la date de prise de service au format jj/mm/aaaa."); return; }
  /* ce qui vaut pour la suite est gardé dans la fiche de l'agent */
  if(t==="prise"||t==="admin"){ p.datePS=d.dps; if(d.note) p.noteAff=d.note; if(d.dnote) p.dateNoteAff=d.dnote; }
  const x=enregistrerCourrier("perso-"+t,DOCS_PERSO[t],p.nom,d,d.date);
  imprimerCourrierHTML(rendreCourrier(x));
}
function rendreCourrier(x){
  const t=x.type.replace(/^(perso|parent)-/,""), d=x.data||{};

  const noteTxt=d.note?' suivant la note de service <b>N° '+esc(d.note)+'</b>'+(d.dnote?' du '+dateLongue(d.dnote):''):'';
  if(t==="prise") return pageCourrier(x.no,"CERTIFICAT DE PRISE DE SERVICE",d.regul?"(Pour régularisation)":"",
    '<p>'+soussigne()+' certifie que '+agentDesigne(p,a)+', affecté'+a.e+' au '+esc(S.etab.nom||"")+noteTxt+', a effectivement pris service le <b>'+dateLongue(d.dps)+'</b>.</p>'
    +'<p>En foi de quoi, le présent certificat de prise de service lui est délivré pour servir et valoir ce que de droit.</p>',x.date);

    return pageCourrier(x.no,"CERTIFICAT ADMINISTRATIF",d.regul?"(Pour régularisation)":"",
    '<p>'+soussigne()+' certifie que '+agentDesigne(p,a)+', affecté'+a.e+noteTxt+' au '+esc(S.etab.nom||"")+(S.etab.province?', province '+esc(phraseProvince().replace(/^de |^du |^des /,m=>m))+'':'')
    +(S.etab.commune?', département de '+esc(S.etab.commune):'')+', a effectivement pris service le <b>'+dateLongue(d.dps)+'</b>'

    +((d.ind||[]).length?'<p>Par conséquent, '+a.inte+' peut prétendre aux indemnités de :</p><ul>'+d.ind.map((i,k)=>'<li>'+esc(i)+' p/c du '+dateLongue(d.dps)+(k<d.ind.length-1?' ;':'.')+'</li>').join("")+'</ul>':'')
    +'<p>En foi de quoi, le présent certificat lui est délivré pour servir et valoir ce que de droit.</p>',x.date,
    sigCourrier("Proposé par :<br>L'Économe",eco?eco.nom:"",eco?eco.diplome:"")+sigCourrier("Certifié exact par :<br>"+esc(S.etab.titreChef||"Le Directeur")+" du "+esc(abrevEtab()),S.etab.chef,S.etab.qualifChef)); }

    +(d.motif==="affectation"?', suite à son affectation'+(d.dest?' au '+esc(d.dest):'')+(d.note?' par note de service <b>N° '+esc(d.note)+'</b>'+(d.dnote?' du '+dateLongue(d.dnote):''):''):(d.motif?', pour motif de '+esc(d.motif):''))+'.</p>'
    +'<p>Jusqu\'à cette date, '+a.inte+' a assuré régulièrement son service dans l\'établissement.</p>'
    +'<p>En foi de quoi, le présent certificat de cessation de service lui est délivré pour servir et valoir ce que de droit.</p>',x.date);
  if(t==="absence") return pageCourrier(x.no,"AUTORISATION D'ABSENCE","",
    '<p>'+esc(S.etab.titreChef||"Le Directeur")+' du '+esc(S.etab.nom||"")+' autorise '+agentDesigne(p,a)+', à s\'absenter de son poste du <b>'+dateJour(d.du)+'</b> au <b>'+dateJour(d.au)+'</b> inclus, soit '
    +enLettres(joursEntre(d.du,d.au))+' ('+joursEntre(d.du,d.au)+') jour(s), pour <b>'+esc(d.motif||"…")+'</b>.</p>'
    +'<p>'+agentCourt(p,a)+' reprendra service le <b>'+dateJour(lendemainOuvrable(d.au))+'</b>. '+(a.il==="elle"?"Elle":"Il")+' prendra toutes les dispositions utiles pour assurer la continuité des enseignements dans ses classes.</p>',x.date);
  if(t==="mission") return pageCourrier(x.no,"ORDRE DE MISSION","",
    '<p>Il est ordonné à '+agentDesigne(p,a)+', de se rendre à <b>'+esc(d.lieu||"…")+'</b> pour <b>'+esc(d.objet||"…")+'</b>, du <b>'+dateJour(d.du)+'</b> au <b>'+dateJour(d.au)+'</b>.</p>'

    '<p>'+soussigne()+' certifie que '+agentDesigne(p,a)

    +', a effectué son stage probatoire du <b>'+dateLongue(d.du)+'</b> au <b>'+dateLongue(d.au)+'</b> dans mon établissement.</p>'
    +(d.concl==="prorog"?'<p>Au cours de cette période, '+a.inte+' n\'a pas encore réuni toutes les conditions attendues.</p><p>En conséquence, j\'estime que le stage de '+a.inte+' doit être prolongé.</p>'
      :'<p>Au cours de cette période, '+a.inte+' a effectué efficacement toutes les tâches qui lui ont été confiées avec beaucoup d\'application, de conscience professionnelle, du sens du service public et du respect de la hiérarchie.</p>'
       +'<p>En conséquence, j\'estime que '+a.inte+' est apte à être titularisé'+a.e+' dans l\'emploi de '+esc((p.emploi||"professeur").replace(/ des .*$/,"").toLowerCase())+'.</p>'),x.date);
  return "";
}

function genererLettre(){
  const g=id=>{ const x=document.getElementById("lp_"+id); return x?x.value.trim():""; };
  const e=eleveDepuisSaisie(g("el")); if(!e){ alert("Élève introuvable : choisissez-le dans la liste proposée."); return; }
  const d={eid:e.id,date:g("date")||aujourdhui()};
  ["jour","heure","bureau","motif","du","au","lieu","faits"].forEach(k=>{ const v=g(k); if(v) d[k]=v; });
  if(lettreType==="exclusion"){ if(!versDate(d.du)||!versDate(d.au)){ alert("Indiquez les dates au format jj/mm/aaaa."); return; }
    const n=joursEntre(d.du,d.au); if(n<1){ alert("La date de fin précède la date de début."); return; }
    if(n>3){ alert("Une exclusion temporaire ne peut pas dépasser 72 heures, soit trois jours."); return; } }
  if((lettreType==="convocation"||lettreType==="discipline")&&!versDate(d.jour)){ alert("Indiquez la date au format jj/mm/aaaa."); return; }
  const x=enregistrerCourrier("parent-"+lettreType,LETTRES_PARENTS[lettreType],e.nom+" ("+((classe(e.classeId)||{}).code||"")+")",d,d.date);
  imprimerCourrierHTML(rendreCourrier(x));
}

function controleHTML(){
  const pb=[];
  if(!S.etab.nom) pb.push("Le nom de l'établissement n'est pas renseigné.");
  if(!S.etab.annee) pb.push("L'année scolaire n'est pas renseignée.");
  if(!S.classes.length) pb.push("Aucune classe enregistrée.");
  S.classes.forEach(function(c){
    const g=grilleDe(c);
    if(!g.length){ pb.push(c.code+" : aucune grille horaire pour ce niveau et cette série. "
      +"Vérifiez l'ordre d'enseignement, le niveau et la série dans la fiche de la classe."); return; }
    [...new Set(orphelines(c).map(s=>s.disc))].forEach(function(d){
      pb.push(c.code+" : "+d+" figure dans l'emploi du temps mais plus au programme de la classe.");
    });
    if(volumeClasse(c)>capaciteClasse(c)) pb.push(c.code+" : "+volumeClasse(c)+" h dues pour "
      +capaciteClasse(c)+" h de créneaux ouverts à ce niveau.");
    if(classeModifiee(c)) pb.push(c.code+" : volumes horaires ajustés localement, hors grille officielle.");
    g.forEach(function(gr){
      const sv=serviceDe(c.id,gr.disc);
      if(!sv||!sv.ensId){ pb.push(c.code+" : "+gr.disc+" sans enseignant."); return; }
      const p=heuresPlacees(c.id,gr.disc);
      if(p<gr.vol) pb.push(c.code+" : "+gr.disc+" — "+(gr.vol-p)+" h non placées.");
      if(p>gr.vol) pb.push(c.code+" : "+gr.disc+" — "+(p-gr.vol)+" h en trop.");
      const e=ens(sv.ensId);
      if(!ensQualifie(e,qualDe(gr))) pb.push(c.code+" : "+e.nom+" enseigne "+gr.disc+" hors de ses disciplines.");
    });
  });
  enseignants().forEach(function(e){
    if(!e.quotite) return;
    const eng=heuresEngagees(e.id);
    if(eng>e.quotite) pb.push(e.nom+" : "+eng+" h de service confiées pour "+e.quotite+" h dues.");
  });
  if(!pb.length) return '<div class="info">Aucune anomalie. L\'emploi du temps peut être transmis.</div>';
  return '<div class="avert"><strong>'+pb.length+' point(s) à régler :</strong><br>'
    +pb.slice(0,40).map(esc).join("<br>")+(pb.length>40?"<br>… et "+(pb.length-40)+" autre(s).":"")+'</div>';
}
