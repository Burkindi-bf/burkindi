  const nl=deux?Math.ceil(l.length/2):l.length;
  for(let i=0;i<nl;i++) h+='<tr>'+cel(l[i])+(deux?cel(l[i+nl]):'')+'</tr>';
  h+='<tr class="to"><td class="g" colspan="'+(nc-1)+'">Volume horaire global attribué'
    +(e.quotite?' (service dû : '+e.quotite+' h)':'')+'</td><td>'+tot+' h</td></tr>';
  return h+'</table>';
}

/* =========================== SAUVEGARDE ================================= */
/* Fichier de sauvegarde chiffré (format « burkindi-sauvegarde », v20).
   En clair dans le fichier : nom de l'établissement, année, date, et les
   enveloppes des comptes qui peuvent l'ouvrir (chef, censeur, secrétariat),
   plus celle du code de secours. Un code enseignant n'ouvre pas une sauvegarde.
   Chiffré avec la clé principale : les données, la liste complète des
   comptes et, sur demande, la signature et le cachet.
   Les sauvegardes non chiffrées de la version 19 et avant restent lisibles. */
const FORMAT_SAUV="burkindi-sauvegarde";
function nomFichier(avecPieces){
  const n=(S.etab.nom||"etablissement").normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/[^A-Za-z0-9]+/g,"-").replace(/^-+|-+$/g,"").slice(0,32)||"etablissement";
  return "Burkindi_Sauvegarde_"+n+"_"+new Date().toISOString().slice(0,10)
    +(avecPieces?"_AVEC-SIGNATURE":"")+".json";
}
function telecharger(blob,nom){
  const url=URL.createObjectURL(blob);
  const a=document.createElement("a");
  a.href=url; a.download=nom;
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(()=>URL.revokeObjectURL(url),4000);
}
async function exporter(avecPieces){
  if(!coffre||!cleMaitre){ alert("Session expirée : rouvrez l'application."); return false; }
  try{
    const pieces=(avecPieces===true);
    S.meta=S.meta||{}; S.meta.derniereSauvegarde=new Date().toISOString(); memoriser();
    const contenu={donnees:S,comptes:coffre.comptes||[]};
    if(pieces) contenu.pieces={signature:signature,cachet:cachet,sigOrig:sigOrig,cachetOrig:cachetOrig};
    const p=await chiffrer(cleMaitre,contenu);
    const f={format:FORMAT_SAUV,version:1,application:"Burkindi "+VERSION_APP,
      etab:S.etab.nom||"",annee:S.etab.annee||"",date:S.meta.derniereSauvegarde,avecPieces:pieces,
      ouverture:(coffre.comptes||[]).filter(c=>c.profil!=="enseignant")
        .map(c=>({id:c.id,nom:c.nom,profil:c.profil,sel:c.sel,iv:c.iv,cle:c.cle})),
      secours:coffre.secours||null,iv:p.iv,data:p.data};
    telecharger(new Blob([JSON.stringify(f)],{type:"application/json"}),nomFichier(pieces));
    sale=false; majBarre(); if(vueActive==="sauvegarde"||vueActive==="accueil") rendre();
    return true;
  }catch(e){
    alert("La sauvegarde a échoué. Vérifiez que le téléchargement est autorisé dans ce navigateur.");
    return false;
  }
}

/* --- lecture d'un fichier de sauvegarde ----------------------------------
   Rend à « suite » le contenu déchiffré {donnees, pieces, comptes}, le
   fichier brut et, pour un fichier chiffré ouvert par code, la clé.
   Une sauvegarde faite sur cette installation s'ouvre sans code (même clé
   principale) ; sinon on demande qui l'a faite et son code. */
let sauvEnCours=null;
function lireSauvegarde(idChamp,suite){
  const inp=document.getElementById(idChamp), f=inp&&inp.files[0];
  if(!f){ alert("Choisissez un fichier."); return; }
  const r=new FileReader();
  r.onload=async function(){
    let d=null;
    try{ d=JSON.parse(r.result); }catch(e){ d=null; }
    if(d&&d.format===FORMAT_SAUV&&d.iv&&d.data){
      if(cleMaitre){
        try{ const c=await dechiffrer(cleMaitre,d); return suite(c,d,null); }catch(e){}
      }
      sauvEnCours={d:d,suite:suite};
      return demanderCodeSauvegarde("");
    }
    if(d&&d.etab&&Array.isArray(d.classes)){
      const pc=d.pieces; delete d.pieces;
      return suite({donnees:d,pieces:pc||null,ancienne:true},d,null);
    }
    alert("Ce fichier n'est pas une sauvegarde valide de cette application.");
  };
  r.onerror=function(){ alert("Le fichier n'a pas pu être lu."); };
  r.readAsText(f);
}
function demanderCodeSauvegarde(msg){
  const d=sauvEnCours.d;
  const opts=(d.ouverture||[]).map(c=>'<option value="'+esc(c.id)+'">'+esc(c.nom)+' — '
      +esc((PROFILS[c.profil]||{t:c.profil}).t)+'</option>').join("")
    +(d.secours?'<option value="secours">Code de secours</option>':'');
  ouvrir("Ouvrir la sauvegarde",
   '<p class="aide">Sauvegarde de <b>'+esc(d.etab||"établissement non renseigné")+'</b>'
   +(d.date?' du '+esc(new Date(d.date).toLocaleDateString("fr-FR")):'')
   +'. Elle est chiffrée : choisissez une personne qui avait un code au moment où elle a été faite, et tapez ce code.</p>'
   +'<div class="champ"><label>Utilisateur</label><select id="s_qui">'+opts+'</select></div>'
   +'<div class="champ"><label>Code</label><div class="oeil"><input type="password" id="s_code" autocomplete="off" '
   +'onkeydown="if(event.key===\'Enter\')ouvrirSauvegarde()"><button type="button" class="vo" '
   +'onclick="voirCode(\'s_code\')" aria-label="Afficher le code">👁</button></div></div>'
   +(msg?'<div class="prudence">'+esc(msg)+'</div>':''),
   [{texte:"Ouvrir",action:"ouvrirSauvegarde()"},{texte:"Annuler",action:"sauvEnCours=null;fermer()",style:"sec"}]);
  setTimeout(()=>{ const c=document.getElementById("s_code"); if(c) c.focus(); },60);
}
async function ouvrirSauvegarde(){
  if(!sauvEnCours) return;
  const d=sauvEnCours.d, qui=document.getElementById("s_qui").value;
  let code=document.getElementById("s_code").value;
  const env=(qui==="secours")?d.secours:(d.ouverture||[]).find(c=>c.id===qui);
  if(qui==="secours") code=code.trim().toUpperCase().replace(/\s+/g,"");
  if(!env||!code){ demanderCodeSauvegarde("Choisissez l'utilisateur et tapez son code."); return; }
  let brut, cle, c;
  try{
    brut=await brutDeEnveloppe(code,env);
    cle=await crypto.subtle.importKey("raw",brut,"AES-GCM",true,["encrypt","decrypt"]);
    c=await dechiffrer(cle,d);
  }catch(e){
    demanderCodeSauvegarde("Code incorrect pour cette sauvegarde. Si le code a été changé depuis, "
      +"essayez l'ancien code ou le code de secours.");
    return;
  }
  const suite=sauvEnCours.suite; sauvEnCours=null;
  suite(c,d,{brut:brut,cle:cle,compte:qui});
}
function poserPieces(pc){
  if(!pc) return;
  if(pc.signature){ signature=pc.signature; sigOrig=pc.sigOrig||""; }
  if(pc.cachet){ cachet=pc.cachet; cachetOrig=pc.cachetOrig||""; }
}

/* ==================== PROTECTION ET LICENCE (essai) ==================== */
/* Données chiffrées dans l'appareil et dans les fichiers de sauvegarde
   (AES-GCM 256, clé principale aléatoire). Chaque utilisateur a son code,
   dont on dérive (PBKDF2-SHA-256, 150 000 tours) la clé qui « enveloppe »
   la clé principale. Licence signée (ECDSA P-256) vérifiée hors ligne. */

const CLE_COFFRE="burkindi_coffre_v1";
const CLE_LIC="burkindi_licence_v1";
const CLE_VUE="burkindi_derniere_vue";
const LIC_PUB="MFkwEwYHKoZIzj0CAQYIKoZIzj0DAQcDQgAERVn+Jk5w42XAAKeZtFuBqxew2NzDR6GZ87iYI6eFUvEaRKeK5or6fQk0eC+uuGTA7wcFUdOG5DFIe9lQIOGLgA==";   /* clé d'ESSAI v21 — la clé définitive viendra avec la 1.0 */
const INACTIVITE=25*60*1000;

let cleBruteMem=null;
let coffre=null;      /* {comptes:[...], secours, iv, data, maj} — voir STOCKAGE DANS L'APPAREIL */
let cleMaitre=null;   /* CryptoKey, en mémoire seulement */
let moi=null;         /* compte ouvert */
let licence=null;     /* charge utile vérifiée */
let lectureSeule=false, minuterie=null;

/* par tranches : String.fromCharCode.apply échoue au-delà d'environ 150 000 octets
   (défaut de la v19 : au-delà, plus rien n'était enregistré dans l'appareil) */
const b64=u=>{ const a=new Uint8Array(u); let s="";
  for(let i=0;i<a.length;i+=0x8000) s+=String.fromCharCode.apply(null,a.subarray(i,i+0x8000));
  return btoa(s); };
const deb64=s=>{ const b=atob(s), u=new Uint8Array(b.length); for(let i=0;i<b.length;i++) u[i]=b.charCodeAt(i); return u; };
const b64u=s=>s.replace(/-/g,"+").replace(/_/g,"/");
const txt=new TextEncoder(), dtxt=new TextDecoder();
function alea(n){ const u=new Uint8Array(n); crypto.getRandomValues(u); return u; }

async function cleDeCode(code,sel,iter){
  const base=await crypto.subtle.importKey("raw",txt.encode(code),"PBKDF2",false,["deriveKey"]);
  return crypto.subtle.deriveKey({name:"PBKDF2",salt:sel,iterations:iter||150000,hash:"SHA-256"},
    base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
}
async function chiffrer(cle,obj){
  const iv=alea(12);
  const d=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},cle,txt.encode(JSON.stringify(obj)));
  return {iv:b64(iv),data:b64(d)};
}
async function dechiffrer(cle,paquet){
  const d=await crypto.subtle.decrypt({name:"AES-GCM",iv:deb64(paquet.iv)},cle,deb64(paquet.data));
  return JSON.parse(dtxt.decode(d));
}
/* la clé principale est enveloppée par le code de chaque utilisateur */
async function envelopper(code,sel,brut){
  const c=await cleDeCode(code,deb64(sel));
  const iv=alea(12);
  const d=await crypto.subtle.encrypt({name:"AES-GCM",iv:iv},c,brut);
  return {iv:b64(iv),cle:b64(d)};
}
async function brutDeEnveloppe(code,cpt){
  const c=await cleDeCode(code,deb64(cpt.sel));
  return crypto.subtle.decrypt({name:"AES-GCM",iv:deb64(cpt.iv)},c,deb64(cpt.cle));
}
async function ouvrirEnveloppe(code,cpt){
  const brut=await brutDeEnveloppe(code,cpt);
  cleBruteMem=new Uint8Array(brut);
  return crypto.subtle.importKey("raw",brut,"AES-GCM",true,["encrypt","decrypt"]);
}
/* ===================== STOCKAGE DANS L'APPAREIL (v20) =================== */
/* Le coffre (comptes + données chiffrées) et les pièces (signature et cachet,
   chiffrés à part) sont rangés dans la base IndexedDB du navigateur, qui
   accepte bien plus que les 5 Mo environ du localStorage, vite atteints avec
   les photos des élèves. Si la base est indisponible (navigation privée,
   navigateur ancien), on se replie sur le localStorage : même format.
   Chaque enregistrement porte sa date (maj). Si les deux emplacements en
   contiennent un (données de la v19, ou session de repli), le plus récent est
   gardé dans la base et l'autre effacé.
   Les écritures passent par une file : une seule à la fois, et c'est toujours
   l'état le plus récent qui est écrit en dernier. Un échec (appareil plein)
   est signalé à l'écran au lieu d'être ignoré. */
const BASE_NOM="burkindi", BASE_TABLE="coffre";
const CLE_LS={coffre:CLE_COFFRE,pieces:"burkindi_pieces_v1"};
let base=null, modeStock="";
let piecesAEcrire=false, ecritureEnCours=null, ecritureDemandee=false, erreurStock="", taillePieces=0;

function ouvrirBase(){
  return new Promise(function(res){
    let fait=false; const fin=v=>{ if(!fait){ fait=true; res(v); } };
    setTimeout(()=>fin(null),4000);
    try{
      const rq=indexedDB.open(BASE_NOM,1);
      rq.onupgradeneeded=function(){ try{ rq.result.createObjectStore(BASE_TABLE); }catch(e){} };
      rq.onsuccess=()=>fin(rq.result);
      rq.onerror=()=>fin(null);
      rq.onblocked=()=>fin(null);
    }catch(e){ fin(null); }
  });
}
function reqBase(mode,f){
  return new Promise(function(res,rej){
    let q=null;
    const t=base.transaction(BASE_TABLE,mode);
    t.oncomplete=()=>res(q?q.result:undefined);
    t.onerror=()=>rej(t.error);
    t.onabort=()=>rej(t.error||new Error("transaction annulée"));
    q=f(t.objectStore(BASE_TABLE));
  });
}
async function initStock(){
  if(window.indexedDB){
    const b=await ouvrirBase();
    if(b){
      base=b;
      try{ await reqBase("readwrite",st=>st.put(Date.now(),"essai")); await reqBase("readwrite",st=>st.delete("essai")); modeStock="base"; }
      catch(e){ base=null; }
    }
  }
  if(!modeStock) modeStock="memoire-simple";
  /* demande au navigateur de ne pas effacer la base quand l'appareil manque de place
     (Chrome et Edge répondent sans rien afficher ; Firefox poserait une question) */
  try{ if(navigator.storage&&navigator.storage.persist&&!/Firefox/.test(navigator.userAgent)) navigator.storage.persist(); }catch(e){}
}
function lsLire(nom){ try{ const s=localStorage.getItem(CLE_LS[nom]); return s?JSON.parse(s):null; }catch(e){ return null; } }
function lsEffacer(nom){ try{ localStorage.removeItem(CLE_LS[nom]); }catch(e){} }
async function stockLire(nom){
  const ls=lsLire(nom);
  if(modeStock!=="base") return ls;
  let b=null;
  try{ b=await reqBase("readonly",st=>st.get(nom)); }catch(e){ b=null; }
  if(ls&&(!b||!ls.maj||ls.maj>(b.maj||""))){
    try{ await reqBase("readwrite",st=>st.put(ls,nom)); lsEffacer(nom); }catch(e){}
    return ls;
  }
  if(ls) lsEffacer(nom);
  return b||null;
}
async function stockEcrire(nom,val){
  if(modeStock==="base") return reqBase("readwrite",st=>st.put(val,nom));
  localStorage.setItem(CLE_LS[nom],JSON.stringify(val));
}
async function lireCoffre(){
  try{ return await stockLire("coffre"); }catch(e){ return null; }
}
/* À appeler autant qu'on veut : les demandes rapprochées sont regroupées. */
function ecrireCoffre(){
  ecritureDemandee=true;
  if(!ecritureEnCours) ecritureEnCours=boucleEcriture();
  return ecritureEnCours;
}
async function boucleEcriture(){
  try{
    while(ecritureDemandee){
      ecritureDemandee=false;
      if(!coffre||!cleMaitre) break;
      const cle=cleMaitre, maj=new Date().toISOString();
      const p=await chiffrer(cle,S);
      if(piecesAEcrire){
        piecesAEcrire=false;
        const q=await chiffrer(cle,{signature:signature,cachet:cachet,sigOrig:sigOrig,cachetOrig:cachetOrig});
        q.maj=maj;
        try{ await stockEcrire("pieces",q); taillePieces=q.data.length; }
        catch(e){ piecesAEcrire=true; throw e; }
      }
      coffre.iv=p.iv; coffre.data=p.data; coffre.maj=maj;
      await stockEcrire("coffre",coffre);
      if(erreurStock) signalerStock(null);
    }
  }catch(e){
    signalerStock(e);
  }finally{
    ecritureEnCours=null;
  }
}
function signalerStock(e){
  const avant=erreurStock;
  erreurStock=e?"Les dernières modifications n'ont pas pu être enregistrées dans cet appareil "
    +"(mémoire pleine, ou navigation privée). Elles ne sont gardées que tant que l'application reste "
    +"ouverte : enregistrez tout de suite une sauvegarde dans un fichier.":"";
  if(erreurStock&&!avant) setTimeout(()=>alert(erreurStock),0);
  if(erreurStock!==avant&&cleMaitre){ majBarre(); if(!document.getElementById("voile").classList.contains("on")) rendre(); }
}
/* Signature et cachet : chiffrés, lus après l'ouverture de session.
   Reprise de la v19, qui les gardait en clair dans l'appareil. */
async function lirePieces(){
  signature=""; cachet=""; sigOrig=""; cachetOrig=""; taillePieces=0;
  let p=null;
  try{ p=await stockLire("pieces"); }catch(e){ p=null; }
  if(p&&p.iv&&p.data){
    try{
      const x=await dechiffrer(cleMaitre,p);
      signature=x.signature||""; cachet=x.cachet||""; sigOrig=x.sigOrig||""; cachetOrig=x.cachetOrig||"";
      taillePieces=p.data.length;
    }catch(e){}
  }
  const cles=[CLE_SIG,CLE_SIG+"_o",CLE_CACHET,CLE_CACHET+"_o"];
  let v=[];
  try{ v=cles.map(k=>localStorage.getItem(k)); }catch(e){ return; }
  if(v.every(x=>x===null)) return;
  if(v[0]){ signature=v[0]; sigOrig=v[1]||""; }
  if(v[2]){ cachet=v[2]; cachetOrig=v[3]||""; }
  piecesAEcrire=true;
  await ecrireCoffre();
  if(!erreurStock) cles.forEach(k=>{ try{ localStorage.removeItem(k); }catch(e){} });
}
/* taille des données chiffrées, pour l'écran Sauvegarde */
function libTailleDonnees(){
  const o=((coffre&&coffre.data?coffre.data.length:0)+taillePieces)*0.75;
  const t=o<1048576?Math.max(1,Math.round(o/1024))+" Ko":(o/1048576).toFixed(1).replace(".",",")+" Mo";
  return modeStock==="base"
    ?"Données chiffrées rangées dans la base de l'appareil : "+t+"."
    :"Ce navigateur n'ouvre pas la base de l'appareil : les données chiffrées ("+t+") sont rangées dans "
      +"la petite mémoire du navigateur, limitée à environ 5 Mo. Utilisez de préférence Chrome ou Edge à jour, "
      +"hors navigation privée.";
}

/* --- licence ------------------------------------------------------------ */
async function verifierLicence(jeton){
  try{
    const [corps,sig]=String(jeton).trim().split(".");
    const cle=await crypto.subtle.importKey("spki",deb64(LIC_PUB),{name:"ECDSA",namedCurve:"P-256"},false,["verify"]);
    const ok=await crypto.subtle.verify({name:"ECDSA",hash:"SHA-256"},cle,deb64(b64u(sig)),txt.encode(corps));
    if(!ok) return null;
    return JSON.parse(dtxt.decode(deb64(b64u(corps))));
  }catch(e){ return null; }
}
function finLicence(){ return licence?new Date(licence.exp):null; }
function licenceRestante(){ const f=finLicence(); return f?f.getTime()-Date.now():0; }
function libRestant(){
  const ms=licenceRestante();
  if(ms<=0) return "expirée";
  const h=Math.floor(ms/3600000), m=Math.floor(ms%3600000/60000);
  if(h>=48) return Math.floor(h/24)+" jours";
  return h?h+" h "+String(m).padStart(2,"0"):m+" minute(s)";
}
function horlogeReculee(){
  try{
    const v=localStorage.getItem(CLE_VUE);
    if(v&&Date.now()<Date.parse(v)-3600000) return true;
    localStorage.setItem(CLE_VUE,new Date().toISOString());
  }catch(e){}
  return false;
}
function majLectureSeule(){
  lectureSeule=!licence||licenceRestante()<=0||horlogeReculee();
  return lectureSeule;
}

function ecranVerrou(msg,champs,boutons){

      +"d'établissement : les données du fichier seront reprises aussitôt après.");

  S=fusionner(c.donnees);
  poserPieces(c.pieces);
  if(S.etab.chefSigne!==S.etab.chef||!signature){ signature=""; sigOrig=""; S.etab.chefSigne=""; }
  moi=(k.compte==="secours")?{id:"secours",nom:"Code de secours",profil:"chef"}:(coffre.comptes.find(x=>x.id===k.compte)||coffre.comptes[0]);
  piecesAEcrire=true; sale=false;

  await demarrer2();

async function installer(){
  const nom=document.getElementById("i_nom").value.trim(), c1=document.getElementById("i_code").value, c2=document.getElementById("i_code2").value;
  if(!nom){ messageVerrou("Indiquez le nom du chef d'établissement."); return; }
  if(c1.length<8){ messageVerrou("Le code doit compter au moins 8 caractères."); return; }
  if(c1!==c2){ messageVerrou("Les deux codes ne sont pas identiques."); return; }
  const brut=alea(32); cleBruteMem=brut;
  cleMaitre=await crypto.subtle.importKey("raw",brut,"AES-GCM",true,["encrypt","decrypt"]);
  const sel=b64(alea(16)), env=await envelopper(c1,sel,brut);
  const secret=motDeSecours(), selS=b64(alea(16)), envS=await envelopper(secret,selS,brut);
  coffre={comptes:[{id:uid(),nom:nom,profil:"chef",sel:sel,iv:env.iv,cle:env.cle}],
    secours:{sel:selS,iv:envS.iv,cle:envS.cle}};
  S=vide(); S.etab.chef=nom;
  if(sauvAncienne){
    S=fusionner(sauvAncienne.donnees);
    poserPieces(sauvAncienne.pieces);
    if(!S.etab.chef) S.etab.chef=nom;
    if(S.etab.chefSigne!==S.etab.chef||!signature){ signature=""; sigOrig=""; S.etab.chefSigne=""; }
    piecesAEcrire=true; sauvAncienne=null;
  }
  await ecrireCoffre();
  moi=coffre.comptes[0];
  ouvrir("Code de secours",'<p>Notez ce code sur papier et rangez-le en lieu sûr. Il ouvre l\'application si un code est oublié. '
   +'Il ne sera plus jamais affiché.</p><div class="secours">'+esc(secret)+'</div>'
   +'<p class="aide">Sans ce code et sans aucun code d\'accès, les données sont définitivement illisibles.</p>',
   [{texte:"J'ai noté ce code",action:"fermer();demarrer2()"}]);
}
function motDeSecours(){
  const A="ABCDEFGHJKLMNPQRSTUVWXYZ23456789", u=alea(20);
  let s=""; for(let i=0;i<20;i++){ s+=A[u[i]%A.length]; if(i%5===4&&i<19) s+="-"; }
  return s;
}

/* ================= APPLICATION INSTALLABLE (v23) ========================
   Quand Burkindi est ouvert depuis son adresse internet (GitHub Pages), un
   « service worker » garde l'application dans l'appareil : elle s'installe et
   fonctionne ensuite sans internet. Les mises à jour ne sont jamais silencieuses :
   la nouvelle version attend que l'utilisateur la demande, après sauvegarde.
   Ouvert comme simple fichier, Burkindi fonctionne comme avant, sans rien de tout cela. */

function estInstallee(){
  try{ return matchMedia("(display-mode: standalone)").matches||matchMedia("(display-mode: window-controls-overlay)").matches||navigator.standalone===true; }
  catch(e){ return false; }
}
function modeOuverture(){
  return estInstallee()?"application installée":(EN_LIGNE_HTTP?"site ouvert dans le navigateur":"fichier ouvert dans le navigateur");
}
function pwaAttente(){ return pwaReg&&pwaReg.waiting&&navigator.serviceWorker&&navigator.serviceWorker.controller?pwaReg.waiting:null; }
function majBandeauApp(){
  let b=document.getElementById("bandeauApp"), h="";
  if(pwaMajDemandee){
    h='<div class="bt"><b>Mise à jour en cours…</b> Burkindi va redémarrer ; il faudra retaper votre code.</div>';
  } else if(pwaAttente()&&!pwaMasque.maj){
    const sess=!!(coffre&&cleMaitre);
    h='<div class="bt"><b>Nouvelle version de Burkindi disponible'+(pwaVersionAttente?' (version '+esc(pwaVersionAttente)+')':'')+'.</b> '
     +'Enregistrez d\'abord une sauvegarde, puis mettez à jour. Vos données restent dans l\'appareil ; '
     +'Burkindi redémarrera et il faudra retaper votre code.'
     +(sess?'':' <i>Ouvrez votre session pour pouvoir enregistrer la sauvegarde.</i>')+'</div>'
     +'<div class="ba">'+(sess&&vueAutorisee("sauvegarde")?'<button class="btn" onclick="pwaSauvegarder()">Enregistrer une sauvegarde</button>':'')
     +'<button class="btn'+(sess&&vueAutorisee("sauvegarde")?' sec':'')+'" onclick="pwaMettreAJour()">Mettre à jour maintenant</button>'
     +'<button class="btn sec" onclick="pwaMasque.maj=true;majBandeauApp()">Plus tard</button></div>';
  } else if(pwaInvite&&!estInstallee()&&!pwaMasque.install){
    h='<div class="bt"><b>Installer Burkindi sur cet appareil ?</b> Il s\'ouvrira depuis son icône, comme les autres applications, '
     +'et fonctionnera sans internet.</div>'

  if(!b){ b=document.createElement("div"); b.id="bandeauApp"; b.setAttribute("role","status"); document.body.appendChild(b); }
  b.innerHTML=h; document.body.classList.add("avecBandeau");
}
function pwaSauvegarder(){ go("sauvegarde"); }
async function pwaMettreAJour(){
  const w=pwaAttente();
  if(!w){ location.reload(); return; }
  if(coffre&&cleMaitre&&sale&&!confirm("Des modifications n'ont pas encore été enregistrées dans un fichier de sauvegarde.\n\n"
    +"Elles restent dans l'appareil et la mise à jour ne les efface pas, mais une sauvegarde est la seule garantie en cas de problème.\n\n"
    +"Mettre à jour quand même ?")) return;
  try{ if(coffre&&cleMaitre) await ecrireCoffre(); }catch(e){}
  pwaMajDemandee=true; majBandeauApp();

function pwaNouvelle(){

async function etatProtection(){
  if(!(navigator.storage&&navigator.storage.persisted)) return null;
  try{ return await navigator.storage.persisted(); }catch(e){ return null; }
}

  const z=document.getElementById("etatProtection"); if(!z) return;
  const p=await etatProtection(), b=document.getElementById("btnProteger");

  else if(p===false){ z.className="prudence"; z.innerHTML="<b>Protection non accordée.</b> Si l'appareil manque de place, le navigateur pourrait effacer les données de Burkindi. "
    +(estInstallee()?"Cliquez sur « Demander la protection ».":"Elle est en général accordée à l'application installée : installez Burkindi, ouvrez-le depuis son icône, puis cliquez sur « Demander la protection »."); }
  else { z.className="prudence"; z.innerHTML="La protection n'est pas disponible dans ce navigateur ou dans ce mode d'ouverture. Utilisez Chrome ou Edge, de préférence avec l'application installée."; }
  if(b) b.style.display=(p===false)?"":"none";
}

  window.addEventListener("load",function(){
    navigator.serviceWorker.register("sw.js").then(function(reg){
      pwaReg=reg;
      if(pwaAttente()) pwaNouvelle();
      reg.addEventListener("updatefound",function(){
        const n=reg.installing; if(!n) return;
        n.addEventListener("statechange",function(){ if(n.state==="installed"&&navigator.serviceWorker.controller) pwaNouvelle(); });
      });
      setInterval(function(){ reg.update().catch(function(){}); },3600000);
    }).catch(function(e){ console.warn("Burkindi : fonctionnement hors ligne indisponible",e); });
  });
}
window.addEventListener("beforeinstallprompt",function(e){ e.preventDefault(); pwaInvite=e; majBandeauApp(); });
window.addEventListener("appinstalled",function(){
  pwaInvite=null; majBandeauApp();
  try{ if(navigator.storage&&navigator.storage.persist) navigator.storage.persist(); }catch(e){}
});
