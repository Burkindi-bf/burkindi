<style>
:root{--surface:#F4F5F3;--card:#FFF;--ink:#1F2421;--ink-soft:#5B635E;--line:#D9DDD8;
--vert:#0F5A45;--vert-clair:#E3EFE9;--vert-vif:#1F7A5E;--rouge:#A8332A;--rouge-clair:#FBE9E7;
--ambre:#7A5200;--ambre-clair:#FBF0D5;--or:#E0A526;--bloque:#EEEFEC;--r:10px}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:var(--surface);color:var(--ink);font-family:"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;font-size:16px;line-height:1.5;-webkit-text-size-adjust:100%}
button{font-family:inherit;font-size:inherit}
#bar{position:sticky;top:0;z-index:40;background:var(--vert);color:#fff;padding:14px 16px 10px;display:flex;align-items:center;gap:12px}
#bar::before{content:"";position:absolute;left:0;right:0;top:0;height:4px;background:linear-gradient(#EF2B2D 0 50%,#009E49 50% 100%)}
#bar .retour{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.45);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:600;white-space:nowrap;font-size:14px}
#bar .retour:hover{background:rgba(255,255,255,.22)}
#barDrapeau svg{display:block;width:38px;height:38px}
#bar .ident{flex:1;min-width:0}
#bar .ident .t{font-weight:650;font-size:15.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .ident .s{font-size:12.5px;color:rgba(255,255,255,.84)}
#etatSauv{font-size:12.5px;font-weight:600;padding:6px 12px;border-radius:999px;background:rgba(255,255,255,.16);color:#fff;white-space:nowrap}
#etatSauv.sale{background:#FBF0D5;color:#7A5200}
#bar .term{background:rgba(255,255,255,.12);border:1.5px solid rgba(255,255,255,.45);color:#fff;border-radius:10px;padding:8px 14px;cursor:pointer;font-weight:600;white-space:nowrap;font-size:14px}
#bar .term:hover{background:rgba(255,255,255,.22)}
@media(max-width:720px){#bar .term{display:none}#barDrapeau{display:none}}
#fil{max-width:1180px;margin:0 auto;padding:12px 14px 0;font-size:13.5px;color:var(--ink-soft);display:flex;gap:7px;flex-wrap:wrap;align-items:center}
#fil button{background:none;border:0;padding:0;color:var(--vert);cursor:pointer;font-weight:600;font-size:13.5px}
#fil button:hover{text-decoration:underline}
#fil .sep{color:#A3A8A4}
#fil .ici{color:var(--ink);font-weight:600}
#banniere{background:var(--ambre-clair);border-bottom:1px solid #E6D3A8;color:#6B4B08;padding:9px 14px;font-size:13px}
main{max-width:1180px;margin:0 auto;padding:16px 14px 90px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:24px;line-height:1.25;margin:4px 0;font-weight:700}
h2{font-size:17px;margin:26px 0 10px;font-weight:650}
.sous{color:var(--ink-soft);font-size:14.5px;margin:0 0 18px;max-width:62ch}
.etapes{display:flex;flex-direction:column;gap:8px;margin:16px 0}
.etape{display:flex;background:var(--card);border:1px solid var(--line);border-radius:var(--r);cursor:pointer;text-align:left;width:100%;padding:0;overflow:hidden}
.etape:hover{border-color:var(--vert)}
.etape:focus-visible{outline:3px solid var(--vert-vif);outline-offset:2px}
.etape .rail{width:6px;background:var(--line);flex:0 0 6px}
.etape.ok .rail{background:var(--vert-vif)}
.etape.encours .rail{background:var(--ambre)}
.etape .num{flex:0 0 46px;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:600;color:var(--ink-soft)}
.etape .corps{flex:1;padding:14px 12px 14px 0;min-width:0}
.etape .titre{display:block;font-weight:600;font-size:16.5px}
.etape .detail{display:block;font-size:13.5px;color:var(--ink-soft);margin-top:2px}
.etape .fleche{flex:0 0 34px;display:flex;align-items:center;color:var(--ink-soft);font-size:20px}
.btn{background:var(--vert);color:#fff;border:0;border-radius:9px;padding:12px 18px;cursor:pointer;font-weight:600}
.btn:hover{background:#0F4A3D}
.btn.sec{background:#fff;color:var(--vert);border:1.5px solid var(--vert)}
.btn.sec:hover{background:var(--vert-clair)}
.btn.danger{background:var(--rouge)}
.btn:disabled{background:#C8CDC9;color:#fff;cursor:not-allowed}
.btn.plein{width:100%}
.barre-actions{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0}
.champ{margin-bottom:18px}
.champ label{display:block;font-size:13.5px;font-weight:600;margin-bottom:9px;color:#555}
.champ input,.champ select{width:100%;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;background:#fff;color:var(--ink);font-size:16px}
.champ input:focus,.champ select:focus{outline:0;border-color:var(--vert)}
.duo{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.aide{font-size:12.5px;color:var(--ink-soft);margin-top:4px}
.apercu{max-width:170px;max-height:80px;border:1px solid var(--line);border-radius:8px;background:#fff;padding:4px;margin-top:6px;display:block}
.fiches{display:flex;flex-direction:column;gap:8px}
.fiche{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px 14px;display:flex;align-items:center;gap:12px;cursor:pointer}
.fiche:hover{border-color:var(--vert)}
.fiche .p{flex:1;min-width:0}
.fiche .n{font-weight:600}
.fiche .m{font-size:13.5px;color:var(--ink-soft)}
.vide{background:#fff;border:1.5px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--ink-soft)}
.tag{display:inline-block;font-size:12px;padding:2px 8px;border-radius:999px;background:var(--vert-clair);color:var(--vert);font-weight:600}
.tag.r{background:var(--rouge-clair);color:var(--rouge)}
.tag.v{background:var(--vert-clair);color:var(--vert)}
.tag.a{background:var(--ambre-clair);color:var(--ambre)}
.selclasse{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.selclasse select{flex:1;min-width:160px;padding:11px 12px;border:1.5px solid var(--line);border-radius:9px;font-size:16px;background:#fff}
.jours-onglets{display:flex;gap:6px;overflow-x:auto;margin-bottom:12px;padding-bottom:4px}
.jours-onglets button{flex:0 0 auto;padding:9px 14px;border-radius:999px;border:1.5px solid var(--line);background:#fff;cursor:pointer;font-weight:600;color:var(--ink-soft)}
.jours-onglets button.actif{background:var(--vert);border-color:var(--vert);color:#fff}
table.edt{width:100%;border-collapse:collapse;background:#fff;table-layout:fixed}
table.edt th,table.edt td{border:1px solid var(--line);vertical-align:top}
table.edt th{background:var(--vert-clair);color:var(--vert);font-size:12.5px;padding:8px 4px;font-weight:650}
table.edt th.h{width:88px;font-size:11.5px}
table.edt td{padding:0;height:62px}
table.edt td.bloque{background:var(--bloque)}
.bloque-txt{display:block;padding:8px 5px;font-size:10.5px;color:#8A918B;text-align:center}
.case{width:100%;height:100%;min-height:62px;border:0;background:transparent;padding:6px 5px;cursor:pointer;text-align:left;display:block;font-size:12.5px;line-height:1.3}
.case:hover{background:#F0F4F1}
.case.plein{background:var(--vert-clair)}
.case.plein:hover{background:#D5E7DF}
.case .d{font-weight:650;color:var(--vert)}
.case .e{color:var(--ink-soft);font-size:11.5px}
.case .s{color:var(--ink-soft);font-size:11px}
.case .plus{color:#B9C0BA;font-size:19px;text-align:center;display:block;margin-top:14px}
.compteurs{margin-top:18px}
.cpt{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#fff;border:1px solid var(--line);border-radius:9px;margin-bottom:6px}
.cpt .n{flex:1;font-size:14.5px}
.cpt .v{font-size:13.5px;font-weight:650;white-space:nowrap}
.cpt.ok .v{color:var(--vert-vif)}
.cpt.manque .v{color:var(--rouge)}
.jauge{height:5px;background:var(--line);border-radius:3px;overflow:hidden;width:70px;flex:0 0 70px}
.jauge i{display:block;height:100%;background:var(--vert-vif)}
#voile{position:fixed;inset:0;background:rgba(20,30,26,.5);z-index:100;display:none;align-items:flex-end;justify-content:center}
#voile.on{display:flex}
#fenetre{background:#fff;width:100%;max-width:560px;border-radius:16px 16px 0 0;max-height:88vh;display:flex;flex-direction:column}
#fenetre h3{margin:0;padding:16px 18px 10px;font-size:18px}
#fcorps{padding:0 18px 8px;overflow-y:auto;flex:1}
#fpied{padding:12px 18px 18px;display:flex;gap:10px;flex-wrap:wrap;border-top:1px solid var(--line)}
#fpied .btn{flex:1;min-width:120px}
@media(min-width:620px){#voile{align-items:center}#fenetre{border-radius:14px;max-height:84vh}}
.opt{width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px;cursor:pointer}
.opt:hover{border-color:var(--vert);background:var(--vert-clair)}
.opt:disabled{background:#F6F6F5;cursor:not-allowed;opacity:.7}
.opt .t{font-weight:650}
.opt .s{font-size:13px;color:var(--ink-soft)}
.opt .s.r{color:var(--rouge)}
.defile{overflow:auto;margin:12px 0;-webkit-overflow-scrolling:touch;max-height:calc(100vh - 240px);min-height:200px;border:1px solid #E4E0D8;border-radius:9px;background:#fff}
.defile.court{max-height:none;min-height:0;border:0;border-radius:0;overflow:auto}
.tindispo{border-collapse:collapse;width:100%;font-size:13px}
.tindispo th,.tindispo td{border:1px solid #E4E0D8;padding:4px 5px;text-align:center}
.tindispo th{background:#F6F4EF;font-weight:600}
.tindispo th.cn{text-align:left;white-space:nowrap;font-size:12px}
.tindispo td.ferme{background:#F2F0EB;color:#A8A296}
.tindispo td.bl2 button,.tindispo td.ts button{margin:1px}
.tindispo input{width:auto;transform:scale(1.15)}
.case.forcee{border-color:#C0392B;background:#FDF3F1}
.case.forcee .d{color:#A5281B}
.case .bang{display:inline-block;background:#C0392B;color:#fff;border-radius:50%;width:14px;height:14px;line-height:14px;font-size:10px;text-align:center}
.case.depassement{border-style:dashed;border-color:#D9B48A;background:#FDF8F1}
.case .dp{display:block;font-size:9px;color:#9A6B33;margin-top:2px}
.tag.o,.opt .s.o{color:#9A6B33}
table.tsaisie{border-collapse:collapse;width:100%;font-size:14px}
table.tsaisie th,table.tsaisie td{border:1px solid #DCD7CE;padding:5px 7px;text-align:center}
table.tsaisie th{background:#F1EFEA;font-weight:600;font-size:13px;white-space:nowrap;position:sticky;top:0;z-index:20;box-shadow:0 1px 0 #DCD7CE}
table.tsaisie th.nomcol,table.tsaisie td.nomcol{position:sticky;left:0;text-align:left;box-shadow:1px 0 0 #DCD7CE}
table.tsaisie td.nomcol{background:#fff;z-index:15}
table.tsaisie th.nomcol{background:#F1EFEA;z-index:25}
table.tsaisie input,table.tsaisie select{margin:0;padding:4px 6px;font-size:14px}
table.tsaisie input[disabled]{background:#F3F1ED;color:#6B675F}
.rangee{display:flex;gap:16px;flex-wrap:wrap}
.rangee>.champ{flex:1 1 220px}
.btn.mini{padding:4px 9px;font-size:13px}
.gris{color:#8A857C}
textarea{width:100%;font:inherit;padding:8px;border:1px solid #CFC9BF;border-radius:8px}
.coche{display:block;font-weight:400;margin:6px 0;font-size:15px}
.coche input{width:auto;margin-right:9px}
.avert{background:var(--rouge-clair);border:1px solid #F0C9C5;color:#7A241D;padding:11px 13px;border-radius:9px;font-size:14px;margin:12px 0}
.info{background:var(--vert-clair);border:1px solid #C6DED4;color:#0F4A3D;padding:11px 13px;border-radius:9px;font-size:14px;margin:12px 0}
.prudence{background:var(--ambre-clair);border:1px solid #E6D3A8;color:#6B4B08;padding:11px 13px;border-radius:9px;font-size:14px;margin:12px 0}
.hero{display:flex;justify-content:space-between;align-items:flex-end;gap:20px;flex-wrap:wrap;margin:8px 0 22px}
.hero h1{font-family:Georgia,"Times New Roman",serif;font-size:29px;font-weight:700;margin:0}
.hero .an{color:var(--ink-soft);font-size:15px;margin-top:4px}
.chiffres{display:flex;gap:28px}
.chiffres div{display:flex;flex-direction:column;align-items:flex-end}
.chiffres b{font-size:23px;line-height:1.15}
.chiffres span{font-size:13px;color:var(--ink-soft)}
.tableau{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}

   (7h-10h et 16h-18h), une heure par séance, jamais deux jours d'affilée.

  });

})();

    if(col.total && s!==col.total)

                             &&g.serie===col.serie&&!g.opt).reduce((x,g)=>x+g.vol,0);

/* Indisponibilités : une liste de créneaux bloqués par jour.
   Les anciennes fiches ne portaient que des jours entiers : on les convertit. */
function indispoDe(e){
  if(!e) return {};
  if(e.indispoCr && typeof e.indispoCr==="object") return e.indispoCr;
  const o={};
  (e.indispo||[]).forEach(function(j){ o[j]=CRENEAUX.map(x=>x.c); });

  if(crs.some(function(x){ const o=creneauObj(x); return o&&o.tardif; }) && !tardifAutorise(c))
    m.push("17h-18h hors du second cycle");

function prochaineSeance(c,g){
  const p=heuresPlacees(c.id,g.disc);
  let cum=0;
  for(let i=0;i<g.dec.length;i++){
    if(p<cum+g.dec[i]) return Math.min(g.dec[i],g.vol-p);
    cum+=g.dec[i];
  }
  return 0;
}
/* Une séance respecte-t-elle la plage horaire imposée à la discipline ? */
function dansPlage(g,crs){
  if(!g||!g.plage) return true;

/* Deux séances de la même discipline doivent-elles être séparées ? */
function ecartRespecte(g,cid,jour,ajout){
  if(!g||!g.espacement) return true;
  const i=NOMS_JOURS.indexOf(jour);
  const autres=S.seances.filter(s=>s.classeId===cid&&s.disc===g.disc).map(s=>s.jour)
    .concat((ajout||[]).filter(s=>s.classeId===cid&&s.disc===g.disc).map(s=>s.jour));
  return autres.every(function(j){
    const k=NOMS_JOURS.indexOf(j);
    return k<0 || Math.abs(k-i)>=g.espacement;
  });
}
function suite(jour,code,taille,cl,force){
  const i=CRENEAUX.findIndex(x=>x.c===code);
  if(i<0) return null;
  const p=CRENEAUX[i].p, out=[];
  for(let k=0;k<taille;k++){
    const cr=CRENEAUX[i+k];
    if(!cr||cr.p!==p) return null;
    if(!creneauOuvert(jour,cr.c,cl,force)) return null;
    out.push(cr.c);
  }
  return out;
}
function avancement(){

  S.classes.forEach(c=>grilleDe(c).forEach(function(g){
    att++; const sv=serviceDe(c.id,g.disc); if(sv&&sv.ensId) ser++;
  }));
  a.services=att===0?"":(ser===att?"ok":(ser>0?"encours":""));

/* Sur un petit écran, chaque ligne d'un tableau de saisie marqué « enliste »
   devient une carte : le nom en titre, chaque case avec son intitulé. Rien ne
   change sur ordinateur, ni dans les données, ni dans la saisie au clavier. */
function etiqueterTableaux(){
  document.querySelectorAll("table.enliste").forEach(function(t){
    if(t.parentNode&&t.parentNode.classList&&t.parentNode.classList.contains("defile")) t.parentNode.classList.add("defile-liste");
    const rows=t.rows; if(!rows.length) return;
    const hd=rows[0]; if(!hd.querySelector("th")) return;
    const lb=[...hd.cells].map(c=>({t:c.textContent.trim(),nom:c.classList.contains("nomcol")}));
    for(let r=1;r<rows.length;r++){ let k=0;
      [...rows[r].cells].forEach(function(c){ const h=lb[k]||{t:"",nom:false};
        c.setAttribute("data-lb",h.t); if(h.nom) c.classList.add("nomcol"); if(/^N°$/.test(h.t)) c.classList.add("lnum");
        k+=c.colSpan||1; }); }
  });
}

function lireImage(input,maxW,cb){
  const f=input.files[0];
  if(!f){ alert("Choisissez une image."); return; }
  const r=new FileReader();
  r.onload=function(){
    const img=new Image();
    img.onload=function(){
      const sc=Math.min(1,maxW/img.width);
      const cv=document.createElement("canvas");
      cv.width=Math.max(1,Math.round(img.width*sc));
      cv.height=Math.max(1,Math.round(img.height*sc));
      cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
      cb(cv.toDataURL("image/png"));
    };
    img.onerror=function(){ alert("Ce fichier n'est pas une image lisible."); };
    img.src=r.result;
  };
  r.readAsDataURL(f);
}

/* --- encadré « À faire » : ce qui bloque, un clic mène au bon écran ------ */
function pointsAFaire(a,an){
  const p=[], E=S.etab, nEl=S.eleves.length;
  if(!E.province) p.push({r:1,t:"Région et province à choisir",s:"Elles s'impriment en tête de tous les documents · Mon établissement",v:"etab"});
  if(!E.nom) p.push({r:1,t:"Nom de l'établissement à renseigner",s:"Mon établissement",v:"etab"});
  else if(a.etab!=="ok") p.push({t:"Fiche de l'établissement incomplète",s:"Année scolaire ou commune · Mon établissement",v:"etab"});
  if(!S.classes.length) p.push({r:1,t:"Aucune classe enregistrée",s:"Mon établissement",v:"classes"});
  if(S.classes.length&&!enseignants().length) p.push({r:1,t:"Aucun enseignant enregistré",s:"Mon personnel · Mon établissement",v:"ens"});
  if(a.servAtt&&a.servOk<a.servAtt)
    p.push({t:(a.servAtt-a.servOk)+" discipline(s) sans enseignant",s:"Répartition des services · Emplois du temps",v:"services"});
  if(a.servOk&&a.edtDu>a.edtPl)
    p.push({t:(a.edtDu-a.edtPl)+" h de cours non placées",s:"Emplois du temps",v:"edt"});
  const nc=S.classes.filter(c=>!coefsPrets(c));
  if(nEl&&nc.length) p.push({r:1,
    t:nc.length===1?"Coefficients de la "+nc[0].code+" à confirmer":nc.length+" classes aux coefficients à confirmer",
    s:"Bloque les moyennes et les rangs · Notes et bulletins",v:"matieres"});
  if(an.saisies&&an.saisies<an.attendues)
    p.push({t:(an.attendues-an.saisies)+" note(s) manquante(s)",s:libTrim(trimActif)+" · Notes et bulletins",v:"notes"});
  if(nEl){
    const sp=S.eleves.filter(e=>!e.photo).length, sm=S.eleves.filter(e=>!e.matricule).length;
    if(sp) p.push({t:sp+" élève(s) sans photo",s:"Leurs cartes sortiront sans photo · Cartes scolaires",v:"cartes"});
    if(sm) p.push({t:sm+" élève(s) sans matricule",s:"Cartes scolaires",v:"cartes"});
    if(!codeEtab()||!E.devise||!cachet)
      p.push({t:"Réglages de la carte incomplets",s:"Code, devise ou cachet · Mon établissement",v:"etab"});
  }
  const abs10=S.eleves.filter(e=>!e.depart&&(nbr(vieDe(e.id,trimActif).absN)||0)>=10);
  if(abs10.length) p.push({t:abs10.length+" élève(s) à 10 h ou plus d'absences non justifiées",s:libTrim(trimActif)+" · prévenir les parents · Vie scolaire et courrier",v:"lettres"});
  if(false) p.push({t:"Sigle de référence des courriers à renseigner",s:"Il suit le numéro sur chaque courrier · Mon établissement",v:"etab"});
  if(sale) p.push({t:"Modifications non sauvegardées",s:"Enregistrez un fichier de sauvegarde · Sauvegarde",v:"sauvegarde"});
  else if(joursDepuisSauvegarde()===null) p.push({t:"Aucune sauvegarde enregistrée",s:"Sauvegarde",v:"sauvegarde"});
  else if(joursDepuisSauvegarde()>7) p.push({t:"Sauvegarde à refaire",s:libSauvegarde()+" · Sauvegarde",v:"sauvegarde"});
  p.sort((x,y)=>(y.r||0)-(x.r||0));
  return p;
}
function aFaireHTML(a,an){
  const p=pointsAFaire(a,an), max=6;
  let h='<aside class="afaire"><h2>À faire'+(p.length?'<span class="puce a">'+p.length+' point'+(p.length>1?'s':'')+'</span>':'')+'</h2>';
  if(!p.length) return h+'<div class="rien">Rien en attente : tout est à jour.</div></aside>';

     +'<span class="tx"><b>'+esc(x.t)+'</b><span>'+esc(x.s)+'</span></span><span class="fl">›</span></button>';
  });
  if(p.length>max) h+='<div class="plus">… et '+(p.length-max)+' autre(s) point(s).</div>';

   +'<input type="file" id="fphotos" accept=".json,application/json"></div>',
   [{texte:"Importer les photos",action:"importerPhotos()"},{texte:"Annuler",action:"fermer()",style:"sec"}]);
}
function cleNom(e){
  return String(e.nom||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")
    .replace(/\s+/g," ").trim()+"|"+String(e.naiss||"").trim();
}
function importerPhotos(){ lireSauvegarde("fphotos",poserPhotos); }
function poserPhotos(c){
  const d=c&&c.donnees;
  if(!d||!Array.isArray(d.eleves)){ alert("Ce fichier n'est pas une sauvegarde valide de cette application."); return; }
  const parId={}, parMat={}, parNom={}, doublon={};
  S.eleves.forEach(function(e){
    parId[e.id]=e;
    if(e.matricule) parMat[e.matricule]=e;
    const k=cleNom(e);
    if(e.nom&&e.naiss){ if(parNom[k]) doublon[k]=1; parNom[k]=e; }
  });
  let nouv=0, rempl=0, introuv=0;
  d.eleves.forEach(function(x){
    if(!x||!x.photo) return;
    let e=parId[x.id]||(x.matricule&&parMat[x.matricule])||null;
    if(!e&&x.nom&&x.naiss){ const k=cleNom(x); if(parNom[k]&&!doublon[k]) e=parNom[k]; }
    if(!e){ introuv++; return; }
    if(e.photo===x.photo) return;
    if(e.photo) rempl++; else nouv++;
    e.photo=x.photo;
  });
  modifie(); fermer(); rendre();
  alert(nouv+" photo(s) ajoutée(s), "+rempl+" photo(s) remplacée(s)."
    +(introuv?"\n"+introuv+" photo(s) d'élèves introuvables sur cet ordinateur n'ont pas été reprises.":""));
}

function sauverEtab(){
  ["region","province","artRegion","artProvince","commune","type","village","nom","statut","annee","chef","contact","lieuSign",
   "titreChef","devise","codeEtab","qualifChef","sigleRef"].forEach(function(k){
    const el=document.getElementById("f_"+k); if(el) S.etab[k]=el.value.trim();
  });
  S.etab.codeEtab=String(S.etab.codeEtab||"").toUpperCase().replace(/[^A-Z0-9]/g,"");
  /* mémoire des villages déjà saisis, proposés la fois suivante */
  S.etab.villages=Array.isArray(S.etab.villages)?S.etab.villages:[];
  if(S.etab.village&&S.etab.villages.indexOf(S.etab.village)<0){ S.etab.villages.push(S.etab.village); S.etab.villages.sort((a,b)=>a.localeCompare(b,"fr")); }
  normaliserGeo(S.etab);
  const gv=id=>{ const x=document.getElementById(id); return x?x.value.trim():""; };
  const ce=document.getElementById("f_enteteEdt"); if(ce) S.etab.enteteEdt=ce.checked;
  const vs=document.getElementById("f_vieScolaire"); if(vs) S.etab.vieScolaire=vs.value.trim();
  if(document.getElementById("f_poNom")) S.etab.po={nom:gv("f_poNom"),fonction:gv("f_poFonction"),qualif:gv("f_poQualif")};
  if(S.etab.chef!==S.etab.chefSigne){
    signature=""; sigOrig=""; S.etab.chefSigne="";
    piecesAEcrire=true;
  }
  modifie(); go("esp_etab");
}

        +' · '+(c.effectif||0)+' élèves dont '+(c.filles||0)+' filles · '+v+' h par semaine'
        +(v>capaciteClasse(c)?' <span class="tag r">dépasse la capacité</span>':'')
        +(classeModifiee(c)?' <span class="tag a">volumes ajustés</span>':'')
        +(estDemo(c)?' <span class="tag a">grille de démonstration</span>':'')

let brouillon=null;
function ficheClasse(id){
  /* le professeur principal se désigne ici, pour toute l'année */
  const c=id?JSON.parse(JSON.stringify(classe(id)))
            :{code:"",ordre:ORDRES[0],niveau:"",serie:"",effectif:"",filles:"",salleId:"",options:[]};
  if(!c.niveau) c.niveau=niveauxDe(c.ordre)[0];
  if(!c.serie) c.serie=seriesDe(c.ordre,c.niveau)[0];
  brouillon={id:id||"",data:c};
  dessinerClasse();
}
function dessinerClasse(){
  const c=brouillon.data, id=brouillon.id;
  const nvx=niveauxDe(c.ordre);
  if(!nvx.includes(c.niveau)) c.niveau=nvx[0];
  const srs=seriesDe(c.ordre,c.niveau);
  if(!srs.includes(c.serie)) c.serie=srs[0];
  const opt=(l,v)=>l.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join("");
  const options=optionsDe(c);
  const vol=grilleDe(c).reduce((a,g)=>a+g.vol,0);
  let corps='<div class="champ"><label>Code de la classe</label><input id="c_code" value="'+esc(c.code)+'" placeholder="6e A"></div>'
   +'<div class="champ"><label>Ordre d\'enseignement</label><select id="c_ordre" onchange="changeClasse()">'+opt(ORDRES,c.ordre)+'</select></div>'
   +(id?'<div class="champ"><label>Professeur principal</label>'
     +(candidatsPP(classe(id)).length
       ?'<select onchange="choisirPP(\''+id+'\',this.value)">'+optionsPP(classe(id))+'</select>'
       :'<div class="prudence">La répartition des services n\'est pas encore faite pour cette classe : aucun enseignant ne peut être désigné. Passez par Emplois du temps, Répartition des services.</div>')
     +'<p class="aide">Désigné pour toute l\'année. Seuls les enseignants de cette classe sont proposés.</p></div>':'')
   +'<div class="duo"><div class="champ"><label>Niveau</label><select id="c_niveau" onchange="changeClasse()">'+opt(nvx,c.niveau)+'</select></div>'
   +'<div class="champ"><label>Série ou spécialité</label><select id="c_serie" onchange="changeClasse()">'+opt(srs,c.serie)+'</select></div></div>';
  if(options.length){
    corps+='<div class="champ"><label>Disciplines optionnelles enseignées dans cette classe</label>'
      +options.map(o=>'<label class="coche"><input type="checkbox" id="c_opt_'+esc(o.disc)+'"'
        +((c.options||[]).includes(o.disc)?' checked':'')+' onchange="changeClasse()"> '+esc(o.disc)+' ('+o.vol+' h)</label>'
        +(o.disc==="Allemand"&&allemandAuChoix(c)&&(c.options||[]).includes("Allemand")
          ?'<div class="champ" style="margin:4px 0 0 26px"><label>Volume d\'allemand</label><select id="c_allH" onchange="changeClasse()">'
           +[3,6].map(h=>'<option value="'+h+'"'+(Number(c.allemandH||3)===h?' selected':'')+'>'+h+' h par semaine</option>').join("")+'</select></div>':'')).join("")
      +'<p class="aide">À cocher seulement si la discipline est effectivement enseignée. Elle occupera alors un créneau de la classe entière.</p></div>';
  }
  const capc=capaciteClasse(brouillon.data);
  corps+='<div class="'+(vol>capc?"avert":"info")+'">Volume hebdomadaire de cette classe : '+vol+' h, pour '+capc+' h ouvertes.'
    +(vol>capc?' L\'emploi du temps ne pourra pas être bouclé.':'')
    +(vol===capc?' Aucune marge : chaque créneau de la semaine sera occupé.':'')+'</div>'
   +'<div class="duo"><div class="champ"><label>Effectif total</label><input id="c_eff" type="number" inputmode="numeric" value="'+esc(c.effectif)+'"></div>'
   +'<div class="champ"><label>dont filles</label><input id="c_fil" type="number" inputmode="numeric" value="'+esc(c.filles)+'"></div></div>'
   +'<div class="champ"><label>Salle attitrée</label><select id="c_salle"><option value="">Aucune</option>'
   +S.salles.map(s=>'<option value="'+s.id+'"'+(s.id===c.salleId?' selected':'')+'>'+esc(s.code)+'</option>').join("")+'</select></div>';
  const b=[{texte:"Enregistrer",action:"sauverClasse()"}];
  if(id) b.push({texte:"Supprimer",action:"supprClasse('"+id+"')",style:"danger"});
  b.push({texte:"Annuler",action:"fermer()",style:"sec"});
  ouvrir(id?"Modifier la classe":"Nouvelle classe",corps,b);
}
function lireClasse(){
  const c=brouillon.data;
  c.code=document.getElementById("c_code").value;
  c.ordre=document.getElementById("c_ordre").value;
  c.niveau=document.getElementById("c_niveau").value;
  c.serie=document.getElementById("c_serie").value;
  const eff=document.getElementById("c_eff"), fil=document.getElementById("c_fil"), sal=document.getElementById("c_salle");
  if(eff) c.effectif=eff.value;
  if(fil) c.filles=fil.value;
  if(sal) c.salleId=sal.value;
  const pp=document.getElementById("c_pp"); if(pp&&pp.value!==(c.pp||"")) { choisirPP(c.id,pp.value); return; }
  const alh=document.getElementById("c_allH"); if(alh) c.allemandH=Number(alh.value)||3;
  c.options=[];
  GRILLE.filter(g=>g.opt).forEach(function(g){
    const el=document.getElementById("c_opt_"+g.disc);
    if(el&&el.checked&&!c.options.includes(g.disc)) c.options.push(g.disc);
  });
}
function changeClasse(){ lireClasse(); dessinerClasse(); }
function sauverClasse(){
  lireClasse();
  const c=brouillon.data, id=brouillon.id;
  c.code=String(c.code).trim();
  c.effectif=+c.effectif||0; c.filles=+c.filles||0;
  if(!c.code){ alert("Le code de la classe est obligatoire."); return; }
  if(c.filles>c.effectif){ alert("Le nombre de filles dépasse l'effectif total."); return; }
  if(id){
    Object.assign(classe(id),c);
    const n=nettoyerClasse(classe(id));

/* Grille cochable jours x créneaux, éditée dans une variable de travail. */
let indispoEdit={};
function indispoActif(j,cr){ return (indispoEdit[j]||[]).indexOf(cr)>=0; }
function grilleIndispoHTML(){
  let h='<div class="defile court"><table class="tindispo"><tr><th class="cn">Heure</th>'
   +JOURS.map(j=>'<th>'+j.n.slice(0,3)+'</th>').join("")
   +'<th class="ts">Toute la semaine</th></tr>';
  CRENEAUX.forEach(function(cr){
    h+='<tr><th class="cn">'+cr.d+'–'+cr.f+'</th>';
    JOURS.forEach(function(j){
      const ouvert=creneauOuvert(j.n,cr.c,null);
      if(!ouvert){ h+='<td class="ferme" title="'+esc(j.motif)+'">—</td>'; return; }
      h+='<td><input type="checkbox"'+(indispoActif(j.n,cr.c)?' checked':'')
        +' onchange="basculeIndispo(\''+j.n+'\',\''+cr.c+'\',this.checked)"></td>';
    });
    h+='<td class="ts"><button type="button" class="btn mini sec" onclick="toutSemaine(\''+cr.c+'\')">Toute la semaine</button></td></tr>';
  });
  h+='<tr><th class="cn">Bloquer</th>';
  JOURS.forEach(function(j){
    h+='<td class="bl2"><button type="button" class="btn mini sec" onclick="bloqueJour(\''+j.n+'\',\'matin\')">Matin</button>'
      +(j.soir?'<button type="button" class="btn mini sec" onclick="bloqueJour(\''+j.n+'\',\'soir\')">Soir</button>':'')
      +'<button type="button" class="btn mini sec" onclick="bloqueJour(\''+j.n+'\',\'tout\')">Journée</button></td>';
  });
  h+='<td class="ts"><button type="button" class="btn mini sec" onclick="videIndispo()">Tout libérer</button></td></tr>';
  h+='</table></div>';
  const t=NOMS_JOURS.reduce((a,j)=>a+(indispoEdit[j]||[]).length,0);
  h+='<p class="aide">'+(t?t+' heure(s) bloquée(s).':'Aucune indisponibilité : disponible à toute heure.')+'</p>';
  return h;
}
function majGrilleIndispo(){
  const z=document.getElementById("grilleIndispo");
  if(z) z.innerHTML=grilleIndispoHTML();
}
function basculeIndispo(j,cr,on){
  indispoEdit[j]=indispoEdit[j]||[];
  const i=indispoEdit[j].indexOf(cr);
  if(on && i<0) indispoEdit[j].push(cr);
  if(!on && i>=0) indispoEdit[j].splice(i,1);
  majGrilleIndispo();
}
function toutSemaine(cr){
  /* Si la ligne est déjà entièrement bloquée, le bouton la libère. */
  const ouv=JOURS.filter(j=>creneauOuvert(j.n,cr,null));
  const plein=ouv.every(j=>indispoActif(j.n,cr));
  ouv.forEach(function(j){ basculeSansRendu(j.n,cr,!plein); });
  majGrilleIndispo();
}
function bloqueJour(j,quoi){
  const crs=CRENEAUX.filter(function(cr){
    if(!creneauOuvert(j,cr.c,null)) return false;
    return quoi==="tout" || cr.p===quoi;
  }).map(x=>x.c);
  const plein=crs.length && crs.every(cr=>indispoActif(j,cr));
  crs.forEach(function(cr){ basculeSansRendu(j,cr,!plein); });
  majGrilleIndispo();
}
function basculeSansRendu(j,cr,on){
  indispoEdit[j]=indispoEdit[j]||[];
  const i=indispoEdit[j].indexOf(cr);
  if(on && i<0) indispoEdit[j].push(cr);
  if(!on && i>=0) indispoEdit[j].splice(i,1);
}
function videIndispo(){ NOMS_JOURS.forEach(function(j){ indispoEdit[j]=[]; }); majGrilleIndispo(); }

function sauverEns(id){
  const d=[1,2,3].map(n=>document.getElementById("e_d"+n).value).filter(Boolean);
  const fct=document.getElementById("e_fonction").value;
  const o={nom:document.getElementById("e_nom").value.trim(),
    fonction:fct, fonctionAutre:document.getElementById("e_fonctionAutre").value.trim(),
    enseigne:FONCTIONS_ENS_OPT.includes(fct)&&document.getElementById("e_enseigne").checked,
    tel:document.getElementById("e_tel").value.trim(),
    matricule:document.getElementById("e_mat").value.trim(),
    disciplines:[...new Set(d)],
    diplome:document.getElementById("e_dip").value.trim(),
    statut:document.getElementById("e_statut").value,
    quotite:+document.getElementById("e_quot").value||0,
    indispoCr:(function(){
      /* On ne garde que des créneaux réellement ouverts : inutile de stocker
         un mercredi soir, qui n'existe pas. */
      const o={};
      NOMS_JOURS.forEach(function(j){
        const l=(indispoEdit[j]||[]).filter(cr=>creneauOuvert(j,cr,null));
        if(l.length) o[j]=l;
      });
      return o;
    })(),
    indispo:NOMS_JOURS.filter(function(j){
      const ouv=CRENEAUX.filter(cr=>creneauOuvert(j,cr.c,null)).map(x=>x.c);
      return ouv.length && ouv.every(cr=>(indispoEdit[j]||[]).indexOf(cr)>=0);
    }),
    genre:document.getElementById("e_genre").value,
    emploi:document.getElementById("e_emploi").value.trim(), option:document.getElementById("e_option").value.trim(),
    datePS:document.getElementById("e_dps").value.trim(),
    ancMetier:document.getElementById("e_am").value,
    ancEtab:document.getElementById("e_ae").value,
    ancLocalite:document.getElementById("e_al").value};
  if(!o.nom){ alert("Le nom est obligatoire."); return; }
  const enseigneraPas=!peutEnseigner(o);
  if(enseigneraPas){ o.disciplines=[]; o.quotite=0; o.indispoCr={}; o.indispo=[]; }
  else if(!o.disciplines.length){ alert("Indiquez au moins une discipline."); return; }
  if(id&&enseigneraPas){
    const sv=S.services.filter(x=>x.ensId===id);
    if(sv.length){
      const l=sv.map(x=>{ const c=classe(x.classeId); return (c?c.code:"?")+" "+x.disc; }).join(", ");
      if(!confirm(o.nom+" ne pourra plus recevoir de cours avec la fonction « "+fonctionDe(o)+" ».\n\nSes services seront libérés et seront à réattribuer : "+l+".\n\nContinuer ?")) return;
      S.services.forEach(x=>{ if(x.ensId===id) x.ensId=""; });
      S.seances=S.seances.filter(x=>x.ensId!==id);
    }
  }
  if(id) Object.assign(ens(id),o); else { o.id=uid(); S.ens.push(o); }
  modifie(); fermer(); rendre();
}
function supprEns(id){
  const e=ens(id), n=S.seances.filter(s=>s.ensId===id).length;
  if(!confirm("Supprimer "+e.nom+" ?"+(n?" "+n+" séance(s) seront effacées.":""))) return;
  S.ens=S.ens.filter(x=>x.id!==id);
  S.services=S.services.filter(x=>x.ensId!==id);
  S.seances=S.seances.filter(x=>x.ensId!==id);
  modifie(); fermer(); rendre();
}

function choisirEns(cid,disc){
  const qual=qualDisc(classe(cid),disc);
  const c0=classe(cid), gd=grilleDe(c0).find(x=>x.disc===disc), vol=gd?gd.vol:0;
  const sv=serviceDe(cid,disc);
  const cands=enseignants().slice().sort(function(a,b){
    const qa=ensQualifie(a,qual)?0:1, qb=ensQualifie(b,qual)?0:1;
    return qa!==qb?qa-qb:a.nom.localeCompare(b.nom);
  });
  let corps='<p class="aide">'+esc(disc)+' · '+vol+' h par semaine, en séances de '+(gd?gd.dec.join("-"):"—")+'</p>'
   +'<button class="opt" onclick="poserService(\''+cid+'\',\''+disc.replace(/'/g,"\\'")+'\',\'\')">'
   +'<span class="t">Aucun enseignant</span><span class="s">Laisser la discipline non pourvue</span></button>';
  cands.forEach(function(e){
    const q=ensQualifie(e,qual), lui=sv&&sv.ensId===e.id;
    const futur=heuresEngagees(e.id)-(lui?vol:0)+vol;
    const sur=e.quotite&&futur>e.quotite;
    let det=q?esc((e.disciplines||[]).join(", ")):"Cette discipline ne figure pas dans sa fiche";
    if(e.quotite){ det+=' · passerait à '+futur+' h sur '+e.quotite+' h dues'; if(sur) det+=' — surcharge'; }
    corps+='<button class="opt" onclick="poserService(\''+cid+'\',\''+disc.replace(/'/g,"\\'")+'\',\''+e.id+'\')">'
      +'<span class="t">'+esc(e.nom)+(lui?" \u2713":"")+'</span><span class="s'+((q&&!sur)?"":" r")+'">'+det+'</span></button>';
  });
  ouvrir("Qui enseigne cette discipline ?",corps,[{texte:"Annuler",action:"fermer()",style:"sec"}]);
}
function poserService(cid,disc,eid){
  let sv=serviceDe(cid,disc);
  if(!sv){ sv={id:uid(),classeId:cid,disc:disc,ensId:eid}; S.services.push(sv); }
  else sv.ensId=eid;

VUES.edt=function(){
  if(!S.classes.length) return ecranPrealable("Ajoutez d'abord vos classes.","classes","Aller aux classes");
  if(!classeActive||!classe(classeActive)) classeActive=S.classes[0].id;
  const c=classe(classeActive), g=grilleDe(c);
  let h='<h1>Emploi du temps</h1><div class="selclasse"><select onchange="classeActive=this.value;rendre()">'
   +S.classes.map(x=>'<option value="'+x.id+'"'+(x.id===classeActive?' selected':'')+'>'+esc(x.code)+'</option>').join("")
   +'</select><button class="btn sec" onclick="remplirAuto()">Remplir automatiquement</button>'
   +'<button class="btn sec" onclick="viderClasse()">Tout effacer</button></div>';
  if(!g.length) return h+'<div class="avert">Aucune grille horaire pour '+esc(c.niveau)+' '+esc(c.serie)+'.</div>';
  const vol=volumeClasse(c);
  if(vol>capaciteClasse(c)) h+='<div class="avert">Cette classe demande '+vol+' h pour '+capaciteClasse(c)
    +' h ouvertes. L\'emploi du temps ne pourra pas être bouclé. À signaler à la DPESFPT.</div>';
  const sans=g.filter(function(gr){ const sv=serviceDe(c.id,gr.disc); return !sv||!sv.ensId; });
  if(sans.length) h+='<div class="avert">'+sans.length+' discipline(s) sans enseignant désigné. '
    +'<button class="btn sec" style="margin-top:8px" onclick="go(\'services\')">Compléter la répartition</button></div>';
  if(etroit()){
    h+='<div class="jours-onglets">'
      +JOURS.map((j,i)=>'<button class="'+(i===jourActif?"actif":"")+'" onclick="jourActif='+i+';rendre()">'+j.n.slice(0,3)+'</button>').join("")
      +'</div>'+grilleHTML(c,[JOURS[jourActif]]);
  } else h+=grilleHTML(c,JOURS);
  const forcees=S.seances.filter(x=>x.classeId===c.id&&x.force);
  if(forcees.length){
    const vus={};
    forcees.forEach(function(x){ vus[x.jour+" "+libCreneau(x.creneau)+" — "+abrege(x.disc)+" (hors "+x.force+")"]=1; });
    h+='<div class="avert"><strong>'+forcees.length+' heure(s) posées en dépassement :</strong><br>'

  h+='<div class="compteurs"><h2>Volumes horaires</h2>';
  g.forEach(function(gr){

    h+='<div class="cpt '+(p===gr.vol?"ok":"manque")+'"><span class="n">'+esc(gr.disc)+'</span>'
      +'<span class="jauge"><i style="width:'+pct+'%"></i></span><span class="v">'+p+' / '+gr.vol+' h</span></div>';
  });

function grilleHTML(c,jours){
  let h='<table class="edt"><tr><th class="h">Horaire</th>'+jours.map(j=>'<th>'+j.n+'</th>').join("")+'</tr>';
  CRENEAUX.forEach(function(cr){
    h+='<tr><th class="h">'+cr.d+'<br>'+cr.f+'</th>';
    jours.forEach(function(j){
      const ouvert=creneauOuvert(j.n,cr.c,c);
      /* Case fermée par la seule règle du 17h-18h : cliquable en dernier recours.
         Mercredi soir et samedi soir restent définitivement fermés. */
      const forcable=!ouvert && creneauOuvert(j.n,cr.c,c,true);
      if(!ouvert && !forcable){ h+='<td class="bloque"><span class="bloque-txt">'
        +esc(motifFerme(j.n,cr.c,c))+'</span></td>'; return; }
      const s=S.seances.find(x=>x.classeId===c.id&&x.jour===j.n&&x.creneau===cr.c);
      if(s) h+='<td><button class="case plein'+(s.force?' forcee':'')
        +'" title="'+esc(s.force||"")+'" onclick="caseAction(\''+j.n+'\',\''+cr.c+'\')">'
        +'<span class="d">'+esc(abrege(s.disc))+(s.force?' <span class="bang">!</span>':'')+'</span>'
        +'<span class="e">'+esc(nomEns(s.ensId))+'</span>'
        +'<span class="s">'+esc(codeSalle(s.salleId))+'</span></button></td>';
      else h+='<td><button class="case'+(forcable?' depassement':'')+'" onclick="caseAction(\''+j.n+'\',\''+cr.c+'\')">'
        +(forcable?'<span class="plus">+</span><span class="dp">dépassement</span>':'<span class="plus">+</span>')
        +'</button></td>';
    });
    h+='</tr>';
  });
  return h+'</table>';
}
function abrege(d){

    "Éducation civique":"Éduc. civique","Éducation Physique et Sportive":"EPS",
    "Travaux pratiques d'atelier":"TP atelier","Technologie de spécialité":"Technologie",
    "Économie générale":"Éco. générale"};
  return a[d]||d;

function caseAction(jour,creneau){
  const c=classe(classeActive);
  const s=S.seances.find(x=>x.classeId===c.id&&x.jour===jour&&x.creneau===creneau);
  if(s){
    const corps='<p class="aide">'+esc(jour)+' · '+esc(libCreneau(creneau))+'</p>'
      +(s.force?'<div class="avert"><strong>Heure posée en dépassement.</strong><br>Hors '+esc(s.force)
        +'.<br>Elle est signalée en rouge sur les documents imprimés.</div>':'')
      +'<div class="info"><strong>'+esc(s.disc)+'</strong><br>'+esc(nomEns(s.ensId))
      +'<br>Salle : '+esc(codeSalle(s.salleId))+'</div>'
      +'<div class="champ"><label>Changer de salle</label><select id="chg_salle"><option value="">Aucune</option>'
      +S.salles.map(function(x){
         const prise=salleOccupee(x.id,jour,creneau)&&x.id!==s.salleId;
         return '<option value="'+x.id+'"'+(x.id===s.salleId?' selected':'')+(prise?' disabled':'')+'>'+esc(x.code)+(prise?' (occupée)':'')+'</option>';
       }).join("")+'</select></div>';
    ouvrir("Séance placée",corps,[
      {texte:"Enregistrer la salle",action:"changerSalle('"+s.id+"')"},
      {texte:"Retirer la séance",action:"retirer('"+s.id+"')",style:"danger"},
      {texte:"Fermer",action:"fermer()",style:"sec"}]);
    return;
  }
  const g=grilleDe(c);
  let corps='<p class="aide">'+esc(jour)+' · '+esc(libCreneau(creneau))+'</p>', n=0;
  g.forEach(function(gr){
    const reste=gr.vol-heuresPlacees(c.id,gr.disc);
    if(reste<=0) return;
    const sv=serviceDe(c.id,gr.disc);
    if(!sv||!sv.ensId) return;
    const e=ens(sv.ensId);
    const voulu=prochaineSeance(c,gr);
    let taille=voulu, crs=suite(jour,creneau,taille,c), repli=false;
    if(!crs&&taille>1){ crs=suite(jour,creneau,1,c); taille=1; repli=!!crs; }
    let bloc=null;
    if(!crs) bloc="La séance ne tient pas dans cette demi-journée";
    else if(!dansPlage(gr,crs)) bloc="Cette discipline se place seulement à "
      +gr.plage.map(x=>libCreneau(x)).join(", ");
    else if(!ecartRespecte(gr,c.id,jour)) bloc="Une séance a déjà lieu un jour trop proche";
    else if(crs.some(x=>classeOccupee(c.id,jour,x))) bloc="La classe a déjà cours sur ce créneau";
    else if(crs.some(x=>ensOccupe(e.id,jour,x))) bloc=e.nom+" a déjà cours sur ce créneau";
    /* L'indisponibilité n'interdit pas : elle avertit, et le placement est marqué. */
    const dep=bloc?"":motifDepassement(e,c,jour,crs||[]);
    n++;
    corps+='<button class="opt"'+(bloc?' disabled':' onclick="poserSeance(\''+jour+'\',\''+creneau+'\',\''+gr.disc.replace(/'/g,"\\'")+'\','+taille+')"')+'>'
      +'<span class="t">'+esc(gr.disc)+' — '+taille+' h'+(repli?' (au lieu de '+voulu+' h)':'')
      +(dep?' <span class="tag r">dépassement</span>':'')+'</span>'
      +'<span class="s'+(bloc?" r":(dep?" o":""))+'">'
      +(bloc?esc(bloc):(dep?'Hors '+esc(dep)+' — sera signalé en rouge':esc(e.nom)+' · reste '+reste+' h à placer'))
      +'</span></button>';
  });
  if(!n) corps+='<div class="info">Toutes les disciplines pourvues ont atteint leur volume horaire.</div>';
  ouvrir("Placer une séance",corps,[{texte:"Annuler",action:"fermer()",style:"sec"}]);
}
function poserSeance(jour,creneau,disc,taille){
  const c=classe(classeActive), sv=serviceDe(c.id,disc);
  const crs=suite(jour,creneau,taille,c);
  if(!crs){ alert("Ce placement n'est plus possible."); fermer(); rendre(); return; }
  const gr=grilleDe(c).find(x=>x.disc===disc);
  if(!dansPlage(gr,crs)){
    alert("Cette discipline ne peut se placer qu'aux heures suivantes : "
      +gr.plage.map(x=>libCreneau(x)).join(", ")+".");
    fermer(); rendre(); return;
  }
  if(!ecartRespecte(gr,c.id,jour)){
    alert("Une séance de cette discipline a déjà lieu un jour trop proche.");
    fermer(); rendre(); return;
  }
  const typ=typeSalleRequis(disc);
  const dep=motifDepassement(ens(sv.ensId),c,jour,crs);
  crs.forEach(function(cr){
    let sid="";
    const prise=id=>salleOccupee(id,jour,cr);
    if(c.salleId&&!typ&&!prise(c.salleId)) sid=c.salleId;
    else{
      const cand=S.salles.filter(x=>(!typ||x.type===typ)&&!prise(x.id));
      sid=cand.length?cand[0].id:"";
    }
    S.seances.push({id:uid(),classeId:c.id,jour:jour,creneau:cr,disc:disc,ensId:sv.ensId,salleId:sid,force:dep});
  });
  modifie(); fermer(); rendre();
}
function retirer(sid){ S.seances=S.seances.filter(x=>x.id!==sid); modifie(); fermer(); rendre(); }
function changerSalle(sid){
  S.seances.find(x=>x.id===sid).salleId=document.getElementById("chg_salle").value;
  modifie(); fermer(); rendre();

function viderClasse(){
  const c=classe(classeActive);

  S.seances=S.seances.filter(x=>x.classeId!==c.id);

}

/* ==================== REMPLISSAGE AUTOMATIQUE =========================== */

function remplirAuto(){
  const c=classe(classeActive), g=grilleDe(c);
  if(!g.length){ alert("Aucune grille horaire pour cette classe."); return; }
  let best=null;
  for(let t=0;t<16;t++){
    const r=tenter(c,g,t);
    /* À nombre d'échecs égal, on garde le tirage qui force le moins. */
    const mieux=!best || r.echecs.length<best.echecs.length
      || (r.echecs.length===best.echecs.length && (r.forces||[]).length<(best.forces||[]).length);
    if(mieux) best=r;
    if(!best.echecs.length && !(best.forces||[]).length) break;
  }
  if(!best.nouvelles.length){
    ouvrir("Remplissage automatique",
      '<div class="info">Rien à ajouter : les volumes sont déjà atteints, ou aucune discipline n\'a d\'enseignant désigné.</div>',
      [{texte:"Fermer",action:"fermer()",style:"sec"}]);
    return;
  }
  let corps='<div class="info">'+best.nouvelles.length+' heure(s) placées.</div>';
  if((best.forces||[]).length) corps+='<div class="avert"><strong>'+best.forces.length
    +' heure(s) posées en dépassement :</strong><br>'+best.forces.map(esc).join("<br>")
    +'<br><br>Elles apparaissent en rouge dans la grille et sur les documents imprimés. '
    +'Mieux vaut une heure posée et signalée qu\'une heure perdue : corrigez-les à la main si vous le pouvez.</div>';
  if(best.echecs.length) corps+='<div class="avert"><strong>Non placé :</strong><br>'+best.echecs.map(esc).join("<br>")
    +'<br><br>Placez ces heures à la main, ou revoyez les disponibilités des enseignants.</div>';
  corps+='<p class="aide">La proposition est valide mais pas forcément idéale sur le plan pédagogique. Vous pouvez la corriger case par case.</p>';
  S.seances=S.seances.concat(best.nouvelles);
  modifie();
  ouvrir("Remplissage automatique",corps,[{texte:"Fermer",action:"fermer();rendre()",style:"sec"}]);
}
function tenter(c,g,graine){
  const ajout=[], echecs=[], forces=[];
  const pris=(j,cr,test)=>ajout.some(a=>a.jour===j&&a.creneau===cr&&test(a));
  const unites=[];
  g.forEach(function(gr){
    const sv=serviceDe(c.id,gr.disc);
    if(!sv||!sv.ensId) return;
    const p=heuresPlacees(c.id,gr.disc);
    if(gr.vol-p<=0) return;
    let cum=0;
    gr.dec.forEach(function(t){
      if(cum+t<=p){ cum+=t; return; }
      const taille=Math.min(t,gr.vol-Math.max(p,cum));
      if(taille>0) unites.push({disc:gr.disc,ensId:sv.ensId,taille:taille,g:gr});
      cum+=t;
    });
  });
  /* Les disciplines les plus contraintes passent en premier : une séance qui
     n'a que cinq créneaux possibles doit choisir avant celles qui en ont trente. */
  unites.sort(function(a,b){
    const ca=(a.g&&(a.g.plage||a.g.espacement))?0:1;
    const cb=(b.g&&(b.g.plage||b.g.espacement))?0:1;
    if(ca!==cb) return ca-cb;
    return b.taille-a.taille||((a.disc+graine)>(b.disc+graine)?1:-1);
  });
  const file=unites.slice();
  let garde=0;
  while(file.length && ++garde<4000){
    const u=file.shift();
    const e=ens(u.ensId);
    /* Deux temps : on cherche d'abord en respectant tout. Si rien ne rentre,
       on autorise le dépassement plutôt que de laisser l'heure dans le vide.
       Mercredi soir et samedi soir restent exclus dans les deux cas. */
    const cherche=function(force){
      const pos=[];
      JOURS.forEach(function(j){
        if(!force && !ensDispo(e,j.n)) return;
        CRENEAUX.forEach(function(cr0,i){
          const crs=suite(j.n,cr0.c,u.taille,c,force);
          if(!crs) return;
          if(!dansPlage(u.g,crs)) return;
          if(!ecartRespecte(u.g,c.id,j.n,ajout)) return;
          if(!force && !ensLibreSuite(e,j.n,crs)) return;
          const libre=crs.every(cr=>!classeOccupee(c.id,j.n,cr)&&!ensOccupe(u.ensId,j.n,cr)
            &&!pris(j.n,cr,a=>a.classeId===c.id||a.ensId===u.ensId));
          if(!libre) return;
          let sc=i;
          /* le 17h-18h n'est utilisé qu'en dernier recours */
          if(crs.some(x=>{ const o=creneauObj(x); return o&&o.tardif; })) sc+=400;
          /* en forçage, on préfère toujours ce qui déborde le moins */
          if(force){
            if(!ensLibreSuite(e,j.n,crs)) sc+=2000;
            if(crs.some(x=>{ const o=creneauObj(x); return o&&o.tardif; })&&!tardifAutorise(c)) sc+=1200;
          }
          const deja=S.seances.some(s=>s.classeId===c.id&&s.jour===j.n&&s.disc===u.disc)
                   ||ajout.some(s=>s.jour===j.n&&s.disc===u.disc);
          if(deja) sc+=40;
          sc+=((graine*7+i*3)%5);
          pos.push({j:j.n,crs:crs,sc:sc});
        });
      });
      pos.sort((a,b)=>a.sc-b.sc);
      return pos;
    };
    let pos=cherche(false);
    if(!pos.length) pos=cherche(true);
    if(pos.length){
      const p=pos[0], typ=typeSalleRequis(u.disc);
      const dep=motifDepassement(e,c,p.j,p.crs);
      if(dep) forces.push(u.disc+" — "+p.j+" "+libCreneau(p.crs[0])+" ("+dep+")");
      p.crs.forEach(function(cr){
        let sid="";
        const prise=id=>salleOccupee(id,p.j,cr)||pris(p.j,cr,a=>a.salleId===id);
        if(c.salleId&&!typ&&!prise(c.salleId)) sid=c.salleId;
        else{
          const cand=S.salles.filter(x=>(!typ||x.type===typ)&&!prise(x.id));
          sid=cand.length?cand[0].id:"";
        }
        ajout.push({id:uid(),classeId:c.id,jour:p.j,creneau:cr,disc:u.disc,ensId:u.ensId,salleId:sid,force:dep});
      });
    } else if(u.taille>1){
      /* la séance ne rentre nulle part : on la coupe et on réessaie */
      const a=Math.floor(u.taille/2), b=u.taille-a;
      file.unshift({disc:u.disc,ensId:u.ensId,taille:b,g:u.g});
      file.unshift({disc:u.disc,ensId:u.ensId,taille:a,g:u.g});
    } else {
      echecs.push(u.disc+" — 1 h (aucun créneau libre pour "+e.nom+")");
    }
  }
  return {nouvelles:ajout,echecs:echecs,forces:forces};
}

let grilleSel="";

   +'<p class="sous">Volume hebdomadaire et découpage des séances, par niveau et par série. '

   +'<div class="selclasse"><select onchange="grilleSel=this.value;rendre()">'

      +'<div class="n">'+esc(g.disc)+'</div><div class="m">'+g.vol+' h · séances '+g.dec.join("-")

      +(g.src==="demo"?' <span class="tag a">démonstration</span>':'')

    h+='<div class="barre-actions"><button class="btn sec" onclick="retablirGrille()">'
      +'Rétablir toute la grille officielle</button></div>';
  return h;
};
function editerGrille(idx){

  const corps='<p class="aide">'+esc(g.niveau+" "+g.serie+" — "+g.disc)+'</p>'
   +'<div class="champ"><label>Volume hebdomadaire (heures)</label>'
   +'<input id="gr_vol" type="number" inputmode="numeric" min="1" max="20" value="'+vol+'"></div>'
   +'<div class="champ"><label>Découpage des séances</label>'
   +'<input id="gr_dec" value="'+esc(dec)+'" placeholder="2-2-1">'
   +'<p class="aide">La somme doit être égale au volume. En cas de blocage à la construction, '
   +'l\'application coupera d\'elle-même une séance trop longue.</p></div>'
   +'<div class="note">Valeur de la grille transmise par la DPESFPT : '+g.vol+' h, séances '+g.dec.join("-")+'.</div>';
  const b=[{texte:"Enregistrer",action:"sauverGrille("+idx+")"}];
  if(o) b.push({texte:"Rétablir l\'officiel",action:"annulerGrille("+idx+")",style:"danger"});
  b.push({texte:"Annuler",action:"fermer()",style:"sec"});
  ouvrir("Volume horaire",corps,b);
}
function sauverGrille(idx){
  const g=GRILLE[idx]; if(!g) return;
  const cle=cleG(g);
  const vol=+document.getElementById("gr_vol").value||0;
  const dec=String(document.getElementById("gr_dec").value).split(/[^0-9]+/).filter(Boolean).map(Number);
  if(vol<1||vol>20){ alert("Le volume doit être compris entre 1 et 20 heures."); return; }
  if(!dec.length){ alert("Indiquez un découpage, par exemple 2-2-1."); return; }
  const somme=dec.reduce((a,b)=>a+b,0);
  if(somme!==vol){ alert("Le découpage "+dec.join("-")+" totalise "+somme+" h alors que le volume est de "+vol+" h."); return; }
  if(!S.grilleLocale) S.grilleLocale={};
  if(vol===g.vol && dec.join("-")===g.dec.join("-")) delete S.grilleLocale[cle];
  else S.grilleLocale[cle]={vol:vol,dec:dec};
  modifie(); fermer(); rendre();
}
function annulerGrille(idx){
  const g=GRILLE[idx]; if(!g) return;
  if(S.grilleLocale) delete S.grilleLocale[cleG(g)];
  modifie(); fermer(); rendre();
}
function retablirGrille(){
  if(!confirm("Rétablir tous les volumes de la grille officielle ?")) return;
  S.grilleLocale={}; modifie(); rendre();
}

let classeNotes="", trimActif=1, matiereNotes="";

function nbr(v){ if(v===""||v===null||v===undefined) return null;
  const x=parseFloat(String(v).replace(",",".")); return isNaN(x)?null:x; }
function a2(x){ return Math.round(x*100)/100; }
function n2(x){ return (x===null||x===undefined||x==="")?"":a2(x).toFixed(2).replace(".",","); }
function pct(x){ return (Math.round(x*10)/10).toFixed(1).replace(".",",")+" %"; }
function ordi(n){ return n===1?"1er":n+"e"; }
function libTrim(t){ return t+(t===1?"er":"e")+" trimestre"; }
function libTrimMaj(t){ return t+(t===1?"er":"e")+" TRIMESTRE"; }

/* --- Élèves ---------------------------------------------------------- */
function eleve(id){ return S.eleves.find(e=>e.id===id); }
/* Élève parti en cours d'année (abandon, transfert, exclusion) : e.depart =
   {t: trimestre du départ, motif, date}. Il compte dans les trimestres
   antérieurs, et dans celui du départ s'il y a été évalué ; plus ensuite.
   Pour la saisie, il reste proposé jusqu'au trimestre de son départ. */
function evalueEn(e,t){
  const p=e.id+"|"+t+"|";
  return Object.keys(S.notes).some(k=>k.indexOf(p)===0&&moyMatiere(S.notes[k])!==null);
}
function presentEn(e,t,pourSaisie){
  if(!e.depart) return true;
  const d=Number(e.depart.t)||0;
  if(t<d) return true; if(t>d) return false;
  return pourSaisie?true:evalueEn(e,t);
}
function elevesDe(cid,t,pourSaisie){ return S.eleves.filter(e=>e.classeId===cid&&(t?presentEn(e,t,pourSaisie):!e.depart))
  .sort((a,b)=>a.nom.localeCompare(b.nom,"fr")); }
function elevesTousDe(cid){ return S.eleves.filter(e=>e.classeId===cid).sort((a,b)=>a.nom.localeCompare(b.nom,"fr")); }
function partisDe(cid){ return elevesTousDe(cid).filter(e=>e.depart); }

/* --- Matières et coefficients ---------------------------------------- */
function coefOfficiels(c){
  const i=COLONNES.findIndex(x=>x.niveau===c.niveau&&x.serie===c.serie);
  if(i<0) return [];
  const out=[];
  COEF_LIGNES.forEach(function(l){
    if(!l.co[i]) return;
    out.push({lib:l.disc, coef:l.co[i], active:!l.opt, opt:!!l.opt, motif:""});
  });
  return out;
}
function matieresDe(c){
  if(!S.matieres[c.id]){ S.matieres[c.id]=coefOfficiels(c); memoriser(); }
  return S.matieres[c.id];
}
/* Ordre d'affichage : le français toujours en tête, l'éducation physique et
   sportive toujours en dernier ; les autres matières gardent leur ordre. */
function rangMatiere(lib){
  const l=String(lib||"").toLowerCase();
  if(/^fran[cç]ais/.test(l)) return 0;
  if(/physique et sportive/.test(l)||/^e\.?p\.?s\.?$/.test(l)) return 2;
  return 1;
}
function matieresActives(c){
  return matieresDe(c).filter(m=>m.active).map((m,i)=>({m:m,i:i}))
    .sort((a,b)=>rangMatiere(a.m.lib)-rangMatiere(b.m.lib)||a.i-b.i).map(x=>x.m);
}
function totalCoef(c){ let t=0; matieresActives(c).forEach(m=>t+=Number(m.coef)||0); return t; }
/* v21 : une grille officielle de l'enseignement général (valeurs confirmées
   par la DPESFPT) est prête d'office, tant que ses matières et ses coefficients
   n'ont pas été modifiés. Cocher ou décocher « Enseignée » ne la modifie pas.
   Une grille modifiée, ou saisie à la main (enseignement technique), doit
   toujours être confirmée. */
function grilleOfficielleIntacte(c){
  const off=coefOfficiels(c), ms=S.matieres[c.id]||off;
  if(!off.length||ms.length!==off.length) return false;
  return off.every(o=>ms.some(m=>m.lib===o.lib&&Number(m.coef)===Number(o.coef)));
}
function coefsPrets(c){
  const a=matieresActives(c);
  return a.length>0 && a.every(m=>Number(m.coef)>0) && (!!S.coefsOk[c.id]||grilleOfficielleIntacte(c));
}
/* Matières obligatoires non assurées : remonté à la DPESFPT */
function manquesDe(c){ return matieresDe(c).filter(m=>!m.active&&!m.opt); }

/* --- Notes ------------------------------------------------------------ */
function cleN(eid,t,lib){ return eid+"|"+t+"|"+lib; }
function noteDe(eid,t,lib){ return S.notes[cleN(eid,t,lib)]||{d1:"",d2:"",md:"",compo:""}; }
function poserNote(eid,t,lib,champ,val){
  const k=cleN(eid,t,lib);
  const n=S.notes[k]||{d1:"",d2:"",md:"",compo:""};
  n[champ]=val;
  if(!n.d1&&!n.d2&&!n.md&&!n.compo) delete S.notes[k]; else S.notes[k]=n;
  modifie();
}
/* Deux devoirs saisis : l'application fait la moyenne. Sinon la moyenne
   des devoirs peut être écrite directement par la vie scolaire. */
function moyDevoirs(n){
  const a=nbr(n.d1), b=nbr(n.d2);
  if(a!==null&&b!==null) return a2((a+b)/2);
  if(a!==null) return a2(a);
  if(b!==null) return a2(b);
  return nbr(n.md);
}
/* Moyenne d'une matière : devoirs 40 %, composition 60 %.
   Trimestre sans composition : la moyenne est celle des devoirs. */
function moyMatiere(n){
  const d=moyDevoirs(n), c=nbr(n.compo);
  if(d===null&&c===null) return null;
  if(c===null) return d;
  if(d===null) return a2(c);
  return a2(d*0.4+c*0.6);
}

/* --- Vie scolaire ----------------------------------------------------- */
function vieVide(){ return {absJ:"",absN:"",ret:"",conduite:"",sanc:"",retrait:""}; }
function vieDe(eid,t){
  const v=S.vie[eid+"|"+t]||vieVide();
  const tb=(typeof totauxBillets==="function")?totauxBillets(eid,t):null;
  return tb?Object.assign({},v,{absJ:tb.absJ,absN:tb.absN,ret:tb.ret,depuisRegistre:true}):v;
}
function poserVie(eid,t,champ,val){
  const k=eid+"|"+t, v=Object.assign(vieVide(),S.vie[k]);
  v[champ]=val; S.vie[k]=v; modifie();
}

/* --- Sanction et distinction, automatiques ---------------------------- */
function sanctionAuto(moy,conduite,absN,sancDisc){
  if(sancDisc) return sancDisc;
  if(moy===null) return "";
  const B=bareme();
  const digne = B.conduites.indexOf(conduite)>=0 && (nbr(absN)||0)<=B.absMax;
  if(digne){
    if(moy>=B.felicitations)  return "Félicitations";
    if(moy>=B.honneur)        return "Tableau d'honneur";
    if(moy>=B.encouragements) return "Encouragements";
  }
  if(moy<B.avertTravail) return "Avertissement travail";
  return "Néant";
}

/* --- Bulletin d'un élève ---------------------------------------------- */
function bulletinDe(el,t){
  const c=classe(el.classeId);
  if(!c) return null;
  const mats=matieresActives(c);
  let tp=0, tc=0, manque=0;
  const lignes=[];
  mats.forEach(function(m){
    const n=noteDe(el.id,t,m.lib), moy=moyMatiere(n), co=Number(m.coef)||0;
    if(moy===null) manque++; else tp=a2(tp+a2(moy*co));
    tc+=co;
    lignes.push({lib:m.lib,coef:co,md:moyDevoirs(n),compo:nbr(n.compo),moy:moy,
      pd:moy===null?null:a2(moy*co), app:moy===null?"":mention(moy)});
  });
  const v=vieDe(el.id,t), ret=nbr(v.retrait)||0, apres=a2(tp-ret);
  const gen=(tc>0&&manque<mats.length)?a2(apres/tc):null;
  return {lignes:lignes,totalPond:tp,totalCoef:tc,retrait:ret,apres:apres,gen:gen,
    mention:gen===null?"":mention(gen),manque:manque,vie:v,
    sanction:sanctionAuto(gen,v.conduite,v.absN,v.sanc)};
}
function moyAnnuelle(el){
  const m=[1,2,3].map(t=>{const b=bulletinDe(el,t); return b?b.gen:null;})
                 .filter(x=>x!==null);
  return m.length===3 ? a2((m[0]+m[1]+m[2])/3) : null;
}
/* v23 — Règles de fin d'année.
   Premier cycle : 6e à 3e ; second cycle : 2nde à Tle. Classes d'examen : 3e et Tle.
   - moyenne annuelle >= 10 : passe ; de 7 à 9,99 : redouble ; moins de 7 : exclu(e) ;
   - un élève qui a déjà redoublé une classe du même cycle (colonne « Classe(s)
     redoublée(s) » de sa fiche) et qui devrait redoubler encore est exclu(e) ;
   - en classe d'examen, l'élève qui a au moins 7 « redouble en cas d'échec »
     (ou est « exclu(e) en cas d'échec » s'il a déjà redoublé dans le cycle). */
function cycleNiveau(n){
  const s=String(n||"").toLowerCase();
  if(/^[6543]/.test(s)) return 1;
  if(/^(2|1|t)/.test(s)) return 2;
  return 0;
}
const MOTIFS_NIVEAU=[[/\b(6 ?(e|eme|ieme|em)?|sixieme)\b/,"6e"],[/\b(5 ?(e|eme|ieme|em)?|cinquieme)\b/,"5e"],
  [/\b(4 ?(e|eme|ieme|em)?|quatrieme)\b/,"4e"],[/\b(3 ?(e|eme|ieme|em)?|troisieme)\b/,"3e"],
  [/\b(2 ?(nde|nd|de)|seconde)\b/,"2nde"],[/\b(1 ?(re|ere|er)|premiere)\b/,"1re"],[/\b(t ?(le|erm)|terminale)\b/,"Tle"]];
function niveauxRedoubles(v,c){
  const x=String(v||"").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[.,;\/+&-]/g," ").replace(/\s+/g," ").trim();
  if(!x||/^(neant|non|n|nr|aucun|aucune|0|nouveau|nouvelle|rien)$/.test(x)) return {liste:[],lisible:true};
  if(/^(oui|o|r|x|1|redoublant|redoublante)$/.test(x)) return {liste:c?[c.niveau]:[],lisible:!!c};
  const l=[]; MOTIFS_NIVEAU.forEach(function(m){ if(m[0].test(x)) l.push(m[1]); });
  return {liste:l,lisible:l.length>0};
}
/* Classe(s) déjà redoublée(s) dans le cycle de la classe actuelle */
function redoublementCycle(el,c){
  if(!el||!c) return {oui:false,lisible:true,liste:[]};
  const r=niveauxRedoubles(el.redouble,c), cy=cycleNiveau(c.niveau);
  const l=r.liste.filter(n=>cy&&cycleNiveau(n)===cy);
  return {oui:l.length>0,lisible:r.lisible,liste:l};
}
function categorieAnnuelle(m,el,c){
  if(m===null||m===undefined) return "";
  if(m>=10) return "passe";
  if(m>=7) return redoublementCycle(el,c).oui?"exclu":"redouble";
  return "exclu";
}
function decisionAnnuelle(m,el,c){
  if(m===null||m===undefined) return "";
  if(estClasseExamen(c)&&m>=7)
    return redoublementCycle(el,c).oui?"Exclu(e) en cas d'échec":"Redouble en cas d'échec";
  const k=categorieAnnuelle(m,el,c);
  return k==="passe"?"Passe en classe supérieure":(k==="redouble"?"Redouble":"Exclu(e)");
}

/* --- Classement et statistiques --------------------------------------- */
function classementDe(cid,t){
  const l=elevesDe(cid,t).map(function(e){
    const b=bulletinDe(e,t); return b&&b.gen!==null?{el:e,b:b,moy:b.gen}:null;
  }).filter(Boolean);
  l.sort((a,b)=>b.moy-a.moy||a.el.nom.localeCompare(b.el.nom,"fr"));
  l.forEach((x,i)=>x.rang=i+1);
  return l;
}
function rangDe(cid,t,eid){
  const x=classementDe(cid,t).find(y=>y.el.id===eid); return x?x.rang:null;
}
function statsDe(cid,t){
  const cl=classementDe(cid,t), tous=elevesDe(cid,t);
  const g=cl.filter(x=>x.el.sexe==="M"), f=cl.filter(x=>x.el.sexe==="F");
  const moy=a=>{ if(!a.length) return null; let s=0; a.forEach(x=>s+=x.moy); return a2(s/a.length); };
  const cnt=(a,fn)=>a.filter(fn).length;
  const reu=x=>x.moy>=10, red=x=>x.moy>=7&&x.moy<10, exc=x=>x.moy<7;
  const ext=a=>a.length?{prem:a[0],dern:a[a.length-1]}:null;
  return {cl:cl,g:g,f:f,
    inscrits:tous.length,
    inscritsG:tous.filter(e=>e.sexe==="M").length,
    inscritsF:tous.filter(e=>e.sexe==="F").length,
    evalues:cl.length, nG:g.length, nF:f.length,
    moyG:moy(g),moyF:moy(f),moyT:moy(cl),
    reuG:cnt(g,reu),reuF:cnt(f,reu),reuT:cnt(cl,reu),
    redG:cnt(g,red),redF:cnt(f,red),redT:cnt(cl,red),
    excG:cnt(g,exc),excF:cnt(f,exc),excT:cnt(cl,exc),
    exG:ext(g),exF:ext(f),exT:ext(cl)};
}

/* --- Statistiques de tout l'établissement ----------------------------- */
function statsEtab(t){
  const lignes=[], tous=[];
  S.classes.forEach(function(c){
    const pret=coefsPrets(c), st=statsDe(c.id,t);

  const moy=a=>{ if(!a.length) return null; let v=0; a.forEach(x=>v+=x.moy); return a2(v/a.length); };
  const cnt=(a,fn)=>a.filter(fn).length;
  const reu=x=>x.moy>=10, red=x=>x.moy>=7&&x.moy<10, exc=x=>x.moy<7;
  const ext=a=>a.length?{prem:a[0],dern:a[a.length-1]}:null;
  return {lignes:lignes,tous:tous,g:g,f:f,
    classes:S.classes.length,
    classesPretes:lignes.filter(l=>l.pret).length,
    inscrits:S.eleves.length,
    inscritsG:S.eleves.filter(e=>e.sexe==="M").length,
    inscritsF:S.eleves.filter(e=>e.sexe==="F").length,
    evalues:tous.length,nG:g.length,nF:f.length,
    moyG:moy(g),moyF:moy(f),moyT:moy(tous),
    reuG:cnt(g,reu),reuF:cnt(f,reu),reuT:cnt(tous,reu),
    redG:cnt(g,red),redF:cnt(f,red),redT:cnt(tous,red),
    excG:cnt(g,exc),excF:cnt(f,exc),excT:cnt(tous,exc),
    exG:ext(g),exF:ext(f),exT:ext(tous)};
}

/* --- Avancement du volet ---------------------------------------------- */
function avancementNotes(){
  const a={};
  a.eleves = S.eleves.length ? "ok" : "";
  a.elevesDetail = S.eleves.length ? S.eleves.length+" élève(s) inscrit(s)" : "Aucun élève";
  const prets=S.classes.filter(c=>coefsPrets(c)).length;
  a.mat = (S.classes.length&&prets===S.classes.length)?"ok":"";
  a.matDetail = S.classes.length ? prets+" classe(s) sur "+S.classes.length+" prête(s)"
                                 : "Enregistrez d'abord vos classes";
  let saisies=0, attendues=0;
  S.classes.forEach(function(c){
    const els=elevesDe(c.id,trimActif,true), ms=matieresDeMoi(c);
    attendues+=els.length*ms.length;
    els.forEach(e=>ms.forEach(function(m){
      if(moyMatiere(noteDe(e.id,trimActif,m.lib))!==null) saisies++;
    }));
  });
  a.notes = attendues&&saisies===attendues ? "ok" : "";
  a.notesDetail = attendues ? saisies+" note(s) sur "+attendues+" — "+libTrim(trimActif)
                            : "Enregistrez d'abord élèves et matières";
  a.pret = a.eleves==="ok" && a.mat==="ok" && saisies>0;
  a.saisies=saisies; a.attendues=attendues;
  return a;
}

function anneeEntreeDefaut(){
  const m=String(S.etab.annee||"").match(/(\d{4})/);
  return m ? m[1].slice(2) : String(new Date().getFullYear()).slice(2);
}
function codeEtab(){ return String(S.etab.codeEtab||"").toUpperCase().replace(/[^A-Z0-9]/g,""); }
function ordreEleves(liste){
  return liste.slice().sort(function(a,b){
    const ca=classe(a.classeId), cb=classe(b.classeId);
    const ka=(ca?ca.code:"")+"|"+(a.nom||""), kb=(cb?cb.code:"")+"|"+(b.nom||"");
    return ka.localeCompare(kb,"fr");
  });
}
/* Matricule = code de l'établissement + année d'entrée + numéro d'ordre.
   L'année d'entrée reste collée à l'élève : elle ne bouge pas quand il monte de classe. */
function attribuerMatricules(){
  const code=codeEtab();
  if(!code){
    alert("Renseignez d'abord le code de l'établissement dans « Mon établissement ».");
    return;
  }
  const max={};
  S.eleves.forEach(function(e){
    const m=String(e.matricule||"");
    if(m.indexOf(code)!==0) return;
    const r=m.slice(code.length);
    if(!/^\d{5}$/.test(r)) return;
    const an=r.slice(0,2), num=+r.slice(2);
    if(!max[an]||num>max[an]) max[an]=num;
  });
  const parDef=anneeEntreeDefaut();
  let k=0;
  ordreEleves(S.eleves).forEach(function(e){
    if(e.matricule) return;
    const an=e.anEntree||parDef;
    max[an]=(max[an]||0)+1;
    e.anEntree=an;
    e.matricule=code+an+String(max[an]).padStart(3,"0");
    k++;
  });
  modifie(); rendre();
  alert(k? k+" matricule(s) attribué(s)." : "Tous les élèves ont déjà un matricule.");
}
function poidsMemoire(){
  let o=0;
  try{ o=JSON.stringify(S).length; }catch(e){}
  return o;
}
function litPoids(){
  const o=poidsMemoire();
  return o>1048576 ? (o/1048576).toFixed(1)+" Mo" : Math.round(o/1024)+" Ko";
}

function demarrerCam(){
  const v=document.getElementById("camVid"), m=document.getElementById("camMsg");
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    if(m) m.textContent="Cet appareil ou ce navigateur ne donne pas accès à la caméra. Utilisez le choix d'image ci-dessous.";
    if(v) v.style.display="none";
    return;
  }
  navigator.mediaDevices.getUserMedia({video:{width:{ideal:640},height:{ideal:480}},audio:false})
    .then(function(st){
      fluxCam=st;
      const vv=document.getElementById("camVid");
      if(!vv){ arreterCam(); return; }
      vv.srcObject=st;
      const mm=document.getElementById("camMsg");
      if(mm) mm.textContent="Cadrez le visage, puis « Prendre la photo ».";
    })
    .catch(function(){
      const mm=document.getElementById("camMsg"), vv=document.getElementById("camVid");
      if(mm) mm.textContent="La caméra n'a pas pu s'ouvrir : elle est absente, refusée ou déjà utilisée. Utilisez le choix d'image ci-dessous.";
      if(vv) vv.style.display="none";
    });
}
function arreterCam(){
  if(fluxCam){ try{ fluxCam.getTracks().forEach(t=>t.stop()); }catch(e){} fluxCam=null; }
}
function fermerCam(){ arreterCam(); fermer(); rendre(); }
/* Découpe au format 3 sur 4 centré, puis réduction : une photo de carte pèse
   quelques kilo-octets, sinon la mémoire de l'appareil serait vite pleine. */
function cadrerEtEnregistrer(src,l,ht){
  const cv=document.createElement("canvas");
  cv.width=PHOTO_L; cv.height=PHOTO_H;
  const rv=PHOTO_L/PHOTO_H;
  let sw=l, sh=ht;
  if(l/ht>rv) sw=Math.round(ht*rv); else sh=Math.round(l/rv);
  const sx=Math.round((l-sw)/2), sy=Math.round((ht-sh)/2);
  cv.getContext("2d").drawImage(src,sx,sy,sw,sh,0,0,PHOTO_L,PHOTO_H);
  return cv.toDataURL("image/jpeg",0.7);
}
function enregistrerPhoto(d){
  const e=eleve(eleveCam); if(!e) return;
  e.photo=d;
  try{ memoriser(); }
  catch(err){ alert("La mémoire de l'appareil est pleine : la photo n'a pas pu être enregistrée."); return; }
  modifie();
}
function prendrePhoto(){
  const v=document.getElementById("camVid");
  if(!v||!v.videoWidth){ alert("La caméra n'est pas prête."); return; }
  const cv=document.createElement("canvas"); cv.width=v.videoWidth; cv.height=v.videoHeight;
  cv.getContext("2d").drawImage(v,0,0);
  arreterCam();
  ouvrirCadrage(cv.toDataURL("image/jpeg",0.92),eleveCam);
}
function photoFichier(input){
  const f=input.files[0];
  if(!f){ return; }
  const r=new FileReader();
  r.onload=function(){
    ouvrirCadrage(r.result,eleveCam);
  };
  r.readAsDataURL(f);
}
function retirerPhoto(){
  const e=eleve(eleveCam); if(!e) return;
  delete e.photo; modifie(); fermerCam();
}

  if(ms.findIndex(m=>m.lib===matiereNotes)<0) matiereNotes=ms[0].lib;
  h+='<div class="champ"><label>Matière</label><select onchange="matiereNotes=this.value;rendre()">';
  ms.forEach(function(m){
    const n=els.filter(e=>moyMatiere(noteDe(e.id,trimActif,m.lib))!==null).length;
    h+='<option'+(m.lib===matiereNotes?' selected':'')+'>'+esc(m.lib)+'</option>';
  });
  h+='</select></div>';
  const faits=els.filter(e=>moyMatiere(noteDe(e.id,trimActif,matiereNotes))!==null).length;
  h+='<div id="cptNotes" class="'+(faits===els.length?'info':'prudence')+'">'+faits+' note(s) sur '+els.length
   +' pour cette matière — '+libTrim(trimActif)
   +(faits<els.length?' <button class="btn sec" style="margin-left:8px;padding:4px 10px;font-size:13.5px" onclick="prochaineManquante()">Aller à la prochaine note manquante</button>':'')+'</div>'
   +'<p class="aide">Saisie rapide : tapez la note puis <b>Entrée</b> pour passer à l\'élève suivant. '
   +'Pour coller une colonne copiée dans Excel, collez-la dans la case du premier élève : un aperçu s\'affiche avant tout enregistrement.</p>'
   +'<div id="msgNotes" class="msgnote"></div>';
  h+='<div class="defile"><table class="tsaisie enliste"><tr><th>N°</th><th class="nomcol">Nom et prénoms</th>'
   +'<th>Devoir 1</th><th>Devoir 2</th><th>Moyenne des devoirs</th><th>Composition</th>'
   +'<th>Moyenne</th><th>Appréciation</th></tr>';
  els.forEach(function(e,i){
    const n=noteDe(e.id,trimActif,matiereNotes), auto=(nbr(n.d1)!==null&&nbr(n.d2)!==null);
    const mm=moyMatiere(n);
    h+='<tr><td>'+(i+1)+'</td><td class="nomcol">'+esc(e.nom)+'</td>'
     +champNote(i,e.id,"d1",n.d1)+champNote(i,e.id,"d2",n.d2)
     +champNote(i,e.id,"md",auto?n2(moyDevoirs(n)):(n.md||""),auto)
     +champNote(i,e.id,"compo",n.compo)
     +'<td id="m_'+e.id+'"><strong>'+n2(mm)+'</strong></td>'
     +'<td id="a_'+e.id+'" style="text-align:left">'+(mm===null?"":mention(mm))+'</td></tr>';
  });
  h+='</table></div>';
  h+='<div class="barre-actions"><button class="btn sec" onclick="imprimer(\'fichenotes\')">'
   +'Imprimer la fiche de notes vierge</button></div>';
  return h;
};
function chN(eid,ch,v){
  return '<td><input value="'+esc(v||"")+'" onchange="majNote(\''+eid+'\',\''+ch+'\',this.value)" '
   +'style="width:64px" inputmode="decimal"></td>';
}
function majNote(eid,ch,v){
  v=String(v).trim();
  const x=nbr(v);
  if(v!==""&&(x===null||x<0||x>20)){ alert("Note attendue entre 0 et 20."); rendre(); return; }
  poserNote(eid,trimActif,matiereNotes,ch,v);
  if(ch==="d1"||ch==="d2"){ rendre(); return; }
  const n=noteDe(eid,trimActif,matiereNotes), mm=moyMatiere(n);
  const cm=document.getElementById("m_"+eid), ca=document.getElementById("a_"+eid);
  if(cm) cm.innerHTML='<strong>'+n2(mm)+'</strong>';
  if(ca) ca.textContent=(mm===null?"":mention(mm));
}

/* v23 — Notes manquantes : depuis l'alerte des bulletins, la liste des notes qui
   manquent, et pour chacune un accès direct à la bonne case de saisie. */
function notesManquantes(c,t){
  const l=[]; if(!c) return l;
  const els=elevesDe(c.id,t), ms=matieresActives(c);
  ms.forEach(m=>els.forEach(function(e){ if(moyMatiere(noteDe(e.id,t,m.lib))===null) l.push({e:e,m:m}); }));
  return l;
}
function voirManquantes(){
  const c=classe(classeNotes); if(!c) return;
  const l=notesManquantes(c,trimActif);
  if(!l.length){ alert("Aucune note ne manque pour ce trimestre."); rendre(); return; }
  const parM={}; l.forEach(x=>{ (parM[x.m.lib]=parM[x.m.lib]||[]).push(x.e); });
  let h='<p class="aide" style="margin-top:0">'+esc(c.code)+' · '+esc(libTrim(trimActif))+' — '+l.length+' note(s) manquante(s). '
   +'Touchez un nom pour ouvrir directement sa case de saisie.</p>', vus=0;
  Object.keys(parM).forEach(function(lib){
    h+='<div style="margin:14px 0 6px;font-size:15px;font-weight:700">'+esc(lib)+' <span class="aide" style="font-weight:400">('+parM[lib].length+')</span></div><div class="barre-actions" style="margin:0;flex-wrap:wrap">';
    parM[lib].forEach(function(e){
      if(vus++>=120) return;
      h+='<button class="btn sec" style="padding:6px 10px;font-size:14px" onclick="ouvrirNoteManquante(\''+e.id+'\',\''+encodeURIComponent(lib).replace(/'/g,"%27")+'\')">'+esc(e.nom)+'</button>';
    });
    h+='</div>';
  });
  if(vus>120) h+='<p class="aide">Seules les 120 premières sont affichées : complétez-les, puis revenez à cette liste.</p>';
  ouvrir("Notes manquantes",h,[{texte:"Fermer",action:"fermer()",style:"sec"}]);
  const f=document.getElementById("fenetre"); if(f) f.classList.add("large");
}
let noteCible=null;
function ouvrirNoteManquante(eid,libEnc){
  fermer();
  matiereNotes=decodeURIComponent(libEnc); noteCible=eid;
  go("notes");
  setTimeout(ciblerNote,40);
}
function ciblerNote(){
  if(!noteCible) return;
  const n=noteDe(noteCible,trimActif,matiereNotes);
  const ch=nbr(n.d1)===null?"d1":(nbr(n.d2)===null?"d2":"compo");
  const x=document.querySelector('input.sn[data-e="'+noteCible+'"][data-ch="'+ch+'"]')
       ||document.querySelector('input.sn[data-e="'+noteCible+'"]');
  noteCible=null;
  if(!x) return;
  const tr=x.closest("tr"); if(tr){ tr.classList.add("cible"); setTimeout(()=>tr.classList.remove("cible"),4000); }
  x.scrollIntoView({block:"center"}); x.focus();
}
function prochaineManquante(){
  const c=classe(classeNotes); if(!c) return;
  const els=elevesDe(c.id,trimActif,true);
  const e=els.find(e=>moyMatiere(noteDe(e.id,trimActif,matiereNotes))===null);
  if(!e){ alert("Toutes les notes de cette matière sont saisies."); return; }
  noteCible=e.id; ciblerNote();
}
/* v23 — Contrôle du redoublement, au 3e trimestre : élèves ayant déjà redoublé
   une classe du cycle, et mentions illisibles, à vérifier avant d'imprimer. */
function controleRedoublementHTML(c,els){
  const deja=[], illis=[];
  els.forEach(function(e){
    const r=redoublementCycle(e,c);
    if(r.oui) deja.push(e.nom+" ("+r.liste.join(", ")+")");
    else if(!r.lisible) illis.push(e.nom+" : « "+e.redouble+" »");
  });
  if(!deja.length&&!illis.length) return "";
  return '<div class="'+(illis.length?'prudence':'info')+'"><b>Contrôle du redoublement.</b> '
   +(deja.length?deja.length+' élève(s) ont déjà redoublé une classe du cycle : '+esc(deja.join(" ; "))
     +'. S\'ils doivent redoubler encore, la décision sera « Exclu(e) »'+(estClasseExamen(c)?' (en classe d\'examen : « Exclu(e) en cas d\'échec »)':'')+'. ':'')
   +(illis.length?'<br>Mention de redoublement non reconnue pour '+illis.length+' élève(s) : '+esc(illis.join(" ; "))
     +'. Écrivez la classe redoublée (par exemple « 5e » ou « 6e, 4e ») ou « Néant ».':'')
   +' Vérifiez la colonne « Classe(s) redoublée(s) » dans Mes élèves avant d\'imprimer.</div>';
}

function chV(eid,ch,v,i){
  return '<td><input class="sv" data-e="'+eid+'" data-ch="'+ch+'" data-i="'+i+'" value="'+esc(v||"")+'" '
   +'onkeydown="toucheVie(event,this)" onchange="validerVie(this)" onfocus="this.select()" '
   +'style="width:64px" inputmode="decimal" enterkeyhint="next" autocomplete="off"></td>';
}
function validerVie(inp){
  const v=String(inp.value).trim(), x=nbr(v);
  if(v!==""&&(x===null||x<0)){ inp.classList.add("err"); return false; }
  inp.classList.remove("err");
  poserVie(inp.dataset.e,trimActif,inp.dataset.ch,v.replace(".",","));
  return true;
}
function allerVie(inp,d){
  let i=+inp.dataset.i+d;
  while(true){
    const s=document.querySelector('input.sv[data-ch="'+inp.dataset.ch+'"][data-i="'+i+'"]');
    if(!s) return;
    if(!s.disabled){ s.focus(); s.select(); return; }
    i+=d;
  }
}
function toucheVie(ev,inp){
  if(ev.key==="Enter"||ev.key==="ArrowDown"){ ev.preventDefault(); if(validerVie(inp)) allerVie(inp,1); }
  else if(ev.key==="ArrowUp"){ ev.preventDefault(); if(validerVie(inp)) allerVie(inp,-1); }
}
function chR(v){ return '<td><input value="'+esc(v||"0")+'" disabled title="Calculé à partir du registre des billets" style="width:64px;background:#F1F4F2"></td>'; }
function majVie(eid,ch,v){ poserVie(eid,trimActif,ch,String(v).trim()); rendre(); }

VUES.bulletins=function(){
  let h='<h1>Bulletins et statistiques</h1>';
  if(!S.classes.length) return h+sansClasse();
  h+='<div class="rangee">'+selClasseN()+selTrimN()+'</div>';
  if(!classeNotes) return h;
  const c=classe(classeNotes); if(!c){ classeNotes=""; return h; }
  const els=elevesDe(c.id,trimActif), ms=matieresActives(c);
  const pb=[];
  if(!els.length) pb.push("Aucun élève n'est enregistré dans cette classe.");
  if(!ms.length)  pb.push("Aucune matière enseignée n'est cochée pour cette classe.");
  if(!coefsPrets(c)) pb.push("La grille des coefficients n'est pas confirmée : "
    +"les moyennes générales et les rangs restent indisponibles.");
  const manq=notesManquantes(c,trimActif), sans=manq.length;
  if(sans) pb.push(sans+" note(s) manquante(s) sur "+(els.length*ms.length)
    +" pour ce trimestre : les élèves concernés auront une moyenne incomplète.");
